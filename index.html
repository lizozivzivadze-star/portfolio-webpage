    play: '<svg class="w-12 h-12 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'
  };

  // ============================================================
  // UTILITIES
  // ============================================================
  function escapeHtml(str) {
    if (str == null) return "";
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function extractVideoId(url) {
    const clean = url.split("?")[0];
    const parts = clean.split("/");
    return parts[parts.length - 1];
  }

  function tabStyle(isActive) {
    return isActive
      ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors"
      : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors";
  }

  function skillTabStyle(isActive) {
    return isActive
      ? "px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap bg-[#0284c7] text-white border-[#0284c7] font-bold transition-colors"
      : "px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7] transition-colors";
  }

  function subTabStyle(isActive) {
    return isActive
      ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors"
      : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors";
  }

  function uniqueCategories(list) {
    const seen = [];
    list.forEach(function (item) {
      if (seen.indexOf(item.category) === -1) seen.push(item.category);
    });
    return seen;
  }

  let toastTimer = null;
  function showToast(message, kind) {
    const toast = document.getElementById("toast");
    if (!toast) return;
    toast.textContent = message;
    toast.style.backgroundColor = kind === "error" ? "#fef2f2" : "#f0f9ff";
    toast.style.color = kind === "error" ? "#b91c1c" : "#0369a1";
    toast.style.border = kind === "error" ? "1px solid #fecaca" : "1px solid #bae6fd";
    toast.classList.remove("toast-hidden");
    toast.classList.add("toast-visible");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.classList.remove("toast-visible");
      toast.classList.add("toast-hidden");
    }, 3200);
  }

  // ============================================================
  // RENDER: HEADER + HERO
  // ============================================================
  function renderHero() {
    const p = PORTFOLIO_DATA.personal;

    document.getElementById("header-avatar").src = p.avatarUrl;
    document.getElementById("header-name").textContent = p.name;

    document.getElementById("hero-avatar").src = p.avatarUrl;
    document.getElementById("hero-name").textContent = p.name;
    document.getElementById("hero-title").textContent = p.title;
    document.getElementById("hero-location").textContent = p.location;
    document.getElementById("hero-statement").textContent = p.statement;

    const telHref = "tel:" + p.phone.replace(/[^+\d]/g, "");
    const contacts = document.getElementById("hero-contacts");
    contacts.innerHTML =
      '<a href="' + telHref + '" aria-label="Call Lizi" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICONS.phone + "</a>" +
      '<a href="' + escapeHtml(p.whatsapp) + '" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICONS.whatsapp + "</a>" +
      '<a href="mailto:' + escapeHtml(p.email) + '" aria-label="Email" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICONS.mail + "</a>" +
      '<a href="' + escapeHtml(p.linkedin) + '" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICONS.linkedin + "</a>" +
      '<a href="' + escapeHtml(p.github) + '" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICONS.github + "</a>";
  }

  // ============================================================
  // RENDER: PROJECTS
  // ============================================================
  function renderProjectSubTabContent(project, tab) {
    if (tab === "equipment") {
      return project.details.equipment
        .map(function (item) {
          return '<span class="font-mono text-[12px] bg-slate-100 text-[#0f172a] px-2 py-1 rounded border border-[#e2e8f0]">' + escapeHtml(item) + "</span>";
        })
        .join("");
    }
    if (tab === "urls") {
      return (
        '<div class="w-full flex flex-col gap-2">' +
        project.details.urls
          .map(function (u) {
            return (
              '<a href="' + escapeHtml(u.url) + '" target="_blank" rel="noopener noreferrer" class="text-[13px] font-mono font-bold text-white bg-[#0284c7] hover:bg-[#0369a1] rounded-md px-3 py-2 text-center block transition-colors">' +
              escapeHtml(u.label) +
              "</a>"
            );
          })
          .join("") +
        "</div>"
      );
    }
    // overview (default)
    return (
      '<div class="w-full flex flex-col gap-2">' +
      '<div><span class="font-mono text-[12px] font-bold text-[#0284c7]">OBJECTIVE</span><p class="text-[14px] text-[#0f172a] mt-0.5 leading-relaxed">' +
      escapeHtml(project.details.overview.objective) +
      "</p></div>" +
      '<div><span class="font-mono text-[12px] font-bold text-[#0d9488]">RESULTS</span><p class="text-[14px] text-[#0f172a] mt-0.5 leading-relaxed">' +
      escapeHtml(project.details.overview.results) +
      "</p></div>" +
      "</div>"
    );
  }

  function renderProjectCard(project) {
    const currentSubTab = APP_STATE.projectSubTabs[project.id] || "overview";
    const videoId = extractVideoId(project.videoUrl);
    return (
      '<div class="w-[calc(100vw-34px)] max-w-[327px] md:w-[327px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs h-auto min-h-fit overflow-visible select-none touch-pan-x">' +
      "<div>" +
      '<div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden select-none" id="media-' + project.id + '">' +
      '<img src="https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="' + escapeHtml(project.title) + ' preview" />' +
      '<button data-action="play-video" data-id="' + project.id + '" class="absolute inset-0 flex items-center justify-center bg-black/40 hover:bg-black/20 text-white transition-colors" aria-label="Play video">' +
      ICONS.play +
      "</button>" +
      "</div>" +
      '<h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">' + escapeHtml(project.title) + "</h3>" +
      '<p class="text-[14px] text-[#475569] mb-3 leading-relaxed">' + escapeHtml(project.summary) + "</p>" +
      '<div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">' +
      '<button data-action="project-subtab" data-id="' + project.id + '" data-tab="overview" class="' + subTabStyle(currentSubTab === "overview") + '">OVERVIEW</button>' +
      '<button data-action="project-subtab" data-id="' + project.id + '" data-tab="equipment" class="' + subTabStyle(currentSubTab === "equipment") + '">EQUIPMENT</button>' +
      '<button data-action="project-subtab" data-id="' + project.id + '" data-tab="urls" class="' + subTabStyle(currentSubTab === "urls") + '">URL</button>' +
      "</div>" +
      '<div id="content-' + project.id + '" class="text-[14px] text-[#0f172a] flex flex-wrap gap-1.5 break-words">' +
      renderProjectSubTabContent(project, currentSubTab) +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  function renderProjectTabs() {
    const categories = ["All"].concat(uniqueCategories(PORTFOLIO_DATA.projects));
    const el = document.getElementById("project-tabs");
    el.innerHTML = categories
      .map(function (cat) {
        return '<button data-action="select-project-tab" data-value="' + escapeHtml(cat) + '" class="' + tabStyle(APP_STATE.activeProjectTab === cat) + '">' + escapeHtml(cat.toUpperCase()) + "</button>";
      })
      .join("");
  }

  function renderProjectsCarousel() {
    const container = document.getElementById("projects-carousel-container");
    const filtered = PORTFOLIO_DATA.projects.filter(function (p) {
      return APP_STATE.activeProjectTab === "All" || p.category === APP_STATE.activeProjectTab;
    });
    container.innerHTML = filtered.map(renderProjectCard).join('<div class="w-2 shrink-0"></div>');
  }

  function renderProjects() {
    renderProjectTabs();
    renderProjectsCarousel();
  }

  // ============================================================
  // RENDER: SKILLS
  // ============================================================
  function renderSkillCategoryTabs() {
    const categories = Object.keys(PORTFOLIO_DATA.skills);
    const el = document.getElementById("skill-category-tabs");
    el.innerHTML = categories
      .map(function (cat) {
        return '<button data-action="select-skill-category" data-value="' + escapeHtml(cat) + '" class="' + skillTabStyle(APP_STATE.activeSkillCategory === cat) + '">' + escapeHtml(cat) + "</button>";
      })
      .join("");
  }

  function renderSkillsList() {
    const list = PORTFOLIO_DATA.skills[APP_STATE.activeSkillCategory] || [];
    const el = document.getElementById("skills-list");
    el.innerHTML = list
      .map(function (skill) {
        return (
          '<div class="mb-3 last:mb-0">' +
          '<div class="flex justify-between items-baseline text-[13px] mb-1">' +
          '<span class="text-[#0f172a] font-medium font-sans">' + escapeHtml(skill.name) + "</span>" +
          '<span class="text-[#475569] font-mono">' + skill.level + "%</span>" +
          "</div>" +
          '<div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">' +
          '<div class="h-full bg-[#0284c7] rounded-full" style="width:' + skill.level + '%"></div>' +
          "</div>" +
          "</div>"
        );
      })
      .join("");
  }

  function renderSkills() {
    renderSkillCategoryTabs();
    renderSkillsList();
  }

  // ============================================================
  // RENDER: EVENTS
  // ============================================================
  function renderEventSubTabContent(event, tab) {
    if (tab === "media") {
      return (
        '<div class="w-full grid grid-cols-2 gap-1.5">' +
        event.details.media
          .map(function (src) {
            return '<div class="aspect-video rounded-md overflow-hidden bg-slate-100"><img src="' + escapeHtml(src) + '" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="' + escapeHtml(event.title) + ' media" /></div>';
          })
          .join("") +
        "</div>"
      );
    }
    if (tab === "urls") {
      return (
        '<div class="w-full flex flex-col gap-2">' +
        event.details.urls
          .map(function (u) {
            return (
              '<a href="' + escapeHtml(u.url) + '" target="_blank" rel="noopener noreferrer" class="text-[13px] font-mono font-bold text-white bg-[#0284c7] hover:bg-[#0369a1] rounded-md px-3 py-2 text-center block transition-colors">' +
              escapeHtml(u.label) +
              "</a>"
            );
          })
          .join("") +
        "</div>"
      );
    }
    // overview (default)
    return (
      '<div class="w-full flex flex-col gap-2">' +
      '<div><span class="font-mono text-[12px] font-bold text-[#0284c7]">PARTICIPATION</span><p class="text-[14px] text-[#0f172a] mt-0.5 leading-relaxed">' +
      escapeHtml(event.details.overview.participation) +
      "</p></div>" +
      '<div><span class="font-mono text-[12px] font-bold text-[#0d9488]">OUTCOMES</span><p class="text-[14px] text-[#0f172a] mt-0.5 leading-relaxed">' +
      escapeHtml(event.details.overview.outcomes) +
      "</p></div>" +
      "</div>"
    );
  }

  function renderEventCard(event) {
    const currentSubTab = APP_STATE.eventSubTabs[event.id] || "overview";
    return (
      '<div class="w-[calc(100vw-34px)] max-w-[327px] md:w-[327px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs h-auto min-h-fit overflow-visible select-none touch-pan-x">' +
      "<div>" +
      '<div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden mb-2 select-none">' +
      '<img src="' + escapeHtml(event.imageUrl) + '" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="' + escapeHtml(event.title) + '" />' +
      "</div>" +
      '<h3 class="text-[18px] font-bold text-[#0f172a] mb-1 leading-snug">' + escapeHtml(event.title) + "</h3>" +
      '<p class="text-[14px] text-[#475569] mb-3 leading-relaxed">' + escapeHtml(event.summary) + "</p>" +
      '<div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">' +
      '<button data-action="event-subtab" data-id="' + event.id + '" data-tab="overview" class="' + subTabStyle(currentSubTab === "overview") + '">OVERVIEW</button>' +
      '<button data-action="event-subtab" data-id="' + event.id + '" data-tab="media" class="' + subTabStyle(currentSubTab === "media") + '">MEDIA</button>' +
      '<button data-action="event-subtab" data-id="' + event.id + '" data-tab="urls" class="' + subTabStyle(currentSubTab === "urls") + '">URL</button>' +
      "</div>" +
      '<div id="event-content-' + event.id + '" class="text-[14px] text-[#0f172a] flex flex-col gap-1.5 break-words">' +
      renderEventSubTabContent(event, currentSubTab) +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  function renderEventTabs() {
    const categories = ["All"].concat(uniqueCategories(PORTFOLIO_DATA.events));
    const el = document.getElementById("event-tabs");
    el.innerHTML = categories
      .map(function (cat) {
        return '<button data-action="select-event-tab" data-value="' + escapeHtml(cat) + '" class="' + tabStyle(APP_STATE.activeEventTab === cat) + '">' + escapeHtml(cat.toUpperCase()) + "</button>";
      })
      .join("");
  }

  function renderEventsCarousel() {
    const container = document.getElementById("events-carousel-container");
    const filtered = PORTFOLIO_DATA.events.filter(function (e) {
      return APP_STATE.activeEventTab === "All" || e.category === APP_STATE.activeEventTab;
    });
    container.innerHTML = filtered.map(renderEventCard).join('<div class="w-2 shrink-0"></div>');
  }

  function renderEvents() {
    renderEventTabs();
    renderEventsCarousel();
  }

  // ============================================================
  // RENDER: VALUE PROPS
  // ============================================================
  function renderValueProps() {
    const el = document.getElementById("value-props-container");
    el.innerHTML = PORTFOLIO_DATA.valueProps
      .map(function (vp) {
        return (
          '<div class="w-[220px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-2.5 flex flex-col justify-between h-[195px] select-none touch-pan-x">' +
          '<div class="aspect-[4/3] rounded-md overflow-hidden bg-slate-100 mb-2 w-full h-[135px]">' +
          '<img src="' + escapeHtml(vp.imageUrl) + '" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="' + escapeHtml(vp.label) + '" />' +
          "</div>" +
          '<span class="text-[13px] font-mono font-bold text-[#0f172a] text-center whitespace-nowrap overflow-hidden text-ellipsis w-full mt-1">' + escapeHtml(vp.label) + "</span>" +
          "</div>"
        );
      })
      .join("");
  }

  // ============================================================
  // RENDER: HELP YOURSELF
  // ============================================================
  function renderDocSelection() {
    const cvCard = document.getElementById("doc-cv-card");
    const portfolioCard = document.getElementById("doc-portfolio-card");
    const cvCheck = document.getElementById("doc-cv-check");
    const portfolioCheck = document.getElementById("doc-portfolio-check");

    if (APP_STATE.selectedDocs.cv) {
      cvCard.className = "p-3 rounded-lg border-2 border-[#0284c7] bg-[#f0f9ff] cursor-pointer flex items-center gap-3 select-none";
      cvCheck.classList.remove("hidden");
    } else {
      cvCard.className = "p-3 rounded-lg border border-[#e2e8f0] bg-white cursor-pointer flex items-center gap-3 select-none";
      cvCheck.classList.add("hidden");
    }

    if (APP_STATE.selectedDocs.portfolio) {
      portfolioCard.className = "p-3 rounded-lg border-2 border-[#0284c7] bg-[#f0f9ff] cursor-pointer flex items-center gap-3 select-none";
      portfolioCheck.classList.remove("hidden");
    } else {
      portfolioCard.className = "p-3 rounded-lg border border-[#e2e8f0] bg-white cursor-pointer flex items-center gap-3 select-none";
      portfolioCheck.classList.add("hidden");
    }
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function handleSendDocs() {
    const emailInput = document.getElementById("email-input");
    const email = emailInput.value.trim();
    const anySelected = APP_STATE.selectedDocs.cv || APP_STATE.selectedDocs.portfolio;

    if (!anySelected) {
      showToast("Select at least one document first", "error");
      return;
    }
    if (!isValidEmail(email)) {
      showToast("Enter a valid email address", "error");
      return;
    }
    showToast("Documents sent to " + email, "success");
    emailInput.value = "";
    APP_STATE.selectedDocs.cv = false;
    APP_STATE.selectedDocs.portfolio = false;
    renderDocSelection();
  }

  // ============================================================
  // STICKY HEADER SCROLL BEHAVIOR
  // ============================================================
  function initStickyHeader() {
    const header = document.getElementById("sticky-header");
    let ticking = false;
    window.addEventListener("scroll", function () {
      if (ticking) return;
      ticking = true;
      window.requestAnimationFrame(function () {
        if (window.scrollY > 100) {
          header.classList.remove("header-hidden");
          header.classList.add("header-visible");
        } else {
          header.classList.remove("header-visible");
          header.classList.add("header-hidden");
        }
        ticking = false;
      });
    });
  }

  // ============================================================
  // EVENT DELEGATION
  // ============================================================
  function initEventDelegation() {
    document.body.addEventListener("click", function (e) {
      const target = e.target.closest("[data-action]");
      if (!target) return;
      const action = target.getAttribute("data-action");

      if (action === "select-project-tab") {
        APP_STATE.activeProjectTab = target.getAttribute("data-value");
        renderProjectTabs();
        renderProjectsCarousel();
        return;
      }

      if (action === "project-subtab") {
        const id = target.getAttribute("data-id");
        const tab = target.getAttribute("data-tab");
        APP_STATE.projectSubTabs[id] = tab;
        const project = PORTFOLIO_DATA.projects.find(function (p) { return p.id === id; });
        if (!project) return;
        document.getElementById("content-" + id).innerHTML = renderProjectSubTabContent(project, tab);
        const cardTabs = target.parentElement.querySelectorAll("button");
        cardTabs.forEach(function (btn) {
          btn.className = subTabStyle(btn.getAttribute("data-tab") === tab);
        });
        return;
      }

      if (action === "play-video") {
        const id = target.getAttribute("data-id");
        const project = PORTFOLIO_DATA.projects.find(function (p) { return p.id === id; });
        if (!project) return;
        document.getElementById("media-" + id).innerHTML =
          '<iframe src="' + project.videoUrl + '?autoplay=1" class="w-full h-full border-0" allow="autoplay" draggable="false"></iframe>';
        return;
      }

      if (action === "select-skill-category") {
        APP_STATE.activeSkillCategory = target.getAttribute("data-value");
        renderSkillCategoryTabs();
        renderSkillsList();
        return;
      }

      if (action === "select-event-tab") {
        APP_STATE.activeEventTab = target.getAttribute("data-value");
        renderEventTabs();
        renderEventsCarousel();
        return;
      }

      if (action === "event-subtab") {
        const id = target.getAttribute("data-id");
        const tab = target.getAttribute("data-tab");
        APP_STATE.eventSubTabs[id] = tab;
        const event = PORTFOLIO_DATA.events.find(function (ev) { return ev.id === id; });
        if (!event) return;
        document.getElementById("event-content-" + id).innerHTML = renderEventSubTabContent(event, tab);
        const cardTabs = target.parentElement.querySelectorAll("button");
        cardTabs.forEach(function (btn) {
          btn.className = subTabStyle(btn.getAttribute("data-tab") === tab);
        });
        return;
      }

      if (action === "toggle-doc") {
        const doc = target.getAttribute("data-doc");
        APP_STATE.selectedDocs[doc] = !APP_STATE.selectedDocs[doc];
        renderDocSelection();
        return;
      }

      if (action === "send-docs") {
        handleSendDocs();
        return;
      }
    });
  }

  // ============================================================
  // INIT
  // ============================================================
  function initApp() {
    PORTFOLIO_DATA.projects.forEach(function (p) {
      APP_STATE.projectSubTabs[p.id] = "overview";
    });
    PORTFOLIO_DATA.events.forEach(function (e) {
      APP_STATE.eventSubTabs[e.id] = "overview";
    });

    renderHero();
    renderProjects();
    renderSkills();
    renderEvents();
    renderValueProps();
    renderDocSelection();

    initStickyHeader();
    initEventDelegation();
  }

  document.addEventListener("DOMContentLoaded", initApp);
})();
</script>
</body>
</html>
