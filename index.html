  .custom-scrollbar::-webkit-scrollbar { height: 6px; width: 6px; }
  .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
  .custom-scrollbar::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 999px; }
  .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 transparent; }

  .line-clamp-3 {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .fit-title {
    display: inline-block;
    max-width: 100%;
  }

  .shadow-xs { box-shadow: 0 1px 2px 0 rgba(15, 23, 42, 0.04); }

  #site-header {
    transform: translateY(-100%);
    opacity: 0;
    pointer-events: none;
    transition: transform 0.3s ease, opacity 0.3s ease;
  }
  #site-header.visible {
    transform: translateY(0);
    opacity: 1;
    pointer-events: auto;
  }

  .pulse-dot {
    box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.6);
    animation: pulse-green 2s infinite;
  }
  @keyframes pulse-green {
    0% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.55); }
    70% { box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
    100% { box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
  }

  #toast-container {
    position: fixed;
    bottom: 76px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 60;
    width: 92%;
    max-width: 360px;
    pointer-events: none;
  }
  .toast {
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.25s ease, transform 0.25s ease;
  }
  .toast.show {
    opacity: 1;
    transform: translateY(0);
  }

  .skill-bar-fill {
    transition: width 0.6s ease;

  };

  function iconLink(href, svg, label) {
    return `<a href="${href}" target="_blank" rel="noopener noreferrer" aria-label="${label}" class="text-[#475569] hover:text-[#0284c7] transition-colors">${svg}</a>`;
  }

  // ============================================================
  // FONT-FIT: shrink single-line text to avoid wrapping
  // ============================================================
  function fitSingleLine(el, minPx) {
    if (!el) return;
    let size = parseFloat(window.getComputedStyle(el).fontSize);
    const min = minPx || 10;
    let guard = 0;
    while (el.scrollWidth > el.clientWidth + 1 && size > min && guard < 40) {
      size -= 0.5;
      el.style.fontSize = size + "px";
      guard++;
    }
  }

  // ============================================================
  // HEADER
  // ============================================================
  function renderHeaderIcons() {
    const p = PORTFOLIO_DATA.personal;
    const wrap = document.getElementById("header-icons");
    wrap.innerHTML = [
      iconLink(`tel:${p.phone.replace(/\s+/g, "")}`, ICONS.phone, "Phone"),
      iconLink(p.whatsapp, ICONS.whatsapp, "WhatsApp"),
      iconLink(`mailto:${p.email}`, ICONS.gmail, "Email"),
      iconLink(p.linkedin, ICONS.linkedin, "LinkedIn"),
      iconLink(p.github, ICONS.github, "GitHub")
    ].join("");
  }

  function setupStickyHeader() {
    const header = document.getElementById("site-header");
    function onScroll() {
      if (window.scrollY > 100) {
        header.classList.add("visible");
      } else {
        header.classList.remove("visible");
      }
    }
    window.addEventListener("scroll", onScroll, { passive: true });
    onScroll();
  }

  // ============================================================
  // HERO
  // ============================================================
  function renderHero() {
    const p = PORTFOLIO_DATA.personal;
    document.getElementById("hero-avatar").src = p.avatarUrl;
    document.getElementById("hero-avatar").alt = p.name;
    document.getElementById("hero-name").textContent = p.name;
    document.getElementById("hero-title").textContent = p.title;
    document.getElementById("hero-location").textContent = p.location;
    document.getElementById("hero-statement").textContent = p.statement;

    const icons = document.getElementById("hero-icons");
    icons.innerHTML = [
      iconLink(`tel:${p.phone.replace(/\s+/g, "")}`, ICONS.phone, "Phone"),
      iconLink(p.whatsapp, ICONS.whatsapp, "WhatsApp"),
      iconLink(`mailto:${p.email}`, ICONS.gmail, "Email"),
      iconLink(p.linkedin, ICONS.linkedin, "LinkedIn"),
      iconLink(p.github, ICONS.github, "GitHub")
    ].join("");

    requestAnimationFrame(() => {
      fitSingleLine(document.getElementById("hero-title"), 9);
    });
  }

  // ============================================================
  // PROJECTS SECTION
  // ============================================================
  const PROJECT_TAB_LABELS = {
    "All": "All",
    "SoftWare": "SoftWare",
    "HardWare": "HardWare",
    "HW+SW": "HW+SW"
  };
  const PROJECT_TABS = ["All", "SoftWare", "HardWare", "HW+SW"];
  let activeProjectTab = "All";
  let activeProjectSubTab = {}; // projectId -> "overview" | "equipment" | "url"
  let activeProjectVideo = {}; // projectId -> boolean (playing)

  function styleTabLabel(label) {
    // Capitalize only S, W, H, W letters bold; rest normal weight, per spec.
    // We bold the literal capital letters that already exist in the label
    // (S, W, H, W) while keeping the rest of the letters normal weight.
    let out = "";
    for (const ch of label) {
      if (["S", "W", "H"].includes(ch)) {
        out += `<span class="font-bold">${ch}</span>`;
      } else {
        out += ch;
      }
    }
    return out;
  }

  function renderProjectTabs() {
    const wrap = document.getElementById("project-tabs");
    wrap.innerHTML = "";
    PROJECT_TABS.forEach(tab => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.dataset.tab = tab;
      btn.className = tabClass(tab === activeProjectTab);
      btn.innerHTML = styleTabLabel(PROJECT_TAB_LABELS[tab]);
      btn.addEventListener("click", () => {
        activeProjectTab = tab;
        renderProjectTabs();
        renderProjectCards();
      });
      wrap.appendChild(btn);
    });
  }

  function tabClass(active) {
    return active
      ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors"
      : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors";
  }

  function subTabClass(active) {
    return active
      ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-2.5 py-1 text-[12px] font-mono transition-colors"
      : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-2.5 py-1 text-[12px] font-mono transition-colors";
  }

  function projectSubTabContent(project, subTab) {
    if (subTab === "overview") {
      const o = project.details.overview;
      return `
        <div class="text-[13px] text-[#0f172a] leading-relaxed space-y-1.5">
          <p><span class="font-mono font-bold text-[#0369a1]">Objective:</span> ${o.objective}</p>
          <p><span class="font-mono font-bold text-[#0369a1]">Contribution:</span> ${o.contribution}</p>
          <p><span class="font-mono font-bold text-[#0369a1]">Results:</span> ${o.results}</p>
        </div>`;
    }
    if (subTab === "equipment") {
      return `
        <div class="flex flex-wrap gap-1.5">
          ${project.details.equipment.map(e => `<span class="px-2 py-1 rounded-md border border-[#e2e8f0] bg-[#f8fafc] text-[#0f172a] text-[12px] font-mono whitespace-nowrap">${e}</span>`).join("")}
        </div>`;
    }
    if (subTab === "url") {
      return `
        <div class="flex flex-col gap-1.5">
          ${project.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener noreferrer" class="text-[13px] font-mono text-[#0284c7] hover:text-[#0369a1] hover:underline break-words">${u.label} →</a>`).join("")}
        </div>`;
    }
    return "";
  }

  function renderProjectCards() {
    const wrap = document.getElementById("project-cards");
    wrap.innerHTML = "";
    const list = PORTFOLIO_DATA.projects.filter(p => activeProjectTab === "All" || p.category === activeProjectTab);

    list.forEach(project => {
      if (!activeProjectSubTab[project.id]) activeProjectSubTab[project.id] = "overview";
      const card = document.createElement("div");
      card.className = "w-[88vw] max-w-[340px] md:w-[350px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col shadow-xs";

      const mediaId = `media-${project.id}`;
      const subContentId = `subcontent-${project.id}`;

      card.innerHTML = `
        <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden shrink-0" id="${mediaId}" data-video-url="${project.videoUrl}">
          <img src="https://img.youtube.com/vi/${extractYouTubeId(project.videoUrl)}/hqdefault.jpg" alt="${project.title}" class="w-full h-full object-cover opacity-80">
          <button type="button" class="play-btn absolute inset-0 flex items-center justify-center group" aria-label="Play video">
            <span class="w-12 h-12 rounded-full bg-white/90 group-hover:bg-white flex items-center justify-center transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#0284c7" class="w-5 h-5 ml-0.5"><path d="M8 5v14l11-7z"/></svg>
            </span>
          </button>
        </div>
        <h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">${project.title}</h3>
        <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${project.summary}</p>
        <div class="flex gap-1.5 mb-2.5 shrink-0" id="sub-${project.id}"></div>
        <div id="${subContentId}" class="flex-1"></div>
      `;

      wrap.appendChild(card);

      // sub tabs
      const subTabWrap = card.querySelector(`#sub-${project.id}`);
      ["overview", "equipment", "url"].forEach(st => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = subTabClass(activeProjectSubTab[project.id] === st);
        b.textContent = st.toUpperCase();
        b.addEventListener("click", () => {
          activeProjectSubTab[project.id] = st;
          renderProjectCards();
        });
        subTabWrap.appendChild(b);
      });

      card.querySelector(`#${subContentId}`).innerHTML = projectSubTabContent(project, activeProjectSubTab[project.id]);

      // video play
      const mediaEl = card.querySelector(`#${mediaId}`);
      const playBtn = card.querySelector(".play-btn");
      playBtn.addEventListener("click", () => {
        mediaEl.innerHTML = `<iframe src="${project.videoUrl}?autoplay=1" class="w-full h-full border-0" allow="autoplay"></iframe>`;
      });
    });
  }

  function extractYouTubeId(url) {
    const m = url.match(/embed\/([a-zA-Z0-9_-]+)/);
    return m ? m[1] : "";
  }

  // ============================================================
  // SKILLS SECTION
  // ============================================================
  let activeSkillCategory = null;

  function renderSkillCategoryTabs() {
    const keys = Object.keys(PORTFOLIO_DATA.skills);
    if (!activeSkillCategory) activeSkillCategory = keys[0];
    const wrap = document.getElementById("skill-category-tabs");
    wrap.innerHTML = "";
    keys.forEach(key => {
      const btn = document.createElement("button");
      btn.type = "button";
      const active = key === activeSkillCategory;
      btn.className = active
        ? "px-3 py-1.5 rounded-md border text-[13px] font-mono whitespace-nowrap bg-[#0284c7] text-white border-[#0284c7] font-bold transition-colors"
        : "px-3 py-1.5 rounded-md border text-[13px] font-mono whitespace-nowrap bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7] transition-colors";
      btn.textContent = key;
      btn.addEventListener("click", () => {
        activeSkillCategory = key;
        renderSkillCategoryTabs();
        renderSkillsList();
      });
      wrap.appendChild(btn);
    });
  }

  function renderSkillsList() {
    const wrap = document.getElementById("skills-list");
    wrap.innerHTML = "";
    const items = PORTFOLIO_DATA.skills[activeSkillCategory] || [];
    items.forEach(skill => {
      const row = document.createElement("div");
      row.className = "mb-3 last:mb-0";
      row.innerHTML = `
        <div class="flex items-center justify-between mb-1">
          <span class="text-[14px] font-sans text-[#0f172a] font-medium">${skill.name}</span>
          <span class="text-[12px] font-mono text-[#475569]">${skill.level}%</span>
        </div>
        <div class="w-full h-1.5 rounded-full bg-[#e2e8f0] overflow-hidden">
          <div class="h-full rounded-full bg-[#0284c7] skill-bar-fill" style="width:0%" data-level="${skill.level}"></div>
        </div>
      `;
      wrap.appendChild(row);
    });
    requestAnimationFrame(() => {
      wrap.querySelectorAll(".skill-bar-fill").forEach(bar => {
        bar.style.width = bar.dataset.level + "%";
      });
    });
  }

  // ============================================================
  // EVENTS SECTION
  // ============================================================
  const EVENT_TABS = ["All", "Conference", "Hackathon"];
  let activeEventTab = "All";
  let activeEventSubTab = {};

  function renderEventTabs() {
    const wrap = document.getElementById("event-tabs");
    wrap.innerHTML = "";
    EVENT_TABS.forEach(tab => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = tabClass(tab === activeEventTab);
      btn.textContent = tab;
      btn.addEventListener("click", () => {
        activeEventTab = tab;
        renderEventTabs();
        renderEventCards();
      });
      wrap.appendChild(btn);
    });
  }

  function eventSubTabContent(event, subTab) {
    if (subTab === "overview") {
      const o = event.details.overview;
      return `
        <div class="text-[13px] text-[#0f172a] leading-relaxed space-y-1.5">
          <p><span class="font-mono font-bold text-[#0369a1]">Why it mattered:</span> ${o.whyMattered}</p>
          <p><span class="font-mono font-bold text-[#0369a1]">Participation:</span> ${o.participation}</p>
          <p><span class="font-mono font-bold text-[#0369a1]">Outcomes:</span> ${o.outcomes}</p>
        </div>`;
    }
    if (subTab === "media") {
      return `
        <div class="grid grid-cols-2 gap-1.5">
          ${event.details.media.map(m => `<div class="aspect-video rounded-md overflow-hidden bg-slate-100"><img src="${m}" alt="${event.title}" class="w-full h-full object-cover"></div>`).join("")}
        </div>`;
    }
    if (subTab === "url") {
      return `
        <div class="flex flex-col gap-1.5">
          ${event.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener noreferrer" class="text-[13px] font-mono text-[#0284c7] hover:text-[#0369a1] hover:underline break-words">${u.label} →</a>`).join("")}
        </div>`;
    }
    return "";
  }

  function renderEventCards() {
    const wrap = document.getElementById("event-cards");
    wrap.innerHTML = "";
    const list = PORTFOLIO_DATA.events.filter(e => activeEventTab === "All" || e.category === activeEventTab);

    list.forEach(event => {
      if (!activeEventSubTab[event.id]) activeEventSubTab[event.id] = "overview";
      const card = document.createElement("div");
      card.className = "w-[88vw] max-w-[340px] md:w-[350px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs";

      const subContentId = `esubcontent-${event.id}`;

      card.innerHTML = `
        <div>
          <div class="aspect-video rounded-md overflow-hidden bg-slate-100 mb-2.5">
            <img src="${event.imageUrl}" alt="${event.title}" class="w-full h-full object-cover">
          </div>
          <div class="flex items-center justify-between gap-2 mb-1">
            <h3 class="text-[18px] font-bold text-[#0f172a] leading-snug">${event.title}</h3>
          </div>
          <span class="inline-block px-2 py-0.5 rounded-md border border-[#e2e8f0] bg-[#f8fafc] text-[#0d9488] text-[12px] font-mono mb-2">${event.category}</span>
          <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${event.summary}</p>
          <div class="flex gap-1.5 mb-2.5" id="esub-${event.id}"></div>
          <div id="${subContentId}"></div>
        </div>
      `;

      wrap.appendChild(card);

      const subTabWrap = card.querySelector(`#esub-${event.id}`);
      ["overview", "media", "url"].forEach(st => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = subTabClass(activeEventSubTab[event.id] === st);
        b.textContent = st.toUpperCase();
        b.addEventListener("click", () => {
          activeEventSubTab[event.id] = st;
          renderEventCards();
        });
        subTabWrap.appendChild(b);
      });

      card.querySelector(`#${subContentId}`).innerHTML = eventSubTabContent(event, activeEventSubTab[event.id]);
    });
  }

  // ============================================================
  // VALUE PROPS ("WHAT DO I BRING TO THE TABLE")
  // ============================================================
  const VALUE_IMAGES = [
    "https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=500",
    "https://images.unsplash.com/photo-1581092160562-40aa08e78837?auto=format&fit=crop&q=80&w=500",
    "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&q=80&w=500",
    "https://images.unsplash.com/photo-1581093458791-9d42e3c7e117?auto=format&fit=crop&q=80&w=500",
    "https://images.unsplash.com/photo-1581092921461-eab62e97a780?auto=format&fit=crop&q=80&w=500"
  ];

  function renderValueProps() {
    const wrap = document.getElementById("value-props");
    wrap.innerHTML = "";
    PORTFOLIO_DATA.valueProps.forEach((vp, idx) => {
      const card = document.createElement("div");
      card.className = "w-[280px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between";
      card.innerHTML = `
        <div>
          <div class="aspect-video rounded-md overflow-hidden bg-slate-100 mb-2.5">
            <img src="${VALUE_IMAGES[idx % VALUE_IMAGES.length]}" alt="${vp.title}" class="w-full h-full object-cover">
          </div>
          <p class="whitespace-nowrap overflow-hidden text-ellipsis text-[15px] sm:text-[16px] font-bold text-[#0f172a]">${vp.title}</p>
          <p class="text-[13px] font-mono text-[#0369a1] mt-1 whitespace-nowrap overflow-hidden text-ellipsis">${vp.text}</p>
        </div>
      `;
      wrap.appendChild(card);
    });
  }

  // ============================================================
  // HELP YOURSELF SECTION
  // ============================================================
  function setupHelpYourself() {
    const cvBtn = document.getElementById("doc-cv");
    const portfolioBtn = document.getElementById("doc-portfolio");
    const emailInput = document.getElementById("email-input");
    const sendBtn = document.getElementById("send-docs-btn");

    const state = { cv: false, portfolio: false };

    function applyToggleStyle(btn, active) {
      if (active) {
        btn.classList.add("border-2", "border-[#0284c7]", "bg-[#f0f9ff]", "text-[#0284c7]");
        btn.classList.remove("border", "border-[#e2e8f0]", "text-[#475569]");
      } else {
        btn.classList.remove("border-2", "border-[#0284c7]", "bg-[#f0f9ff]", "text-[#0284c7]");
        btn.classList.add("border", "border-[#e2e8f0]", "text-[#475569]");
      }
    }

    cvBtn.addEventListener("click", () => {
      state.cv = !state.cv;
      applyToggleStyle(cvBtn, state.cv);
    });
    portfolioBtn.addEventListener("click", () => {
      state.portfolio = !state.portfolio;
      applyToggleStyle(portfolioBtn, state.portfolio);
    });

    sendBtn.addEventListener("click", () => {
      const email = emailInput.value.trim();
      const selected = [];
      if (state.cv) selected.push("CV Document");
      if (state.portfolio) selected.push("Portfolio Document");

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showToast("Please enter a valid email address.", true);
        return;
      }
      if (selected.length === 0) {
        showToast("Please select at least one document.", true);
        return;
      }
      showToast(`Dispatched ${selected.join(" & ")} to ${email}`, false);
    });
  }

  function showToast(message, isError) {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.className = `toast mb-2 rounded-md border px-4 py-2.5 text-[13px] font-mono shadow-md ${isError ? "bg-red-50 border-red-200 text-red-700" : "bg-[#f0f9ff] border-[#0284c7] text-[#0369a1]"}`;
    toast.textContent = message;
    container.appendChild(toast);
    requestAnimationFrame(() => toast.classList.add("show"));
    setTimeout(() => {
      toast.classList.remove("show");
      setTimeout(() => toast.remove(), 300);
    }, 3200);
  }

  // ============================================================
  // VIEWPORT HEIGHT FIX (webview parity)
  // ============================================================
  function setAppHeight() {
    document.documentElement.style.setProperty("--app-height", `${window.innerHeight}px`);
  }
  window.addEventListener("resize", setAppHeight);
  setAppHeight();

  // ============================================================
  // INIT
  // ============================================================
  function init() {
    renderHeaderIcons();
    setupStickyHeader();
    renderHero();
    renderProjectTabs();
    renderProjectCards();
    renderSkillCategoryTabs();
    renderSkillsList();
    renderEventTabs();
    renderEventCards();
    renderValueProps();
    setupHelpYourself();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
