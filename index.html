function projectSubNav(p) {
  const sub = state.projectSubTab[p.id];
  const btn = (key, label) => `<button type="button" class="project-subtab ${sub === key ? SUBTAB_ACTIVE : SUBTAB_INACTIVE}" data-pid="${p.id}" data-sub="${key}">${label}</button>`;
  return `<div class="flex gap-1.5 my-2">${btn('overview', 'OVERVIEW')}${btn('equipment', 'EQUIPMENT')}${btn('url', 'URL')}</div>`;
}

function projectSubContent(p) {
  const sub = state.projectSubTab[p.id];
  if (sub === 'overview') {
    const o = p.details.overview;
    return `<div class="space-y-1.5 h-full overflow-y-auto custom-scrollbar pr-1">
      <p class="text-[14px] text-[#0f172a] leading-snug"><span class="font-mono font-bold text-[#0284c7]">OBJ&nbsp;·&nbsp;</span>${o.objective}</p>
      <p class="text-[14px] text-[#0f172a] leading-snug"><span class="font-mono font-bold text-[#0d9488]">ROLE&nbsp;·&nbsp;</span>${o.contribution}</p>
      <p class="text-[14px] text-[#0f172a] leading-snug"><span class="font-mono font-bold text-[#0369a1]">RESULT&nbsp;·&nbsp;</span>${o.results}</p>
    </div>`;
  }
  if (sub === 'equipment') {
    return `<div class="flex flex-wrap gap-1.5 h-full overflow-y-auto custom-scrollbar pr-1 content-start">
      ${p.details.equipment.map(e => `<span class="whitespace-nowrap px-2 py-1 rounded-md border border-[#e2e8f0] bg-[#f8fafc] text-[12.5px] font-mono text-[#0f172a]">${e}</span>`).join('')}
    </div>`;
  }
  return `<div class="space-y-1.5 h-full overflow-y-auto custom-scrollbar pr-1">
    ${p.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener" class="block text-[14px] text-[#0284c7] hover:text-[#0369a1] font-medium underline underline-offset-2">${u.label}</a>`).join('')}
  </div>`;
}

function projectCardHTML(p) {
  return `
  <div class="w-[calc(100%-20px)] sm:w-[336px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-3.5 flex flex-col justify-between shadow-xs">
    <div>
      <h3 class="text-[18px] font-bold text-[#0f172a] leading-tight">${p.title}</h3>
      <p class="text-[15px] text-[#475569] leading-tight mt-0.5 line-clamp-1">${p.summary}</p>
    </div>
    ${projectSubNav(p)}
    <div class="flex-1 min-h-0">${projectSubContent(p)}</div>
  </div>`;
}

function renderProjects() {
  const list = state.projectFilter === 'All'
    ? PORTFOLIO_DATA.projects
    : PORTFOLIO_DATA.projects.filter(p => p.category === state.projectFilter);
  document.getElementById('project-carousel').innerHTML = list.map(projectCardHTML).join('');
}

/* ==================================================
   RENDER: SKILLSETS
================================================== */
function renderSkillTabs() {
  const cats = Object.keys(PORTFOLIO_DATA.skills);
  document.getElementById('skill-category-tabs').innerHTML = cats.map(cat => {
    const active = state.skillCategory === cat;
    const cls = active
      ? "whitespace-nowrap px-2.5 py-1 rounded-md border text-[14px] font-mono bg-[#0284c7] text-white border-[#0284c7] font-bold transition-colors"
      : "whitespace-nowrap px-2.5 py-1 rounded-md border text-[14px] font-mono bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7] transition-colors";
    return `<button type="button" class="skill-cat-tab ${cls}" data-cat="${cat}">${cat}</button>`;
  }).join('');
}

function renderSkillsList() {
  const skills = PORTFOLIO_DATA.skills[state.skillCategory];
  document.getElementById('skills-list').innerHTML = skills.map(s => `
    <div class="mb-2.5 last:mb-0">
      <div class="flex items-center justify-between mb-1 gap-2">
        <span class="text-[16px] font-sans text-[#0f172a] leading-tight">${s.name}</span>
        <span class="text-[13px] font-mono text-[#475569] shrink-0">${s.level}%</span>
      </div>
      <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full bg-[#0284c7] rounded-full" style="width:${s.level}%"></div>
      </div>
    </div>
  `).join('');
}

/* ==================================================
   RENDER: EVENTS
================================================== */
function renderEventTabs() {
  const cats = ['All', 'Conference', 'Hackathon'];
  document.getElementById('event-category-tabs').innerHTML = cats.map(cat => {
    const active = state.eventFilter === cat;
    return `<button type="button" class="event-tab ${active ? TAB_ACTIVE : TAB_INACTIVE}" data-cat="${cat}">${cat}</button>`;
  }).join('');
}

function eventSubNav(e) {
  const sub = state.eventSubTab[e.id];
  const btn = (key, label) => `<button type="button" class="event-subtab ${sub === key ? SUBTAB_ACTIVE : SUBTAB_INACTIVE}" data-eid="${e.id}" data-sub="${key}">${label}</button>`;
  return `<div class="flex gap-1.5 my-2">${btn('media', 'MEDIA')}${btn('url', 'URL')}</div>`;
}

function eventSubContent(e) {
  const sub = state.eventSubTab[e.id];
  if (sub === 'media') {
    return `<div class="grid grid-cols-2 gap-1.5 h-full overflow-y-auto custom-scrollbar pr-1 content-start">
      ${e.details.media.map(m => `<img src="${m}" loading="lazy" class="w-full h-20 object-cover rounded-md border border-[#e2e8f0]">`).join('')}
    </div>`;
  }
  return `<div class="space-y-1.5 h-full overflow-y-auto custom-scrollbar pr-1">
    ${e.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener" class="block text-[14px] text-[#0284c7] hover:text-[#0369a1] font-medium underline underline-offset-2">${u.label}</a>`).join('')}
  </div>`;
}

function eventCardHTML(e) {
  return `
  <div class="w-[calc(100%-20px)] sm:w-[336px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-3.5 flex flex-col justify-between shadow-xs">
    <div>
      <img src="${e.imageUrl}" loading="lazy" class="w-full h-20 object-cover rounded-md mb-2 border border-[#e2e8f0]">
      <h3 class="text-[18px] font-bold text-[#0f172a] leading-tight">${e.title}</h3>
      <p class="text-[15px] text-[#475569] leading-tight mt-0.5 line-clamp-1">${e.summary}</p>
    </div>
    ${eventSubNav(e)}
    <div class="flex-1 min-h-0">${eventSubContent(e)}</div>
  </div>`;
}

function renderEvents() {
  const list = state.eventFilter === 'All'
    ? PORTFOLIO_DATA.events
    : PORTFOLIO_DATA.events.filter(e => e.category === state.eventFilter);
  document.getElementById('event-carousel').innerHTML = list.map(eventCardHTML).join('');
}

/* ==================================================
   RENDER: VALUE PROPS
================================================== */
const VALUE_ICONS = [ICONS.network, ICONS.code, ICONS.phone, ICONS.mail, ICONS.pin];
function renderValueProps() {
  document.getElementById('value-props-carousel').innerHTML = PORTFOLIO_DATA.valueProps.map((v, i) => `
    <div class="w-[260px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">
      <div class="aspect-video rounded-md overflow-hidden bg-white border border-[#e2e8f0] mb-3 flex items-center justify-center text-[#0d9488]" style="width:56px;height:56px;">
        <div style="width:26px;height:26px;">${VALUE_ICONS[i % VALUE_ICONS.length]}</div>
      </div>
      <p class="text-[16px] sm:text-[18px] font-bold text-[#0f172a] whitespace-nowrap" title="${v.title}">${v.text}</p>
    </div>
  `).join('');
}

/* ==================================================
   HELP YOURSELF
================================================== */
function renderDocCards() {
  document.getElementById('cv-card').className = `doc-card border rounded-lg p-4 cursor-pointer transition-colors ${state.cvSelected ? 'border-2 border-[#0284c7] bg-[#f0f9ff]' : 'border-[#e2e8f0] bg-white'}`;
  document.getElementById('portfolio-card').className = `doc-card border rounded-lg p-4 cursor-pointer transition-colors ${state.portfolioSelected ? 'border-2 border-[#0284c7] bg-[#f0f9ff]' : 'border-[#e2e8f0] bg-white'}`;
}

function showToast(msg, isError) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast-item w-full text-center px-4 py-2.5 rounded-lg shadow-lg text-[15px] font-mono ${isError ? 'bg-red-50 text-red-700 border border-red-200' : 'bg-[#0f172a] text-white'}`;
  toast.textContent = msg;
  container.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateY(10px)';
    setTimeout(() => toast.remove(), 300);
  }, 2800);
}

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

/* ==================================================
   EVENT WIRING
================================================== */
function wireEvents() {
  document.getElementById('project-category-tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.project-tab');
    if (!btn) return;
    state.projectFilter = btn.dataset.cat;
    renderProjectTabs();
    renderProjects();
  });

  document.getElementById('project-carousel').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.project-subtab');
    if (!btn) return;
    state.projectSubTab[btn.dataset.pid] = btn.dataset.sub;
    renderProjects();
  });

  document.getElementById('skill-category-tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.skill-cat-tab');
    if (!btn) return;
    state.skillCategory = btn.dataset.cat;
    renderSkillTabs();
    renderSkillsList();
  });

  document.getElementById('event-category-tabs').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.event-tab');
    if (!btn) return;
    state.eventFilter = btn.dataset.cat;
    renderEventTabs();
    renderEvents();
  });

  document.getElementById('event-carousel').addEventListener('click', (ev) => {
    const btn = ev.target.closest('.event-subtab');
    if (!btn) return;
    state.eventSubTab[btn.dataset.eid] = btn.dataset.sub;
    renderEvents();
  });

  document.getElementById('cv-card').addEventListener('click', () => {
    state.cvSelected = !state.cvSelected;
    renderDocCards();
  });
  document.getElementById('portfolio-card').addEventListener('click', () => {
    state.portfolioSelected = !state.portfolioSelected;
    renderDocCards();
  });

  document.getElementById('send-docs-btn').addEventListener('click', () => {
    const emailInput = document.getElementById('email-input');
    const email = emailInput.value.trim();
    const items = [];
    if (state.cvSelected) items.push('CV');
    if (state.portfolioSelected) items.push('Portfolio');

    if (items.length === 0) {
      showToast('Select at least one document first.', true);
      return;
    }
    if (!isValidEmail(email)) {
      showToast('Enter a valid email address.', true);
      return;
    }
    showToast(`Dispatched ${items.join(' & ')} to ${email}`, false);
  });

  const header = document.getElementById('site-header');
  window.addEventListener('scroll', () => {
    if (window.scrollY > 100) header.classList.add('visible');
    else header.classList.remove('visible');
  }, { passive: true });
}

/* ==================================================
   VIEWPORT HEIGHT FIX (mobile webviews)
================================================== */
function setAppHeight() {
  document.documentElement.style.setProperty('--app-height', `${window.innerHeight}px`);
}
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', setAppHeight);
setAppHeight();

/* ==================================================
   INIT
================================================== */
function init() {
  renderHeaderAndHero();
  renderProjectTabs();
  renderProjects();
  renderSkillTabs();
  renderSkillsList();
  renderEventTabs();
  renderEvents();
  renderValueProps();
  renderDocCards();
  wireEvents();
}
init();
</script>
</body>
</html>
