            document.getElementById('profile-statement').textContent = p.statement;
            document.getElementById('profile-location').textContent = p.location;
            
            document.getElementById('profile-phone').href = `tel:${p.phone.replace(/\s+/g, '')}`;
            document.getElementById('profile-whatsapp').href = p.whatsapp;
            document.getElementById('profile-email').href = `mailto:${p.email}`;
            document.getElementById('profile-linkedin').href = p.linkedin;
            document.getElementById('profile-github').href = p.github;
        }

        // 2. Render Projects Section
        function renderProjects() {
            const container = document.getElementById('projects-container');
            container.innerHTML = '';

            const filteredProjects = PORTFOLIO_DATA.projects.filter(proj => {
                if (activeProjectCategory === 'HW+SW') return true;
                return proj.category === activeProjectCategory || proj.category === 'HW+SW';
            });

            filteredProjects.forEach(proj => {
                const card = document.createElement('div');
                card.className = "w-[280px] md:w-[320px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="aspect-video relative rounded bg-slate-900 overflow-hidden flex items-center justify-center cursor-pointer group modal-trigger" data-video="${proj.videoUrl}" data-title="${proj.title}">
                            <img src="https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&q=80&w=600" alt="${proj.title}" class="w-full h-full object-cover opacity-60 group-hover:opacity-80 transition-opacity">
                            <div class="absolute w-10 h-10 rounded-full bg-[#0284c7] text-white flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                                <svg class="w-5 h-5 fill-current translate-x-0.5" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </div>
                        </div>
                        <h3 class="font-bold text-[#0f172a] mt-3 mb-1 line-clamp-1">${proj.title}</h3>
                        <p class="line-clamp-2 text-xs md:text-sm text-[#475569] mb-4">${proj.summary}</p>
                    </div>
                    <a href="${proj.links.url}" target="_blank" class="w-full text-center bg-slate-100 hover:bg-slate-200 text-[#0f172a] font-mono text-xs font-semibold py-2 px-3 rounded transition-colors block">
                        Visit / View Project
                    </a>
                `;
                container.appendChild(card);
            });

            // Re-bind modal triggers
            document.querySelectorAll('.modal-trigger').forEach(btn => {
                btn.addEventListener('click', () => {
                    openVideoModal(btn.getAttribute('data-video'), btn.getAttribute('data-title'));
                });
            });
        }

        function setupProjectTabs() {
            const tabs = document.querySelectorAll('.project-tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    activeProjectCategory = tab.getAttribute('data-category');
                    tabs.forEach(t => {
                        if (t.getAttribute('data-category') === activeProjectCategory) {
                            t.className = "project-tab-btn px-4 py-1.5 rounded-md font-semibold transition-all bg-[#0284c7] text-white";
                        } else {
                            t.className = "project-tab-btn px-4 py-1.5 rounded-md font-semibold transition-all bg-white border border-[#e2e8f0] text-[#475569] hover:border-slate-300";
                        }
                    });
                    renderProjects();
                });
            });
        }

        // 3. Render Skills Section
        function renderSkillTabs() {
            const container = document.getElementById('skill-tabs');
            container.innerHTML = '';
            
            Object.keys(PORTFOLIO_DATA.skills).forEach(category => {
                const isActive = category === activeSkillCategory;
                const btn = document.createElement('button');
                btn.className = `px-4 py-1.5 rounded-md font-semibold transition-all ${
                    isActive 
                    ? 'bg-[#0284c7] text-white' 
                    : 'bg-white border border-[#e2e8f0] text-[#475569] hover:border-slate-300'
                }`;
                btn.textContent = category;
                btn.addEventListener('click', () => {
                    activeSkillCategory = category;
                    renderSkillTabs();
                    renderSkills();
                });
                container.appendChild(btn);
            });
        }

        function renderSkills() {
            const container = document.getElementById('skills-container');
            container.innerHTML = '';

            const list = PORTFOLIO_DATA.skills[activeSkillCategory] || [];
            list.forEach(skill => {
                const item = document.createElement('div');
                item.className = "space-y-1";
                item.innerHTML = `
                    <div class="flex justify-between text-xs font-semibold">
                        <span class="text-[#0f172a]">${skill.name}</span>
                        <span class="font-mono text-[#0369a1]">${skill.level}%</span>
                    </div>
                    <div class="w-full bg-[#f1f5f9] h-2 rounded-full overflow-hidden">
                        <div class="bg-[#0284c7] h-full rounded-full transition-all duration-500" style="width: ${skill.level}%"></div>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // 4. Render Value Props Section
        function renderValueProps() {
            const container = document.getElementById('value-props-container');
            container.innerHTML = '';

            PORTFOLIO_DATA.valueProps.forEach((prop, index) => {
                const card = document.createElement('div');
                card.className = "shrink-0 w-[280px] snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-5 flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <h3 class="font-bold text-[#0f172a] text-base">Reason #${index + 1}: ${prop.title}</h3>
                        <p class="font-mono text-xs text-[#475569] mt-2 leading-relaxed">${prop.text}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 5. Setup Document Selection & Handling
        function setupDocSelection() {
            const cardCv = document.getElementById('card-cv');
            const cardPortfolio = document.getElementById('card-portfolio');
            const sendBtn = document.getElementById('send-docs-btn');
            const emailInput = document.getElementById('doc-email-input');

            cardCv.addEventListener('click', () => {
                cvSelected = !cvSelected;
                updateCardState(cardCv, cvSelected);
            });

            cardPortfolio.addEventListener('click', () => {
                portfolioSelected = !portfolioSelected;
                updateCardState(cardPortfolio, portfolioSelected);
            });

            sendBtn.addEventListener('click', () => {
                const email = emailInput.value.trim();
                
                if (!cvSelected && !portfolioSelected) {
                    showToast("Please select at least one document (CV or Portfolio).", "error");
                    return;
                }

                if (!email || !email.includes('@')) {
                    showToast("Please enter a valid email address.", "error");
                    return;
                }

                const docs = [];
                if (cvSelected) docs.push("CV");
                if (portfolioSelected) docs.push("Portfolio");

                showToast(`Notification: Dispatched ${docs.join(" & ")} to ${email}`, "success");

                // Reset state
                cvSelected = false;
                portfolioSelected = false;
                updateCardState(cardCv, false);
                updateCardState(cardPortfolio, false);
                emailInput.value = '';
            });
        }

        function updateCardState(card, isSelected) {
            const checkIcon = card.querySelector('.check-icon');
            if (isSelected) {
                card.className = "doc-card border-2 border-[#0284c7] bg-[#f0f9ff] text-[#0f172a] cursor-pointer p-4 rounded-lg flex items-center justify-between font-semibold transition-all";
                checkIcon.className = "w-5 h-5 text-[#0284c7] check-icon";
            } else {
                card.className = "doc-card bg-white border border-[#e2e8f0] text-[#0f172a] cursor-pointer p-4 rounded-lg flex items-center justify-between font-semibold transition-all";
                checkIcon.className = "w-5 h-5 text-slate-400 check-icon";
            }
        }

        // Sticky Header Handler
        function setupStickyHeader() {
            const header = document.getElementById('sticky-header');
            const langSelect = document.getElementById('language-selector');

            window.addEventListener('scroll', () => {
                if (window.scrollY > 100) {
                    header.classList.remove('-translate-y-full', 'opacity-0');
                    header.classList.add('translate-y-0', 'opacity-100');
                } else {
                    header.classList.remove('translate-y-0', 'opacity-100');
                    header.classList.add('-translate-y-full', 'opacity-0');
                }
            });

            langSelect.addEventListener('change', (e) => {
                showToast(`Language changed to ${e.target.options[e.target.selectedIndex].text}`, "info");
            });
        }

        // Video Modal Handler
        function setupVideoModal() {
            const modal = document.getElementById('video-modal');
            const closeBtn = document.getElementById('close-modal-btn');
            const iframe = document.getElementById('modal-iframe');

            closeBtn.addEventListener('click', closeModal);
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
        }

        function openVideoModal(url, title) {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            const titleEl = document.getElementById('modal-video-title');

            titleEl.textContent = title;
            iframe.src = url;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            const modal = document.getElementById('video-modal');
            const iframe = document.getElementById('modal-iframe');
            iframe.src = '';
            modal.classList.add('hidden');
        }

        // Notification Toast System
        function showToast(message, type = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');

            let bgBorder = "bg-slate-900 text-white border-slate-700";
            if (type === "error") bgBorder = "bg-rose-900 text-white border-rose-700";
            if (type === "success") bgBorder = "bg-teal-900 text-white border-teal-700";

            toast.className = `pointer-events-auto max-w-sm px-4 py-3 rounded-lg border shadow-xl font-mono text-xs ${bgBorder} transition-all duration-300 transform translate-y-2 opacity-0`;
            toast.textContent = message;

            container.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            });

            // Auto dismiss
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 4000);
        }
    </script>
</body>
</html>
