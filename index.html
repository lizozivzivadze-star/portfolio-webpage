<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lizi Zivzivadze — Electromechanical Engineer</title>
<style>
  :root{
    --font-primary: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-mono: "JetBrains Mono", Consolas, Monaco, "Courier New", monospace;
    --bg-main:#FAFAFA;
    --bg-surface:#FFFFFF;
    --text-primary:#0F172A;
    --text-secondary:#475569;
    --text-muted:#94A3B8;
    --accent-primary:#2563EB;
    --accent-success:#22C55E;
    --border-color:#E2E8F0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-main);
    font-family:var(--font-primary);
    color:var(--text-primary);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font:inherit;}

  /* ---------- App shell ---------- */
  .app-shell{
    max-width:430px;
    margin:0 auto;
    position:relative;
    min-height:100vh;
  }
  .app-main{
    padding:0 15px;
    padding-top:15px;
    padding-bottom:96px;
    box-sizing:border-box;
    width:100%;
  }

  /* ---------- Section 2: Sticky header ---------- */
  .sticky-header{
    position:fixed; top:0; left:50%; transform:translate(-50%,-100%);
    width:100%; max-width:430px; height:44px; min-height:44px; z-index:100;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 15px; box-sizing:border-box;
    border-bottom:1px solid rgba(226,232,240,0.8);
    background:rgba(255,255,255,0.85);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  .sticky-header.visible{
    opacity:1; transform:translate(-50%,0); pointer-events:auto;
  }
  .sticky-header-left{display:flex; align-items:center; gap:8px;}
  .header-mini-avatar{
    width:28px; height:28px; border-radius:50%; flex-shrink:0;
    border:1px solid var(--border-color); overflow:hidden;
  }
  .header-mini-avatar svg{width:100%; height:100%; display:block;}
  .header-full-name{
    font-family:var(--font-primary); font-size:14px; font-weight:700;
    color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .sticky-header-right{margin-left:auto; height:100%; width:auto;}

  /* ---------- Section 3: Profile ---------- */
  .profile-container{
    display:flex; flex-direction:column; align-items:center; gap:12px;
    padding-top:15px; margin-bottom:24px; width:100%; box-sizing:border-box;
  }
  .profile-avatar{
    width:90px; height:90px; border-radius:50%;
    border:1px solid var(--border-color); background:#F1F5F9; overflow:hidden;
  }
  .profile-avatar svg{width:100%; height:100%; display:block;}
  .profile-name{
    font-family:var(--font-primary); font-size:20px; font-weight:700;
    color:var(--text-primary); margin:0; text-align:center;
  }
  .profile-title{
    font-family:var(--font-mono); font-size:12px; font-weight:600; color:var(--text-secondary);
    text-transform:uppercase; text-align:center; margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  .profile-action-row{display:flex; flex-direction:row; gap:8px; width:100%; box-sizing:border-box; margin-top:4px;}
  .profile-btn{
    height:38px; flex-grow:1; flex-basis:0;
    font-family:var(--font-mono); font-size:11px; font-weight:600; text-transform:uppercase;
    border-radius:6px; border:1px solid var(--border-color); background:var(--bg-surface); color:var(--text-primary);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    text-decoration:none; box-sizing:border-box; transition:background .2s ease;
    letter-spacing:0.03em;
  }
  .profile-btn:hover{background:#F8FAFC;}

  /* ---------- Shared: section title ---------- */
  .section-title{
    font-family:var(--font-primary); font-size:20px; font-weight:700; color:var(--text-primary);
    text-align:center; margin:0 0 16px 0; letter-spacing:0.05em; text-transform:uppercase;
  }
  .section-title.single-line-title{
    font-size:clamp(13px,3.8vw,18px); letter-spacing:0.04em; margin-top:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; width:100%;
  }
  section.app-section{margin-bottom:32px;}

  /* ---------- Section 4.1 / 6.1: filter bars ---------- */
  .projects-filter-bar{
    display:grid; grid-template-columns:repeat(4,1fr); gap:6px; width:100%;
    margin-bottom:16px; box-sizing:border-box;
  }
  .events-filter-bar{
    display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:100%;
    margin-bottom:20px; box-sizing:border-box;
  }
  .filter-tab{
    height:34px; font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    border-radius:6px; cursor:pointer; border:1px solid var(--border-color);
    text-transform:uppercase; display:flex; align-items:center; justify-content:center;
    background:var(--bg-main); color:var(--text-secondary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding:0 4px;
  }
  .events-filter-bar .filter-tab{height:36px; font-size:11px;}
  .filter-tab.active{background:var(--accent-primary); color:#FFFFFF; border-color:var(--accent-primary);}

  /* ---------- Section 4.2/4.3 & 6.2/6.3: carousels & cards ---------- */
  .carousel-track{
    display:flex; flex-direction:row; gap:12px; overflow-x:auto;
    scroll-snap-type:x mandatory; scrollbar-width:none; -ms-overflow-style:none; padding:4px;
  }
  .carousel-track::-webkit-scrollbar{display:none;}
  .carousel-card{
    width:calc(100vw - 30px - 12px - 7px);
    min-width:calc(100vw - 30px - 12px - 7px);
    max-width:calc(100vw - 30px - 12px - 7px);
    scroll-snap-align:start; flex-shrink:0;
  }
  @media (min-width:430px){
    .carousel-card{
      width:calc(430px - 30px - 12px - 7px);
      min-width:calc(430px - 30px - 12px - 7px);
      max-width:calc(430px - 30px - 12px - 7px);
    }
  }

  .project-card, .event-card{
    height:400px; background:var(--bg-surface); border:1px solid var(--border-color);
    border-radius:8px; padding:12px; display:flex; flex-direction:column;
    overflow:hidden; box-sizing:border-box;
  }
  .card-media, .event-cover-photo-wrap{
    width:100%; aspect-ratio:16/9; border-radius:6px; overflow:hidden;
    margin-bottom:10px; background:#F1F5F9; position:relative; flex-shrink:0;
  }
  .card-media-placeholder{
    width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:#FFFFFF;
  }
  .card-media-placeholder svg{width:32px; height:32px;}
  .event-cover-photo{width:100%; height:100%; object-fit:cover; display:block;}

  .card-header-block{height:42px; flex-shrink:0;}
  .card-title{
    font-family:var(--font-primary); font-size:15px; font-weight:700; color:var(--text-primary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:18px; margin:0;
  }
  .card-description{
    font-family:var(--font-primary); font-size:12px; font-weight:400; color:var(--text-secondary);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:16px; margin-top:2px;
  }

  .subtab-bar{
    display:flex; flex-direction:row; gap:6px; width:100%;
    margin-top:8px; margin-bottom:8px; padding-bottom:6px;
    border-bottom:1px solid var(--border-color); flex-shrink:0;
  }
  .subtab-btn{
    font-family:var(--font-mono); font-size:11px; font-weight:600; padding:4px 8px;
    border-radius:4px; flex-grow:1; text-align:center; border:1px solid var(--border-color);
    background:var(--bg-main); color:var(--text-secondary); cursor:pointer;
    text-decoration:none; display:flex; align-items:center; justify-content:center;
  }
  .subtab-btn.active{background:var(--accent-primary); color:#FFFFFF; border-color:var(--accent-primary);}
  .subtab-url-btn{background:#F1F5F9; color:var(--accent-primary); font-weight:700;}

  .content-pane{flex-grow:1; width:100%; height:120px; overflow-y:auto; box-sizing:border-box;}
  .pane{display:none;}
  .pane.active{display:block;}
  .pane-block{margin-bottom:8px;}
  .pane-label{
    font-family:var(--font-mono); font-size:10px; font-weight:700; color:var(--text-muted);
    text-transform:uppercase; margin-bottom:2px; letter-spacing:0.04em;
  }
  .pane-text{
    font-family:var(--font-primary); font-size:12.5px; color:var(--text-secondary); line-height:16px;
    margin:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .tech-pill-list{display:flex; flex-wrap:wrap; gap:6px;}
  .tech-pill{
    font-family:var(--font-mono); font-size:10px; background:#F1F5F9; border:1px solid var(--border-color);
    border-radius:4px; padding:3px 8px; color:var(--text-secondary);
  }
  .pane-url-link{
    display:inline-flex; align-items:center; gap:6px; font-family:var(--font-mono);
    font-size:12px; font-weight:700; color:var(--accent-primary); text-decoration:none;
  }
  .media-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:6px;}
  .media-thumb{
    height:52px; border-radius:4px; cursor:pointer; display:flex; align-items:center; justify-content:center;
    color:#fff;
  }
  .media-thumb svg{width:16px; height:16px;}

  /* ---------- Section 5: Skills ---------- */
  .skills-tab-bar{
    display:flex; flex-direction:row; gap:6px; overflow-x:auto; margin-bottom:16px; scrollbar-width:none;
  }
  .skills-tab-bar::-webkit-scrollbar{display:none;}
  .skills-tab-bar .filter-tab{
    flex-shrink:0; height:auto; padding:6px 12px; font-size:11px; white-space:nowrap;
  }
  .skills-panel{
    height:400px; min-height:400px; max-height:400px; overflow-y:auto;
    background:var(--bg-surface); border:1px solid var(--border-color); border-radius:8px;
    padding:12px 16px; box-sizing:border-box;
  }
  .skill-row{
    display:flex; align-items:center; justify-content:space-between; height:36px;
    border-bottom:1px solid #F1F5F9;
  }
  .skill-row:last-child{border-bottom:none;}
  .skill-name{font-family:var(--font-primary); font-size:13px; font-weight:600; color:var(--text-primary);}
  .skill-bar-track{width:100px; height:6px; background:#F1F5F9; border-radius:3px; overflow:hidden; flex-shrink:0; margin-left:12px;}
  .skill-bar-fill{background:var(--accent-primary); height:100%; border-radius:3px; transition:width .4s ease;}

  /* ---------- Section 7: Value cards ---------- */
  .value-card{
    height:220px; background:var(--bg-surface); border:1px solid var(--border-color); border-radius:8px;
    padding:16px; display:flex; flex-direction:column; justify-content:flex-start;
    overflow:hidden; box-sizing:border-box;
  }
  .value-card-header{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
  .value-card-icon{
    width:20px; height:20px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  }
  .value-card-icon svg{width:20px; height:20px; stroke:var(--accent-primary); stroke-width:2px; fill:none;}
  .value-card-title{
    font-family:var(--font-primary); font-size:16px; font-weight:700; color:var(--text-primary); margin:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .value-card-text{
    font-family:var(--font-primary); font-size:13.5px; font-weight:400; color:var(--text-secondary);
    line-height:20px; max-height:60px; margin:0;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; text-overflow:ellipsis;
  }

  /* ---------- Section 8: Help Yourself ---------- */
  .help-yourself-container{display:flex; flex-direction:column; gap:12px; width:100%; box-sizing:border-box;}
  .file-select-box{
    height:50px; min-height:50px; width:100%; display:flex; align-items:center;
    padding:0 16px; border-radius:8px; box-sizing:border-box; cursor:pointer; user-select:none;
    transition:all .2s ease; background:var(--bg-surface); border:1px solid var(--border-color); color:var(--text-secondary);
  }
  .file-select-box.selected{background:#EFF6FF; border:1.5px solid var(--accent-primary); color:var(--accent-primary);}
  .file-checkbox{display:none;}
  .file-box-content{display:flex; align-items:center; width:100%;}
  .file-icon{width:20px; height:20px; flex-shrink:0; stroke:currentColor; stroke-width:2px; fill:none;}
  .file-label{
    font-family:var(--font-primary); font-size:14px; font-weight:600; text-transform:uppercase;
    margin-left:12px; flex-grow:1;
  }
  .checkbox-indicator{
    width:18px; height:18px; border-radius:4px; border:1.5px solid var(--border-color); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; transition:all .2s ease;
  }
  .file-select-box.selected .checkbox-indicator{background:var(--accent-primary); border-color:var(--accent-primary);}
  .checkbox-indicator svg{width:12px; height:12px; stroke:#fff; stroke-width:3px; fill:none; display:none;}
  .file-select-box.selected .checkbox-indicator svg{display:block;}

  #recipient-email{
    height:50px; min-height:50px; width:100%; background:var(--bg-surface); border:1px solid var(--border-color);
    border-radius:8px; padding:0 16px; box-sizing:border-box; font-family:var(--font-primary); font-size:14px;
    color:var(--text-primary); outline:none;
  }
  #recipient-email:focus{border-color:var(--accent-primary); box-shadow:0 0 0 1px var(--accent-primary);}
  #recipient-email::placeholder{color:var(--text-muted);}

  .send-action-btn{
    height:50px; min-height:50px; width:100%; background:var(--accent-primary); color:#FFFFFF; border:none;
    border-radius:8px; font-family:var(--font-primary); font-size:15px; font-weight:700; letter-spacing:0.05em;
    text-transform:uppercase; cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .2s ease;
  }
  .send-action-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .send-action-btn.success{background:var(--accent-success);}
  .form-hint{font-family:var(--font-mono); font-size:10.5px; color:var(--text-muted); text-align:center; margin:0;}

  /* ---------- Section 9: Sticky footer ---------- */
  .sticky-footer{
    position:fixed; bottom:0; left:50%; transform:translateX(-50%); width:100%; max-width:430px;
    height:auto; z-index:90; background:rgba(255,255,255,0.90);
    -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px);
    border-top:1px solid var(--border-color); padding:8px 15px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; box-sizing:border-box;
  }
  .footer-line-1, .footer-line-2{display:flex; align-items:center; justify-content:center; gap:6px; width:100%;}
  .verified-icon{width:14px; height:14px; fill:var(--accent-primary); flex-shrink:0;}
  .footer-copyright-text{font-family:var(--font-mono); font-size:12px; font-weight:700; color:var(--text-primary); text-align:center;}
  .status-pulse-dot{
    width:8px; height:8px; border-radius:50%; background:var(--accent-success); position:relative;
    flex-shrink:0; animation:status-pulse 2s infinite;
  }
  @keyframes status-pulse{
    0%{box-shadow:0 0 0 0 rgba(34,197,94,0.7);}
    70%{box-shadow:0 0 0 6px rgba(34,197,94,0);}
    100%{box-shadow:0 0 0 0 rgba(34,197,94,0);}
  }
  .footer-status-text{
    font-family:var(--font-mono); font-size:11px; font-weight:500; color:var(--text-secondary);
    text-transform:uppercase; letter-spacing:0.04em; text-align:center;
  }

  /* ---------- Lightbox ---------- */
  #lightbox-modal{
    position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(15,23,42,0.85);
    display:none; align-items:center; justify-content:center; z-index:9999; padding:24px; box-sizing:border-box;
  }
  #lightbox-modal.open{display:flex;}
  .lightbox-content{
    max-width:90vw; max-height:80vh; width:280px; aspect-ratio:4/3; border-radius:8px;
    box-shadow:0 10px 25px rgba(0,0,0,0.5); display:flex; align-items:center; justify-content:center; color:#fff;
  }
  .lightbox-close{
    position:absolute; top:20px; right:20px; width:36px; height:36px; border-radius:50%;
    background:rgba(255,255,255,0.15); border:none; color:#fff; font-size:20px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    .status-pulse-dot{animation:none;}
    *{transition-duration:0.01ms !important;}
  }
</style>
</head>
<body>

<header id="sticky-header" class="sticky-header">
  <div class="sticky-header-left">
    <span class="header-mini-avatar" id="header-mini-avatar"></span>
    <span class="header-full-name">Lizi Zivzivadze</span>
  </div>
  <div class="sticky-header-right"></div>
</header>

<div class="app-shell">
<main class="app-main">

  <!-- SECTION 3: PROFILE -->
  <section id="profile-section" class="profile-container">
    <span class="profile-avatar" id="profile-avatar"></span>
    <h1 class="profile-name">Lizi Zivzivadze</h1>
    <p class="profile-title">Electromechanical Engineer</p>
    <div class="profile-action-row">
      <a href="mailto:lizozivzivadze@gmail.com" class="profile-btn">Contact</a>
      <a href="#" id="cv-btn" class="profile-btn">CV</a>
      <a href="https://github.com/lizozivzivadze-star" target="_blank" rel="noopener" class="profile-btn">GitHub</a>
    </div>
  </section>

  <!-- SECTION 4: PROJECTS -->
  <section class="app-section" id="projects-section">
    <h2 class="section-title">Projects</h2>
    <nav class="projects-filter-bar" data-target="projects-carousel">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="hardware">Hardware</button>
      <button class="filter-tab" data-filter="embedded">Embedded</button>
      <button class="filter-tab" data-filter="automation">Automation</button>
    </nav>
    <div class="carousel-track" id="projects-carousel"></div>
  </section>

  <!-- SECTION 5: SKILLSETS + SKILLS -->
  <section class="app-section" id="skills-section">
    <h2 class="section-title">Skillsets + Skills</h2>
    <nav class="skills-tab-bar" data-target="skills-panel">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="hardware">Hardware</button>
      <button class="filter-tab" data-filter="software">Software</button>
      <button class="filter-tab" data-filter="mechatronics">Mechatronics</button>
    </nav>
    <div class="skills-panel" id="skills-panel"></div>
  </section>

  <!-- SECTION 6: EVENTS -->
  <section class="app-section" id="events-section">
    <h2 class="section-title">Events</h2>
    <nav class="events-filter-bar" data-target="events-carousel">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="hackathon">Hackathon</button>
      <button class="filter-tab" data-filter="conference">Conference</button>
      <button class="filter-tab" data-filter="expo">Expo</button>
      <button class="filter-tab" data-filter="meetup">Meetup</button>
    </nav>
    <div class="carousel-track" id="events-carousel"></div>
  </section>

  <!-- SECTION 7: WHAT DO I BRING TO THE TABLE -->
  <section class="app-section" id="value-section">
    <h2 class="section-title single-line-title">What Do I Bring to the Table?</h2>
    <div class="carousel-track" id="value-carousel"></div>
  </section>

  <!-- SECTION 8: HELP YOURSELF -->
  <section class="app-section" id="help-yourself-section">
    <h2 class="section-title">Help Yourself</h2>
    <form id="help-yourself-form" class="help-yourself-container">
      <label class="file-select-box" data-box>
        <input type="checkbox" name="selected_files" value="cv" class="file-checkbox">
        <span class="file-box-content">
          <svg class="file-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="file-label">CV</span>
          <span class="checkbox-indicator"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
        </span>
      </label>
      <label class="file-select-box" data-box>
        <input type="checkbox" name="selected_files" value="portfolio" class="file-checkbox">
        <span class="file-box-content">
          <svg class="file-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <span class="file-label">Portfolio</span>
          <span class="checkbox-indicator"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span>
        </span>
      </label>
      <input type="email" id="recipient-email" name="user_email" placeholder="your.email@example.com" required>
      <button type="submit" id="send-pdf-btn" class="send-action-btn">Send</button>
      <p class="form-hint">Sends a request to Lizi — no server required</p>
    </form>
  </section>

</main>
</div>

<footer id="sticky-footer" class="sticky-footer">

   ============================================================ */
const stickyHeader = document.getElementById('sticky-header');
const profileSection = document.getElementById('profile-section');
const headerObserver = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if(!entry.isIntersecting){
      stickyHeader.classList.add('visible');
    } else {
      stickyHeader.classList.remove('visible');
    }
  });
}, {threshold:0});
headerObserver.observe(profileSection);

/* ============================================================

   ============================================================ */
function wireFilterBar(navEl){
  const targetId = navEl.getAttribute('data-target');
  const targetEl = document.getElementById(targetId);
  const tabs = navEl.querySelectorAll('.filter-tab');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const filter = tab.getAttribute('data-filter');
      const items = targetEl.querySelectorAll('[data-category]');
      items.forEach(item => {
        const show = filter === 'all' || item.getAttribute('data-category') === filter;
        item.style.display = show ? '' : 'none';
      });
    });
  });
}
document.querySelectorAll('.projects-filter-bar, .events-filter-bar, .skills-tab-bar').forEach(wireFilterBar);

/* ============================================================
   CARD SUBTABS (overview / techstack / media)
   ============================================================ */
document.querySelectorAll('.subtab-bar').forEach(bar => {
  const cardId = bar.getAttribute('data-card');
  const paneWrap = document.querySelector(`[data-card-pane="${cardId}"]`);
  const buttons = bar.querySelectorAll('.subtab-btn:not(.subtab-url-btn)');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.getAttribute('data-tab');
      paneWrap.querySelectorAll('.pane').forEach(p => {
        p.classList.toggle('active', p.getAttribute('data-tab') === tab);
      });
    });
  });
});

document.querySelectorAll('.file-select-box').forEach(box => {
  const checkbox = box.querySelector('.file-checkbox');
  checkbox.addEventListener('change', () => {
    box.classList.toggle('selected', checkbox.checked);
  });
});

const helpForm = document.getElementById('help-yourself-form');
const sendBtn = document.getElementById('send-pdf-btn');
helpForm.addEventListener('submit', (e) => {
  e.preventDefault();
  const email = document.getElementById('recipient-email').value.trim();
  const selected = Array.from(helpForm.querySelectorAll('input[name="selected_files"]:checked')).map(i => i.value);
  if(!email || selected.length === 0){
    sendBtn.textContent = selected.length === 0 ? 'Pick a file first' : 'Enter your email';
    setTimeout(() => { sendBtn.textContent = 'Send'; }, 1800);
    return;
  }
  sendBtn.disabled = true;
  // No backend on a static portfolio: notify the owner via mailto with the
  // requester's address and selected files, then confirm to the requester locally.
  const subject = encodeURIComponent('Portfolio file request');
  const body = encodeURIComponent(`Requested: ${selected.join(', ')}\nFrom: ${email}`);
  window.location.href = `mailto:lizozivzivadze@gmail.com?subject=${subject}&body=${body}`;
  sendBtn.classList.add('success');
  sendBtn.textContent = 'Sent ✓';
  setTimeout(() => {
    sendBtn.disabled = false;
    sendBtn.classList.remove('success');
    sendBtn.textContent = 'Send';
  }, 3000);
});
