  "SoftWare": '<span class="font-bold">S</span>oft<span class="font-bold">W</span>are',
  "HardWare": '<span class="font-bold">H</span>ard<span class="font-bold">W</span>are',
  "HW+SW": '<span class="font-bold">HW+SW</span>'
};

/* ==================================================
   HELPERS
================================================== */
function extractVideoId(url) {
  const match = url.match(/embed\/([^?&]+)/);
  return match ? match[1] : "";
}

function tabStyle(active) {
  return active
    ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors"
    : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors";
}

function skillTabStyle(active) {
  return active
    ? "px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap bg-[#0284c7] text-white border-[#0284c7] font-bold transition-colors"
    : "px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7] transition-colors";
}

function subTabButton(baseAttrs, label, isActive) {
  return `<button ${baseAttrs} class="${tabStyle(isActive)}">${label}</button>`;
}

/* ==================================================
   HEADER + HERO
================================================== */
function renderHeader() {
  const p = PORTFOLIO_DATA.personal;
  document.getElementById("header-avatar").src = p.avatarUrl;
  document.getElementById("header-avatar").alt = p.name;
  document.getElementById("header-name").textContent = p.name;
}

/* ==================================================
   PROJECTS
================================================== */
function renderProjectTabs() {
  const cats = ["All", "SoftWare", "HardWare", "HW+SW"];
  document.getElementById("project-tabs").innerHTML = cats.map(cat => {
    const active = APP_STATE.activeProjectTab === cat;
    return `<button data-action="select-project-tab" data-value="${cat}" class="${tabStyle(active)}">${CATEGORY_LABEL_HTML[cat]}</button>`;
  }).join("");
}

function getFilteredProjects() {
  if (APP_STATE.activeProjectTab === "All") return PORTFOLIO_DATA.projects;
  return PORTFOLIO_DATA.projects.filter(p => p.category === APP_STATE.activeProjectTab);
}

function renderProjectSubTabContent(project, tab) {
  if (tab === "equipment") {
    return `<div class="flex flex-wrap gap-1.5">${project.details.equipment.map(e =>
      `<span class="inline-block bg-[#f0f9ff] text-[#0284c7] border border-[#e2e8f0] rounded px-2 py-1 text-[12px] font-mono">${e}</span>`
    ).join("")}</div>`;
  }
  if (tab === "urls") {
    return `<div class="flex flex-col gap-1.5">${project.details.urls.map(u =>
      `<a href="${u.url}" target="_blank" rel="noopener" class="flex items-center justify-between bg-white border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-2 text-[13px] font-mono text-[#0284c7]"><span>${u.label}</span>${ICONS.link}</a>`
    ).join("")}</div>`;
  }
  // overview (default)
  return `
    <p class="mb-1.5 leading-relaxed"><span class="font-mono text-[12px] font-bold text-[#0d9488]">OBJECTIVE: </span>${project.details.overview.objective}</p>
    <p class="leading-relaxed"><span class="font-mono text-[12px] font-bold text-[#0d9488]">RESULTS: </span>${project.details.overview.results}</p>
  `;
}

function projectCardHTML(project) {
  const currentSubTab = APP_STATE.projectSubTabs[project.id] || "overview";
  return `
  <div id="project-card-${project.id}" class="w-[calc(100vw-38px)] max-w-[325px] md:w-[325px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">
    <div>
      <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden" id="media-${project.id}">
        <img src="https://img.youtube.com/vi/${extractVideoId(project.videoUrl)}/hqdefault.jpg" class="w-full h-full object-cover" alt="${project.title} preview">
        <button data-action="play-video" data-id="${project.id}" class="absolute inset-0 flex items-center justify-center bg-black/40 hover:bg-black/20 text-white transition-colors" aria-label="Play video">
          ${ICONS.play}
        </button>
      </div>
      <h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">${project.title}</h3>
      <p class="text-[14px] text-[#475569] mb-3 leading-relaxed line-clamp-2">${project.summary}</p>

      <div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
        ${subTabButton(`data-action="project-subtab" data-id="${project.id}" data-tab="overview"`, "OVERVIEW", currentSubTab === "overview")}
        ${subTabButton(`data-action="project-subtab" data-id="${project.id}" data-tab="equipment"`, "EQUIPMENT", currentSubTab === "equipment")}
        ${subTabButton(`data-action="project-subtab" data-id="${project.id}" data-tab="urls"`, "URL", currentSubTab === "urls")}
      </div>

      <div id="content-${project.id}" class="text-[14px] text-[#0f172a]">
        ${renderProjectSubTabContent(project, currentSubTab)}
      </div>
    </div>
  </div>
  `;
}

function renderProjectsCarousel() {
  const filtered = getFilteredProjects();
  document.getElementById("projects-carousel-container").innerHTML = `
    <div class="flex overflow-x-auto snap-x snap-mandatory gap-2.5 pb-3 custom-scrollbar flex-nowrap h-full">
      ${filtered.map(projectCardHTML).join("")}
    </div>
  `;
}

function updateProjectSubTabUI(projectId) {
  const project = PORTFOLIO_DATA.projects.find(p => p.id === projectId);
  if (!project) return;
  const currentSubTab = APP_STATE.projectSubTabs[projectId] || "overview";
  const card = document.getElementById(`project-card-${projectId}`);
  if (card) {
    card.querySelectorAll('[data-action="project-subtab"]').forEach(btn => {
      const isActive = btn.dataset.tab === currentSubTab;
      btn.className = tabStyle(isActive);
    });
  }
  const content = document.getElementById(`content-${projectId}`);
  if (content) content.innerHTML = renderProjectSubTabContent(project, currentSubTab);
}

function playProjectVideo(projectId) {
  const project = PORTFOLIO_DATA.projects.find(p => p.id === projectId);
  if (!project) return;
  const mediaEl = document.getElementById(`media-${projectId}`);
  if (mediaEl) {
    mediaEl.innerHTML = `<iframe src="${project.videoUrl}?autoplay=1" class="w-full h-full border-0" allow="autoplay" allowfullscreen></iframe>`;
  }
}

/* ==================================================
   HELP YOURSELF
================================================== */
function renderDocCards() {
  const cvEl = document.getElementById("doc-cv");
  const portfolioEl = document.getElementById("doc-portfolio");
  const activeClasses = ["border-2", "border-[#0284c7]", "bg-[#f0f9ff]"];
  const inactiveClasses = ["border", "border-[#e2e8f0]", "bg-white"];

  [cvEl, portfolioEl].forEach((el, idx) => {
    const key = idx === 0 ? "cv" : "portfolio";
    const base = "doc-card cursor-pointer rounded-lg px-3.5 py-3 flex items-center gap-3 hover:border-[#0284c7]";
    el.className = APP_STATE.selectedDocs[key]
      ? `${base} ${activeClasses.join(" ")}`
      : `${base} ${inactiveClasses.join(" ")}`;
  });
}

function showToast(message, isError) {
  const toast = document.getElementById("toast");
  toast.textContent = message;
  toast.classList.remove("bg-[#0f172a]", "bg-red-600");
  toast.classList.add(isError ? "bg-red-600" : "bg-[#0f172a]");
  toast.classList.add("show");
  clearTimeout(window._toastTimeout);
  window._toastTimeout = setTimeout(() => toast.classList.remove("show"), 3000);
}

function handleSendDocs() {
  const emailInput = document.getElementById("email-input");
  const email = emailInput.value.trim();
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const selected = Object.keys(APP_STATE.selectedDocs).filter(k => APP_STATE.selectedDocs[k]);

  if (selected.length === 0) {
    showToast("Select at least one document first.", true);
    return;
  }
  if (!emailRegex.test(email)) {
    showToast("Please enter a valid email address.", true);
    return;
  }
  const docNames = selected.map(k => (k === "cv" ? "CV" : "Portfolio")).join(" & ");
  showToast(`${docNames} sent to ${email}`, false);
}

/* ==================================================
   EVENT DELEGATION
================================================== */
function bindGlobalEvents() {
  document.body.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;
    const value = el.dataset.value;
    const tab = el.dataset.tab;

    switch (action) {
      case "select-project-tab":
        APP_STATE.activeProjectTab = value;
        renderProjectTabs();
        renderProjectsCarousel();
        break;
      case "project-subtab":
        APP_STATE.projectSubTabs[id] = tab;
        updateProjectSubTabUI(id);
        break;
      case "play-video":
        playProjectVideo(id);
        break;
      case "select-event-tab":
        APP_STATE.activeEventTab = value;
        renderEventTabs();
        renderEventsCarousel();
        break;
      case "event-subtab":
        APP_STATE.eventSubTabs[id] = tab;
        updateEventSubTabUI(id);
        break;
      case "select-skill-category":
        APP_STATE.activeSkillCategory = value;
        renderSkillTabs();
        renderSkillsList();
        break;
      case "select-doc":
        APP_STATE.selectedDocs[id] = !APP_STATE.selectedDocs[id];
        renderDocCards();
        break;
      case "send-docs":
        handleSendDocs();
        break;
    }
  });

  window.addEventListener("scroll", () => {
    const header = document.getElementById("sticky-header");
    if (window.scrollY > 100) header.classList.add("visible");
    else header.classList.remove("visible");
  });
}

/* ==================================================
   INIT
================================================== */
function initApp() {
  PORTFOLIO_DATA.projects.forEach(p => { APP_STATE.projectSubTabs[p.id] = "overview"; });
  PORTFOLIO_DATA.events.forEach(e => { APP_STATE.eventSubTabs[e.id] = "overview"; });

  renderHeader();
  renderHero();
  renderProjectTabs();
  renderProjectsCarousel();
  renderSkillTabs();
  renderSkillsList();
  renderEventTabs();
  renderEventsCarousel();
  renderValueProps();
  renderDocCards();
  bindGlobalEvents();
}

document.addEventListener("DOMContentLoaded", initApp);
</script>
