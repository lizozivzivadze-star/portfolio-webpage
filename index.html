  // Bold only the naturally-uppercase letters inside composite category labels
  // (e.g. SoftWare -> S,W bold; HardWare -> H,W bold), leaving other letters normal.
  function styledCategoryLabel(label) {
    if (label === "All") return escapeHtml(label);
    return label
      .split("")
      .map(function (ch) {
        const safe = escapeHtml(ch);
        return /[A-Z]/.test(ch) ? '<span class="font-bold">' + safe + "</span>" : safe;
      })
      .join("");
  }

  function showToast(message, isError) {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");
    toast.className =
      "toast-enter fixed left-1/2 -translate-x-1/2 bottom-20 z-[60] px-4 py-2.5 rounded-md shadow-lg text-[13px] font-mono font-semibold max-w-[90vw] text-center " +
      (isError ? "bg-red-50 border border-red-200 text-red-700" : "bg-[#0f172a] text-white");
    toast.textContent = message;
    container.appendChild(toast);
    setTimeout(function () {
      toast.remove();
    }, 3000);
  }

  // ==================================================
  // STICKY HEADER + HERO
  // ==================================================
  function renderStickyHeader() {
    const p = PORTFOLIO_DATA.personal;
    document.getElementById("sticky-header-content").innerHTML =
      '<img src="' + p.avatarUrl + '" class="w-8 h-8 rounded-full object-cover border border-[#e2e8f0]" alt="' + escapeHtml(p.name) + '">' +
      "<span>" + escapeHtml(p.name) + "</span>";
  }

  function updateStickyHeaderVisibility() {
    const header = document.getElementById("sticky-header");
    if (window.scrollY > 100) {
      header.classList.remove("-translate-y-full", "opacity-0", "pointer-events-none");
      header.classList.add("translate-y-0", "opacity-100");
    } else {
      header.classList.add("-translate-y-full", "opacity-0", "pointer-events-none");
      header.classList.remove("translate-y-0", "opacity-100");
    }
  }

  function renderHero() {
    const p = PORTFOLIO_DATA.personal;
    document.getElementById("hero-section").innerHTML =
      '<div class="flex flex-row items-center gap-4">' +
        '<img src="' + p.avatarUrl + '" alt="' + escapeHtml(p.name) + '" class="w-[80px] h-[80px] rounded-full border-2 border-[#0284c7] object-cover shrink-0">' +
        '<div class="flex flex-col min-w-0 flex-1">' +
          '<h1 class="text-[20px] sm:text-[22px] font-bold text-[#0f172a] whitespace-nowrap">' + escapeHtml(p.name) + "</h1>" +
          '<p class="font-mono font-semibold tracking-wider text-[#0369a1] text-[12px] sm:text-[13px] whitespace-nowrap overflow-hidden text-ellipsis w-full">' + escapeHtml(p.title) + "</p>" +
          '<div class="flex items-center gap-3.5 whitespace-nowrap mt-1">' +
            '<a href="tel:' + p.phone.replace(/\s+/g, "") + '" aria-label="Call" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICON_PHONE + "</a>" +
            '<a href="' + p.whatsapp + '" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICON_WHATSAPP + "</a>" +
            '<a href="mailto:' + p.email + '" aria-label="Email" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICON_MAIL + "</a>" +
            '<a href="' + p.linkedin + '" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICON_LINKEDIN + "</a>" +
            '<a href="' + p.github + '" target="_blank" rel="noopener noreferrer" aria-label="GitHub" class="text-[#475569] hover:text-[#0284c7] transition-colors">' + ICON_GITHUB + "</a>" +
          "</div>" +
          '<p class="text-[14px] text-[#475569] font-medium text-center whitespace-nowrap mt-1">' + escapeHtml(p.location) + "</p>" +
        "</div>" +
      "</div>" +
      '<p class="w-full text-[14px] sm:text-[15px] text-[#0f172a] font-medium mt-3.5 pt-3 border-t border-slate-100 leading-relaxed">' + escapeHtml(p.statement) + "</p>";
  }

  // ==================================================
  // PROJECTS
  // ==================================================
  function renderProjectSubTabContent(project, tab) {
    if (tab === "overview") {
      const ov = project.details.overview;
      return (
        '<div class="space-y-2">' +
          '<div><span class="font-mono text-[11px] font-bold text-[#0284c7] tracking-wide">OBJECTIVE</span>' +
          '<p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">' + escapeHtml(ov.objective) + "</p></div>" +
          '<div><span class="font-mono text-[11px] font-bold text-[#0d9488] tracking-wide">RESULTS</span>' +
          '<p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">' + escapeHtml(ov.results) + "</p></div>" +
        "</div>"
      );
    }
    if (tab === "equipment") {
      return (
        '<div class="flex flex-wrap gap-1.5">' +
          project.details.equipment
            .map(function (e) {
              return '<span class="bg-[#f8fafc] border border-[#e2e8f0] rounded-md px-2 py-1 text-[11px] font-mono text-[#475569]">' + escapeHtml(e) + "</span>";
            })
            .join("") +
        "</div>"
      );
    }
    if (tab === "urls") {
      return (
        '<div class="flex flex-col gap-2">' +
          project.details.urls
            .map(function (u) {
              return (
                '<a href="' + u.url + '" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-white border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-2 text-[13px] font-mono font-semibold text-[#0284c7] transition-colors">' +
                  "<span>" + escapeHtml(u.label) + "</span>" + ICON_LINK_OUT +
                "</a>"
              );
            })
            .join("") +
        "</div>"
      );
    }
    return "";
  }

  function renderProjectCard(project) {
    const currentSubTab = APP_STATE.projectSubTabs[project.id] || "overview";
    const videoId = extractVideoId(project.videoUrl);
    return (
      '<div class="w-[88vw] max-w-[340px] md:w-[350px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">' +
        '<div class="flex flex-col h-full min-h-0">' +
          '<div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden shrink-0" id="media-' + project.id + '">' +
            '<img src="https://img.youtube.com/vi/' + videoId + '/hqdefault.jpg" class="w-full h-full object-cover" alt="' + escapeHtml(project.title) + '" />' +
            '<button data-action="play-video" data-id="' + project.id + '" class="absolute inset-0 flex items-center justify-center bg-black/40 hover:bg-black/20 text-white transition-colors" aria-label="Play video for ' + escapeHtml(project.title) + '">' + ICON_PLAY + "</button>" +
          "</div>" +
          '<h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">' + escapeHtml(project.title) + "</h3>" +
          '<p class="text-[14px] text-[#475569] mb-3 leading-relaxed line-clamp-2">' + escapeHtml(project.summary) + "</p>" +
          '<div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">' +
            '<button data-action="project-subtab" data-id="' + project.id + '" data-tab="overview" class="' + tabClass(currentSubTab === "overview") + '">OVERVIEW</button>' +
            '<button data-action="project-subtab" data-id="' + project.id + '" data-tab="equipment" class="' + tabClass(currentSubTab === "equipment") + '">EQUIPMENT</button>' +
            '<button data-action="project-subtab" data-id="' + project.id + '" data-tab="urls" class="' + tabClass(currentSubTab === "urls") + '">URL</button>' +
          "</div>" +
          '<div id="content-' + project.id + '" class="text-[14px] text-[#0f172a] flex-1 min-h-0">' + renderProjectSubTabContent(project, currentSubTab) + "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function renderProjectTabs() {
    const tabs = ["All", "SoftWare", "HardWare", "HW+SW"];
    document.getElementById("project-tabs").innerHTML = tabs
      .map(function (t) {
        return '<button data-action="select-project-tab" data-value="' + t + '" class="' + tabClass(APP_STATE.activeProjectTab === t) + '">' + styledCategoryLabel(t) + "</button>";
      })
      .join("");
  }

  function renderProjectsCarousel() {
    const filtered =
      APP_STATE.activeProjectTab === "All"
        ? PORTFOLIO_DATA.projects
        : PORTFOLIO_DATA.projects.filter(function (p) { return p.category === APP_STATE.activeProjectTab; });
    document.getElementById("projects-carousel-container").innerHTML = filtered.map(renderProjectCard).join("");
  }

  function updateProjectSubtabUI(projectId) {
    const project = PORTFOLIO_DATA.projects.find(function (p) { return p.id === projectId; });
    if (!project) return;
    const currentSubTab = APP_STATE.projectSubTabs[projectId] || "overview";
    const contentEl = document.getElementById("content-" + projectId);
    if (contentEl) contentEl.innerHTML = renderProjectSubTabContent(project, currentSubTab);
    document.querySelectorAll('[data-action="project-subtab"][data-id="' + projectId + '"]').forEach(function (btn) {
      btn.className = tabClass(btn.dataset.tab === currentSubTab);
    });
  }

  // ==================================================
  // SKILLSETS
  // ==================================================
  function renderSkillCategories() {
    const categories = Object.keys(PORTFOLIO_DATA.skills);
    document.getElementById("skill-categories").innerHTML = categories
      .map(function (c) {
        return '<button data-action="select-skill-category" data-value="' + escapeHtml(c) + '" class="' + skillTabClass(APP_STATE.activeSkillCategory === c) + '">' + escapeHtml(c) + "</button>";
      })
      .join("");
  }

  function renderSkillsList() {
    const skills = PORTFOLIO_DATA.skills[APP_STATE.activeSkillCategory] || [];
    document.getElementById("skills-list").innerHTML = skills
      .map(function (s) {
        return (
          '<div class="mb-3 last:mb-0">' +
            '<div class="flex items-center justify-between mb-1 gap-2">' +
              '<span class="text-[13px] font-sans text-[#0f172a] font-medium">' + escapeHtml(s.name) + "</span>" +
              '<span class="text-[12px] font-mono text-[#475569] shrink-0">' + s.level + "%</span>" +
            "</div>" +
            '<div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">' +
              '<div class="h-full bg-[#0284c7] rounded-full" style="width:' + s.level + '%"></div>' +
            "</div>" +
          "</div>"
        );
      })
      .join("");
  }

  // ==================================================
  // EVENTS
  // ==================================================
  function renderEventSubTabContent(event, tab) {
    if (tab === "overview") {
      const ov = event.details.overview;
      return (
        '<div class="space-y-2">' +
          '<div><span class="font-mono text-[11px] font-bold text-[#0284c7] tracking-wide">PARTICIPATION</span>' +
          '<p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">' + escapeHtml(ov.participation) + "</p></div>" +
          '<div><span class="font-mono text-[11px] font-bold text-[#0d9488] tracking-wide">OUTCOMES</span>' +
          '<p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">' + escapeHtml(ov.outcomes) + "</p></div>" +
        "</div>"
      );
    }
    if (tab === "media") {
      return (
        '<div class="grid grid-cols-2 gap-1.5">' +
          event.details.media
            .map(function (m) {
              return '<div class="aspect-video rounded-md overflow-hidden bg-slate-100"><img src="' + m + '" class="w-full h-full object-cover" alt="' + escapeHtml(event.title) + ' media" /></div>';
            })
            .join("") +
        "</div>"
      );
    }
    if (tab === "urls") {
      return (
        '<div class="flex flex-col gap-2">' +
          event.details.urls
            .map(function (u) {
              return (
                '<a href="' + u.url + '" target="_blank" rel="noopener noreferrer" class="flex items-center justify-between bg-white border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-2 text-[13px] font-mono font-semibold text-[#0284c7] transition-colors">' +
                  "<span>" + escapeHtml(u.label) + "</span>" + ICON_LINK_OUT +
                "</a>"
              );
            })
            .join("") +
        "</div>"
      );
    }
    return "";
  }

  function renderEventCard(event) {
    const currentSubTab = APP_STATE.eventSubTabs[event.id] || "overview";
    return (
      '<div class="w-[88vw] max-w-[340px] md:w-[350px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">' +
        '<div class="flex flex-col h-full min-h-0">' +
          '<div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden mb-2 shrink-0">' +
            '<img src="' + event.imageUrl + '" class="w-full h-full object-cover" alt="' + escapeHtml(event.title) + '" />' +
          "</div>" +
          '<h3 class="text-[18px] font-bold text-[#0f172a] mb-1 leading-snug">' + escapeHtml(event.title) + "</h3>" +
          '<p class="text-[14px] text-[#475569] mb-3 leading-relaxed line-clamp-2">' + escapeHtml(event.summary) + "</p>" +
          '<div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">' +
            '<button data-action="event-subtab" data-id="' + event.id + '" data-tab="overview" class="' + tabClass(currentSubTab === "overview") + '">OVERVIEW</button>' +
            '<button data-action="event-subtab" data-id="' + event.id + '" data-tab="media" class="' + tabClass(currentSubTab === "media") + '">MEDIA</button>' +
            '<button data-action="event-subtab" data-id="' + event.id + '" data-tab="urls" class="' + tabClass(currentSubTab === "urls") + '">URL</button>' +
          "</div>" +
          '<div id="event-content-' + event.id + '" class="text-[14px] text-[#0f172a] flex-1 min-h-0">' + renderEventSubTabContent(event, currentSubTab) + "</div>" +
        "</div>" +
      "</div>"
    );
  }

  function renderEventTabs() {
    const tabs = ["All", "Conference", "Hackathon"];
    document.getElementById("event-tabs").innerHTML = tabs
      .map(function (t) {
        return '<button data-action="select-event-tab" data-value="' + t + '" class="' + tabClass(APP_STATE.activeEventTab === t) + '">' + escapeHtml(t) + "</button>";
      })
      .join("");
  }

  function renderEventsCarousel() {
    const filtered =
      APP_STATE.activeEventTab === "All"
        ? PORTFOLIO_DATA.events
        : PORTFOLIO_DATA.events.filter(function (e) { return e.category === APP_STATE.activeEventTab; });
    document.getElementById("events-carousel-container").innerHTML = filtered.map(renderEventCard).join("");
  }

  function updateEventSubtabUI(eventId) {
    const event = PORTFOLIO_DATA.events.find(function (e) { return e.id === eventId; });
    if (!event) return;
    const currentSubTab = APP_STATE.eventSubTabs[eventId] || "overview";
    const contentEl = document.getElementById("event-content-" + eventId);
    if (contentEl) contentEl.innerHTML = renderEventSubTabContent(event, currentSubTab);
    document.querySelectorAll('[data-action="event-subtab"][data-id="' + eventId + '"]').forEach(function (btn) {
      btn.className = tabClass(btn.dataset.tab === currentSubTab);
    });
  }

  // ==================================================
  // VALUE PROPS ("What Do I Bring To The Table")
  // ==================================================
  function renderValueProps() {
    document.getElementById("value-props-carousel").innerHTML = PORTFOLIO_DATA.valueProps
      .map(function (vp, i) {
        const iconPath = ICON_VALUE_PROPS[i % ICON_VALUE_PROPS.length];
        return (
          '<div class="w-[280px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between">' +
            '<div class="aspect-video rounded-md overflow-hidden bg-slate-100 mb-2.5 flex items-center justify-center">' +
              '<svg class="w-10 h-10 text-[#0284c7]" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">' + iconPath + "</svg>" +
            "</div>" +
            '<p class="whitespace-nowrap overflow-hidden text-ellipsis text-[14px] sm:text-[15px] font-bold text-[#0f172a]">' + escapeHtml(vp.title) + "</p>" +
            '<p class="whitespace-nowrap overflow-hidden text-ellipsis text-[12px] text-[#475569] mt-0.5">' + escapeHtml(vp.text) + "</p>" +
          "</div>"
        );
      })
      .join("");
  }

  // ==================================================
  // HELP YOURSELF
  // ==================================================
  function docCardClass(selected) {
    return (
      "flex items-center gap-2.5 p-2.5 rounded-md text-left transition-colors w-full " +
      (selected ? "border-2 border-[#0284c7] bg-[#f0f9ff]" : "border border-[#e2e8f0] bg-white")
    );
  }

  function renderHelpYourself() {
    document.getElementById("help-yourself-body").innerHTML =
      '<div class="flex flex-col gap-2 mb-2">' +
        '<button data-action="toggle-doc" data-value="cv" class="' + docCardClass(APP_STATE.selectedDocs.cv) + '">' +
          '<span class="text-[#0284c7] shrink-0">' + ICON_DOC + "</span>" +
          '<span class="text-[13px] font-mono font-semibold text-[#0f172a]">CV (PDF)</span>' +
        "</button>" +
        '<button data-action="toggle-doc" data-value="portfolio" class="' + docCardClass(APP_STATE.selectedDocs.portfolio) + '">' +
          '<span class="text-[#0d9488] shrink-0">' + ICON_DOC + "</span>" +
          '<span class="text-[13px] font-mono font-semibold text-[#0f172a]">Portfolio (PDF)</span>' +
        "</button>" +
      "</div>" +
      '<input type="email" id="user-email-input" placeholder="your.email@example.com" class="text-[13px] font-sans rounded-md border border-[#e2e8f0] px-3 py-1.5 w-full">' +
      '<button id="send-docs-btn" data-action="send-docs" class="text-[13px] font-mono font-bold text-white bg-[#0284c7] hover:bg-[#0369a1] rounded-md px-4 py-1.5 w-full mt-1">Send Copies Now</button>';
  }

  function handleSendDocs() {
    const emailInput = document.getElementById("user-email-input");
    const email = emailInput ? emailInput.value.trim() : "";
    const selectedLabels = [];
    if (APP_STATE.selectedDocs.cv) selectedLabels.push("CV");
    if (APP_STATE.selectedDocs.portfolio) selectedLabels.push("Portfolio");

    if (selectedLabels.length === 0) {
      showToast("Select at least one document to send.", true);
      return;
    }
    if (!email || email.indexOf("@") === -1 || email.indexOf(".") === -1) {
      showToast("Enter a valid email address.", true);
      return;
    }
    showToast("Dispatched " + selectedLabels.join(", ") + " to " + email, false);
  }

  // ==================================================
  // EVENT DELEGATION
  // ==================================================
  function bindEvents() {
    document.body.addEventListener("click", function (e) {
      const target = e.target.closest("[data-action]");
      if (!target) return;
      const action = target.dataset.action;

      switch (action) {
        case "select-project-tab":
          APP_STATE.activeProjectTab = target.dataset.value;
          renderProjectTabs();
          renderProjectsCarousel();
          break;

        case "project-subtab":
          APP_STATE.projectSubTabs[target.dataset.id] = target.dataset.tab;
          updateProjectSubtabUI(target.dataset.id);
          break;

        case "play-video": {
          const id = target.dataset.id;
          const project = PORTFOLIO_DATA.projects.find(function (p) { return p.id === id; });
          if (project) {
            const mediaEl = document.getElementById("media-" + id);
            if (mediaEl) {
              mediaEl.innerHTML = '<iframe src="' + project.videoUrl + '?autoplay=1" class="w-full h-full border-0" allow="autoplay"></iframe>';
            }
          }
          break;
        }

        case "select-skill-category":
          APP_STATE.activeSkillCategory = target.dataset.value;
          renderSkillCategories();
          renderSkillsList();
          break;

        case "select-event-tab":
          APP_STATE.activeEventTab = target.dataset.value;
          renderEventTabs();
          renderEventsCarousel();
          break;

        case "event-subtab":
          APP_STATE.eventSubTabs[target.dataset.id] = target.dataset.tab;
          updateEventSubtabUI(target.dataset.id);
          break;

        case "toggle-doc": {
          const key = target.dataset.value;
          APP_STATE.selectedDocs[key] = !APP_STATE.selectedDocs[key];
          target.className = docCardClass(APP_STATE.selectedDocs[key]);
          break;
        }

        case "send-docs":
          handleSendDocs();
          break;
      }
    });

    window.addEventListener("scroll", updateStickyHeaderVisibility, { passive: true });
  }

  // ==================================================
  // INIT
  // ==================================================
  function initApp() {
    PORTFOLIO_DATA.projects.forEach(function (p) {
      APP_STATE.projectSubTabs[p.id] = "overview";
    });
    PORTFOLIO_DATA.events.forEach(function (ev) {
      APP_STATE.eventSubTabs[ev.id] = "overview";
    });

    renderStickyHeader();
    renderHero();
    renderProjectTabs();
    renderProjectsCarousel();
    renderSkillCategories();
    renderSkillsList();
    renderEventTabs();
    renderEventsCarousel();
    renderValueProps();
    renderHelpYourself();

    bindEvents();
    updateStickyHeaderVisibility();
  }

  document.addEventListener("DOMContentLoaded", initApp);
})();
</script>
</body>
</html>
