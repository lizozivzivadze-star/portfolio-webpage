  .tab-btn { transition: background-color .18s ease, color .18s ease, border-color .18s ease; }
  .subtab-btn.active { background: var(--ink); color: #fff; }

  .toast-enter { animation: toastIn .25s ease forwards; }
  @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes toastOut { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(12px); } }
  .toast-exit { animation: toastOut .25s ease forwards; }

  .modal-backdrop { background: rgba(15, 23, 42, 0.72); }

  .online-dot {
    box-shadow: 0 0 0 0 rgba(16,185,129,0.55);

  }

    0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.55); }

    100% { box-shadow: 0 0 0 0 rgba(16,185,129,0); }
  }

  .chip {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  ::selection { background: #bae6fd; color: var(--ink); }

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ==================================================
// STICKY HEADER SCROLL BEHAVIOR
// ==================================================
const stickyHeader = document.getElementById('sticky-header');
window.addEventListener('scroll', () => {
  if (window.scrollY > 100) {
    stickyHeader.classList.remove('header-hidden');
    stickyHeader.classList.add('header-visible');
  } else {
    stickyHeader.classList.add('header-hidden');
    stickyHeader.classList.remove('header-visible');
  }
}, { passive: true });

function renderHero() {
  const p = PORTFOLIO_DATA.personal;
  document.getElementById('hero-avatar').src = p.avatarUrl;
  document.getElementById('hero-name').textContent = p.name;
  document.getElementById('hero-title').textContent = p.title;
  document.getElementById('hero-statement').textContent = p.statement;

  const contacts = document.getElementById('hero-contacts');
  contacts.innerHTML = `
    <a href="tel:${p.phone.replace(/\s+/g, '')}" title="Phone" class="text-[#475569] hover:text-[#0284c7] transition-colors w-4 h-4">${ICONS.phone}</a>
    <a href="${p.whatsapp}" target="_blank" rel="noopener" title="WhatsApp" class="text-[#475569] hover:text-[#0d9488] transition-colors w-4 h-4">${ICONS.whatsapp}</a>
    <a href="mailto:${p.email}" title="Email" class="text-[#475569] hover:text-[#0284c7] transition-colors w-4 h-4">${ICONS.email}</a>
    <a href="${p.linkedin}" target="_blank" rel="noopener" title="LinkedIn" class="text-[#475569] hover:text-[#0284c7] transition-colors w-4 h-4">${ICONS.linkedin}</a>

// ==================================================
// RENDER: PROJECTS
// ==================================================
let activeProjectFilter = 'HW+SW';
const projectFilters = ['HW+SW', 'HardWare', 'SoftWare'];
const projectCardState = {}; // id -> active subtab

function matchesProjectFilter(category, filter) {
  if (filter === 'HW+SW') return true;
  if (filter === 'HardWare') return category === 'HardWare' || category === 'HW+SW';
  if (filter === 'SoftWare') return category === 'SoftWare' || category === 'HW+SW';
  return true;
}

function renderProjectFilterTabs() {
  const wrap = document.getElementById('project-filter-tabs');
  wrap.innerHTML = projectFilters.map(f => `
    <button data-filter="${f}" class="tab-btn font-mono text-[11px] font-semibold tracking-wide px-3 py-1.5 rounded-md border ${activeProjectFilter === f ? 'bg-[#0284c7] text-white border-[#0284c7]' : 'bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7]'}">${f}</button>
  `).join('');
  wrap.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeProjectFilter = btn.dataset.filter;
      renderProjectFilterTabs();
      renderProjectCards();
    });
  });
}

function projectSubtabContent(project, subtab) {
  if (subtab === 'overview') {
    const o = project.details.overview;
    return `
      <div class="space-y-2 text-xs text-[#475569] leading-relaxed">
        <p><span class="font-semibold text-[#0f172a]">Objective:</span> ${escapeHtml(o.objective)}</p>
        <p><span class="font-semibold text-[#0f172a]">Contribution:</span> ${escapeHtml(o.contribution)}</p>
        <p><span class="font-semibold text-[#0f172a]">Results:</span> ${escapeHtml(o.results)}</p>
      </div>`;
  }
  if (subtab === 'equipment') {
    return `<div class="flex flex-wrap gap-1.5">${project.details.equipment.map(e => `<span class="chip text-[10px] bg-[#f0f9ff] text-[#0369a1] border border-[#bae6fd] rounded px-2 py-1">${escapeHtml(e)}</span>`).join('')}</div>`;
  }
  if (subtab === 'url') {
    return `<div class="flex flex-col gap-1.5">${project.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener" class="text-xs font-semibold text-[#0284c7] hover:text-[#0369a1] hover:underline">${escapeHtml(u.label)} ↗</a>`).join('')}</div>`;
  }
  return '';
}

function renderProjectCards() {
  const wrap = document.getElementById('project-cards');
  const filtered = PORTFOLIO_DATA.projects.filter(p => matchesProjectFilter(p.category, activeProjectFilter));

  wrap.innerHTML = filtered.map(project => {
    if (!projectCardState[project.id]) projectCardState[project.id] = 'overview';
    const activeSub = projectCardState[project.id];
    return `
    <div class="w-[280px] md:w-[320px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">
      <div>
        <div class="aspect-video relative rounded-lg bg-slate-900 overflow-hidden cursor-pointer video-trigger" data-video="${project.videoUrl}">
          <img src="https://img.youtube.com/vi/dQw4w9WgXcQ/hqdefault.jpg" alt="${escapeHtml(project.title)} preview" class="w-full h-full object-cover opacity-80">
          <div class="absolute inset-0 flex items-center justify-center">
            <div class="w-10 h-10">${ICONS.play}</div>
          </div>
          <span class="absolute top-2 right-2 chip text-[9px] font-semibold bg-black/60 text-white rounded px-1.5 py-0.5">${escapeHtml(project.category)}</span>
        </div>
        <h3 class="font-bold text-[#0f172a] mt-3 mb-1 leading-snug text-sm">${escapeHtml(project.title)}</h3>
        <p class="text-xs text-[#475569] mb-3 leading-relaxed">${escapeHtml(project.summary)}</p>
      </div>
      <div>
        <div class="flex items-center gap-1 border-b border-[#e2e8f0] pb-2 mb-2">
          ${['overview','equipment','url'].map(st => `
            <button data-project="${project.id}" data-subtab="${st}" class="subtab-btn ${activeSub === st ? 'active' : ''} font-mono text-[10px] font-semibold uppercase tracking-wide px-2 py-1 rounded ${activeSub === st ? '' : 'text-[#475569] hover:bg-slate-100'}">${st === 'url' ? 'URL' : st}</button>
          `).join('')}
        </div>
        <div class="subtab-content min-h-[92px]">${projectSubtabContent(project, activeSub)}</div>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      projectCardState[btn.dataset.project] = btn.dataset.subtab;
      renderProjectCards();
    });
  });
  wrap.querySelectorAll('.video-trigger').forEach(el => {
    el.addEventListener('click', () => openVideoModal(el.dataset.video));
  });
}

// ==================================================
// RENDER: SKILLS
// ==================================================
const skillCategories = Object.keys(PORTFOLIO_DATA.skills);
let activeSkillCategory = skillCategories[0];

function renderSkillCategoryTabs() {
  const wrap = document.getElementById('skill-category-tabs');
  wrap.innerHTML = skillCategories.map(cat => `
    <button data-cat="${cat}" class="tab-btn shrink-0 font-mono text-[11px] font-semibold tracking-wide px-3 py-1.5 rounded-md border whitespace-nowrap ${activeSkillCategory === cat ? 'bg-[#0284c7] text-white border-[#0284c7]' : 'bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7]'}">${cat}</button>
  `).join('');
  wrap.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSkillCategory = btn.dataset.cat;
      renderSkillCategoryTabs();
      renderSkillList();
    });
  });
}

function renderSkillList() {
  const wrap = document.getElementById('skill-list');
  const skills = PORTFOLIO_DATA.skills[activeSkillCategory];
  wrap.innerHTML = skills.map(s => `
    <div>
      <div class="flex items-center justify-between mb-1">
        <span class="text-xs font-medium text-[#0f172a]">${escapeHtml(s.name)}</span>
        <span class="font-mono text-[10px] text-[#0369a1] font-semibold">${s.level}%</span>
      </div>
      <div class="skill-bar-track w-full h-1.5 rounded-full overflow-hidden">
        <div class="skill-bar-fill h-full rounded-full" style="width:${s.level}%"></div>
      </div>
    </div>
  `).join('');
}

// ==================================================
// RENDER: EVENTS
// ==================================================
const eventCardState = {};

function eventSubtabContent(event, subtab) {
  if (subtab === 'overview') {
    const o = event.details.overview;
    return `
      <div class="space-y-2 text-xs text-[#475569] leading-relaxed">
        <p><span class="font-semibold text-[#0f172a]">Why It Mattered:</span> ${escapeHtml(o.whyMattered)}</p>
        <p><span class="font-semibold text-[#0f172a]">Participation:</span> ${escapeHtml(o.participation)}</p>
        <p><span class="font-semibold text-[#0f172a]">Outcomes:</span> ${escapeHtml(o.outcomes)}</p>
      </div>`;
  }
  if (subtab === 'media') {
    return `<div class="grid grid-cols-3 gap-1.5">${event.details.media.map(m => `<img src="${m}" alt="Event media" class="w-full h-14 object-cover rounded">`).join('')}</div>`;
  }
  if (subtab === 'url') {
    return `<div class="flex flex-col gap-1.5">${event.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener" class="text-xs font-semibold text-[#0284c7] hover:text-[#0369a1] hover:underline">${escapeHtml(u.label)} ↗</a>`).join('')}</div>`;
  }
  return '';
}

function renderEventCards() {
  const wrap = document.getElementById('event-cards');
  wrap.innerHTML = PORTFOLIO_DATA.events.map(event => {
    if (!eventCardState[event.id]) eventCardState[event.id] = 'overview';
    const activeSub = eventCardState[event.id];
    return `
    <div class="w-[280px] md:w-[320px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">
      <div>
        <div class="aspect-video relative rounded-lg bg-slate-900 overflow-hidden">
          <img src="${event.imageUrl}" alt="${escapeHtml(event.title)}" class="w-full h-full object-cover">
        </div>
        <h3 class="font-bold text-[#0f172a] mt-3 mb-1 leading-snug text-sm">${escapeHtml(event.title)}</h3>
        <p class="text-xs text-[#475569] mb-3 leading-relaxed">${escapeHtml(event.summary)}</p>
      </div>
      <div>
        <div class="flex items-center gap-1 border-b border-[#e2e8f0] pb-2 mb-2">
          ${['overview','media','url'].map(st => `
            <button data-event="${event.id}" data-subtab="${st}" class="subtab-btn ${activeSub === st ? 'active' : ''} font-mono text-[10px] font-semibold uppercase tracking-wide px-2 py-1 rounded ${activeSub === st ? '' : 'text-[#475569] hover:bg-slate-100'}">${st === 'url' ? 'URL' : st}</button>
          `).join('')}
        </div>
        <div class="subtab-content min-h-[92px]">${eventSubtabContent(event, activeSub)}</div>
      </div>
    </div>`;
  }).join('');

  wrap.querySelectorAll('.subtab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      eventCardState[btn.dataset.event] = btn.dataset.subtab;
      renderEventCards();
    });
  });
}

// ==================================================
// RENDER: WHAT DO I BRING TO THE TABLE
// ==================================================
function renderValueProps() {
  const wrap = document.getElementById('value-props');
  wrap.innerHTML = PORTFOLIO_DATA.valueProps.map(v => `
    <div class="shrink-0 w-[280px] md:w-[300px] min-h-[220px] md:min-h-[240px] snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-5 flex flex-col justify-between shadow-xs">
      <div class="w-9 h-9 rounded-md bg-[#0284c7]/10 flex items-center justify-center text-[#0284c7] font-mono text-xs font-bold">${escapeHtml(v.title.split(' ').map(w => w[0]).slice(0,2).join(''))}</div>
      <div>
        <p class="font-mono text-[10px] uppercase tracking-wider text-[#0d9488] font-semibold mb-2">${escapeHtml(v.title)}</p>
        <p class="text-base font-bold text-[#0f172a] leading-snug">${escapeHtml(v.text)}</p>
      </div>
    </div>
  `).join('');
}

// ==================================================
// VIDEO MODAL
// ==================================================
const videoModal = document.getElementById('video-modal');
const videoModalIframe = document.getElementById('video-modal-iframe');

function openVideoModal(url) {
  videoModalIframe.src = url + (url.includes('?') ? '&' : '?') + 'autoplay=1';
  videoModal.classList.remove('hidden');
  videoModal.classList.add('flex');
  document.body.style.overflow = 'hidden';
}
function closeVideoModal() {
  videoModalIframe.src = '';
  videoModal.classList.add('hidden');
  videoModal.classList.remove('flex');
  document.body.style.overflow = '';
}
document.getElementById('video-modal-close').addEventListener('click', closeVideoModal);
videoModal.addEventListener('click', (e) => { if (e.target === videoModal) closeVideoModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeVideoModal(); });

// ==================================================
// HELP YOURSELF (DOCUMENT SECTION)
// ==================================================
const cvCard = document.getElementById('cv-doc-card');
const portfolioCard = document.getElementById('portfolio-doc-card');
const emailInput = document.getElementById('doc-email-input');
const sendBtn = document.getElementById('send-docs-btn');
let cvSelected = false;
let portfolioSelected = false;

function updateDocCardStyle(card, selected) {
  if (selected) {
    card.classList.add('border-2', 'border-[#0284c7]', 'bg-[#f0f9ff]');
    card.classList.remove('border', 'border-[#e2e8f0]');
  } else {
    card.classList.remove('border-2', 'border-[#0284c7]', 'bg-[#f0f9ff]');
    card.classList.add('border', 'border-[#e2e8f0]');
  }
}

cvCard.addEventListener('click', () => {
  cvSelected = !cvSelected;
  updateDocCardStyle(cvCard, cvSelected);
});
portfolioCard.addEventListener('click', () => {
  portfolioSelected = !portfolioSelected;
  updateDocCardStyle(portfolioCard, portfolioSelected);
});

function isValidEmail(v) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
}

function showToast(message, isError) {
  const container = document.getElementById('toast-container');
  const toast = document.createElement('div');
  toast.className = `toast-enter max-w-[280px] text-xs font-medium rounded-lg px-4 py-3 shadow-lg border ${isError ? 'bg-red-50 text-red-700 border-red-200' : 'bg-white text-[#0f172a] border-[#e2e8f0]'}`;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
    toast.classList.remove('toast-enter');
    toast.classList.add('toast-exit');
    setTimeout(() => toast.remove(), 260);
  }, 3200);
}

sendBtn.addEventListener('click', () => {
  const email = emailInput.value.trim();
  const items = [];
  if (cvSelected) items.push('CV Document');
  if (portfolioSelected) items.push('Portfolio Document');

  if (items.length === 0) {
    showToast('Select at least one document before sending.', true);
    return;
  }
  if (!isValidEmail(email)) {
    showToast('Enter a valid email address to continue.', true);
    return;
  }
  showToast(`Dispatched ${items.join(' & ')} to ${email}`, false);
});

// ==================================================
// INIT
// ==================================================
renderHero();
renderProjectFilterTabs();
renderProjectCards();
renderSkillCategoryTabs();
renderSkillList();
renderEventCards();
renderValueProps();
</script>
