    github: `<svg viewBox="0 0 24 24" fill="currentColor" class="w-4 h-4"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.58 2 12.17c0 4.49 2.87 8.3 6.84 9.64.5.1.68-.22.68-.49v-1.7c-2.78.62-3.37-1.36-3.37-1.36-.46-1.18-1.11-1.5-1.11-1.5-.9-.63.07-.62.07-.62 1 .07 1.53 1.05 1.53 1.05.89 1.55 2.34 1.1 2.91.84.09-.66.35-1.1.63-1.35-2.22-.26-4.56-1.14-4.56-5.05 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.31.1-2.72 0 0 .84-.27 2.75 1.05a9.4 9.4 0 0 1 5 0c1.91-1.32 2.75-1.05 2.75-1.05.55 1.41.2 2.46.1 2.72.64.72 1.03 1.63 1.03 2.75 0 3.92-2.34 4.79-4.57 5.04.36.32.68.94.68 1.9v2.82c0 .27.18.6.69.49A10.02 10.02 0 0 0 22 12.17C22 6.58 17.52 2 12 2z"/></svg>`,
    play: `<svg class="w-12 h-12 pointer-events-none" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`
  };

  // ==================================================
  // HELPERS
  // ==================================================
  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function extractVideoId(url) {
    const parts = url.split("/");
    return parts[parts.length - 1].split("?")[0];
  }

  function subTabStyle(isActive) {
    return isActive
      ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-3 py-1.5 text-[13px] font-mono"
      : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono";
  }

  function mainTabStyle(isActive) {
    return isActive
      ? "bg-[#0284c7] text-white border border-[#0284c7] font-bold rounded-md px-3 py-1.5 text-[13px] font-mono"
      : "bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono";
  }

  function showToast(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.remove("opacity-0", "pointer-events-none");
    toast.classList.add("opacity-100");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => {
      toast.classList.remove("opacity-100");
      toast.classList.add("opacity-0", "pointer-events-none");
    }, 2600);
  }

  // ==================================================
  // HERO RENDERING
  // ==================================================
  function renderHero() {
    const p = PORTFOLIO_DATA.personal;
    document.getElementById("hero-avatar").src = p.avatarUrl;
    document.getElementById("hero-name").textContent = p.name;
    document.getElementById("hero-title").textContent = p.title;
    document.getElementById("hero-location").textContent = p.location;
    document.getElementById("hero-statement").textContent = p.statement;

    const iconLinkClass = "text-[#0284c7] hover:text-[#0369a1] transition-colors";
    document.getElementById("hero-contact-icons").innerHTML = `
      <a href="tel:${p.phone.replace(/\s+/g, "")}" class="${iconLinkClass}" aria-label="Call">${ICONS.phone}</a>
      <a href="${p.whatsapp}" target="_blank" rel="noopener noreferrer" class="${iconLinkClass}" aria-label="WhatsApp">${ICONS.whatsapp}</a>
      <a href="mailto:${p.email}" class="${iconLinkClass}" aria-label="Email">${ICONS.mail}</a>
      <a href="${p.linkedin}" target="_blank" rel="noopener noreferrer" class="${iconLinkClass}" aria-label="LinkedIn">${ICONS.linkedin}</a>
      <a href="${p.github}" target="_blank" rel="noopener noreferrer" class="${iconLinkClass}" aria-label="GitHub">${ICONS.github}</a>
    `;

    document.getElementById("sticky-header").querySelector("span").textContent = p.name;
  }

  // ==================================================
  // PROJECTS RENDERING
  // ==================================================
  function getProjectCategories() {
    const cats = [];
    PORTFOLIO_DATA.projects.forEach((p) => {
      if (!cats.includes(p.category)) cats.push(p.category);
    });
    return ["All", ...cats];
  }

  function renderProjectTabs() {
    const cats = getProjectCategories();
    document.getElementById("project-tabs").innerHTML = cats
      .map((c) => `<button data-action="select-project-tab" data-value="${escapeHtml(c)}" class="${mainTabStyle(APP_STATE.activeProjectTab === c)}">${escapeHtml(c)}</button>`)
      .join("");
  }

  function updateProjectTabStyles() {
    const container = document.getElementById("project-tabs");
    container.querySelectorAll("button[data-action='select-project-tab']").forEach((btn) => {
      btn.className = mainTabStyle(btn.dataset.value === APP_STATE.activeProjectTab);
    });
  }

  function renderProjectSubTabContent(project, tab) {
    if (tab === "equipment") {
      return project.details.equipment
        .map((eq) => `<span class="font-mono text-[12px] bg-slate-100 text-[#0f172a] px-2 py-1 rounded border border-[#e2e8f0]">${escapeHtml(eq)}</span>`)
        .join("");
    }
    if (tab === "urls") {
      return project.details.urls
        .map((u) => `<a href="${u.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full bg-[#0284c7] hover:bg-[#0369a1] text-white font-mono font-bold text-[13px] rounded-md px-3 py-2 transition-colors">${escapeHtml(u.label)}</a>`)
        .join("");
    }
    // overview
    const ov = project.details.overview;
    return `
      <div class="w-full flex flex-col gap-2">
        <p class="leading-relaxed"><span class="font-mono font-bold text-[#0369a1]">Objective:</span> ${escapeHtml(ov.objective)}</p>
        <p class="leading-relaxed"><span class="font-mono font-bold text-[#0d9488]">Results:</span> ${escapeHtml(ov.results)}</p>
      </div>
    `;
  }

  function renderProjectCard(project) {
    const currentSubTab = APP_STATE.projectSubTabs[project.id] || "overview";
    const contentWrapClass = currentSubTab === "equipment"
      ? "text-[14px] text-[#0f172a] flex flex-wrap gap-1.5 break-words"
      : (currentSubTab === "urls" ? "text-[14px] text-[#0f172a] flex flex-col gap-1.5 break-words" : "text-[14px] text-[#0f172a] flex flex-col gap-1.5 break-words");

    return `
      <div class="w-[calc(100vw-34px)] max-w-[327px] md:w-[327px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs h-auto min-h-fit overflow-visible select-none touch-pan-x">
        <div>
          <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden select-none" id="media-${project.id}">
            <img src="https://img.youtube.com/vi/${extractVideoId(project.videoUrl)}/hqdefault.jpg" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="${escapeHtml(project.title)}">
            <button data-action="play-video" data-id="${project.id}" class="absolute inset-0 flex items-center justify-center bg-black/40 hover:bg-black/20 text-white transition-colors">
              ${ICONS.play}
            </button>
          </div>
          <h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">${escapeHtml(project.title)}</h3>
          <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${escapeHtml(project.summary)}</p>

          <div id="subtabs-${project.id}" class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
            <button data-action="project-subtab" data-id="${project.id}" data-tab="overview" class="${subTabStyle(currentSubTab === "overview")}">OVERVIEW</button>
            <button data-action="project-subtab" data-id="${project.id}" data-tab="equipment" class="${subTabStyle(currentSubTab === "equipment")}">EQUIPMENT</button>
            <button data-action="project-subtab" data-id="${project.id}" data-tab="urls" class="${subTabStyle(currentSubTab === "urls")}">URL</button>
          </div>

          <div id="content-${project.id}" class="${contentWrapClass}">
            ${renderProjectSubTabContent(project, currentSubTab)}
          </div>
        </div>
      </div>
    `;
  }

  function renderProjectsCarousel() {
    const filtered = APP_STATE.activeProjectTab === "All"
      ? PORTFOLIO_DATA.projects
      : PORTFOLIO_DATA.projects.filter((p) => p.category === APP_STATE.activeProjectTab);
    document.getElementById("projects-carousel-container").innerHTML = filtered.map(renderProjectCard).join("");
  }

  // ==================================================
  // SKILLS RENDERING
  // ==================================================
  function renderSkillCategoryTabs() {
    const cats = Object.keys(PORTFOLIO_DATA.skills);
    document.getElementById("skill-category-tabs").innerHTML = cats
      .map((c) => `<button data-action="select-skill-category" data-value="${escapeHtml(c)}" class="px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap ${APP_STATE.activeSkillCategory === c ? "bg-[#0284c7] text-white border-[#0284c7] font-bold" : "bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7]"}">${escapeHtml(c)}</button>`)
      .join("");
  }

  function updateSkillCategoryTabStyles() {
    document.querySelectorAll("#skill-category-tabs button[data-action='select-skill-category']").forEach((btn) => {
      const active = btn.dataset.value === APP_STATE.activeSkillCategory;
      btn.className = `px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap ${active ? "bg-[#0284c7] text-white border-[#0284c7] font-bold" : "bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7]"}`;
    });
  }

  function renderSkillsList() {
    const skills = PORTFOLIO_DATA.skills[APP_STATE.activeSkillCategory] || [];
    document.getElementById("skills-list-container").innerHTML = skills
      .map((s) => `
        <div class="mb-3 last:mb-0">
          <div class="flex justify-between items-baseline text-[13px] font-mono mb-1 gap-2">
            <span class="text-[#0f172a] truncate">${escapeHtml(s.name)}</span>
            <span class="text-[#0284c7] font-bold shrink-0">${s.level}%</span>
          </div>
          <div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-[#0284c7] rounded-full" style="width:${s.level}%"></div>
          </div>
        </div>
      `)
      .join("");
  }

  // ==================================================
  // EVENTS RENDERING
  // ==================================================
  function getEventCategories() {
    const cats = [];
    PORTFOLIO_DATA.events.forEach((e) => {
      if (!cats.includes(e.category)) cats.push(e.category);
    });
    return ["All", ...cats];
  }

  function renderEventTabs() {
    const cats = getEventCategories();
    document.getElementById("event-tabs").innerHTML = cats
      .map((c) => `<button data-action="select-event-tab" data-value="${escapeHtml(c)}" class="${mainTabStyle(APP_STATE.activeEventTab === c)}">${escapeHtml(c)}</button>`)
      .join("");
  }

  function updateEventTabStyles() {
    document.querySelectorAll("#event-tabs button[data-action='select-event-tab']").forEach((btn) => {
      btn.className = mainTabStyle(btn.dataset.value === APP_STATE.activeEventTab);
    });
  }

  function renderEventSubTabContent(event, tab) {
    if (tab === "media") {
      return event.details.media
        .map((src) => `<div class="w-full aspect-video rounded-md overflow-hidden bg-slate-900"><img src="${src}" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag:none;" alt="${escapeHtml(event.title)}"></div>`)
        .join("");
    }
    if (tab === "urls") {
      return event.details.urls
        .map((u) => `<a href="${u.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center w-full bg-[#0284c7] hover:bg-[#0369a1] text-white font-mono font-bold text-[13px] rounded-md px-3 py-2 transition-colors">${escapeHtml(u.label)}</a>`)
        .join("");
    }
    const ov = event.details.overview;
    return `
      <p class="leading-relaxed"><span class="font-mono font-bold text-[#0369a1]">Participation:</span> ${escapeHtml(ov.participation)}</p>
      <p class="leading-relaxed"><span class="font-mono font-bold text-[#0d9488]">Outcomes:</span> ${escapeHtml(ov.outcomes)}</p>
    `;
  }

  function renderEventCard(event) {
    const currentSubTab = APP_STATE.eventSubTabs[event.id] || "overview";
    return `
      <div class="w-[calc(100vw-34px)] max-w-[327px] md:w-[327px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs h-auto min-h-fit overflow-visible select-none touch-pan-x">
        <div>
          <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden mb-2 select-none">
            <img src="${event.imageUrl}" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="${escapeHtml(event.title)}">
          </div>
          <h3 class="text-[18px] font-bold text-[#0f172a] mb-1 leading-snug">${escapeHtml(event.title)}</h3>
          <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${escapeHtml(event.summary)}</p>

          <div id="event-subtabs-${event.id}" class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
            <button data-action="event-subtab" data-id="${event.id}" data-tab="overview" class="${subTabStyle(currentSubTab === "overview")}">OVERVIEW</button>
            <button data-action="event-subtab" data-id="${event.id}" data-tab="media" class="${subTabStyle(currentSubTab === "media")}">MEDIA</button>
            <button data-action="event-subtab" data-id="${event.id}" data-tab="urls" class="${subTabStyle(currentSubTab === "urls")}">URL</button>
          </div>

          <div id="event-content-${event.id}" class="text-[14px] text-[#0f172a] flex flex-col gap-1.5 break-words">
            ${renderEventSubTabContent(event, currentSubTab)}
          </div>
        </div>
      </div>
    `;
  }

  function renderEventsCarousel() {
    const filtered = APP_STATE.activeEventTab === "All"
      ? PORTFOLIO_DATA.events
      : PORTFOLIO_DATA.events.filter((e) => e.category === APP_STATE.activeEventTab);
    document.getElementById("events-carousel-container").innerHTML = filtered.map(renderEventCard).join("");
  }

  // ==================================================
  // VALUE PROPS RENDERING
  // ==================================================
  function renderValueProps() {
    document.getElementById("value-props-carousel").innerHTML = PORTFOLIO_DATA.valueProps
      .map((v) => `
        <div class="w-[220px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-2.5 flex flex-col justify-between h-[195px] select-none touch-pan-x">
          <div class="aspect-[4/3] rounded-md overflow-hidden bg-slate-100 mb-2 w-full h-[135px] pointer-events-none">
            <img src="${v.imageUrl}" class="w-full h-full object-cover pointer-events-none" draggable="false" style="-webkit-user-drag: none;" alt="${escapeHtml(v.label)}">
          </div>
          <p class="text-[13px] font-mono font-bold text-[#0f172a] text-center whitespace-nowrap overflow-hidden text-ellipsis w-full mt-1">${escapeHtml(v.label)}</p>
        </div>
      `)
      .join("");
  }

  // ==================================================
  // HELP YOURSELF RENDERING
  // ==================================================
  function updateDocCardStyles() {
    const cvCard = document.getElementById("doc-card-cv");
    const portfolioCard = document.getElementById("doc-card-portfolio");
    const base = "p-3.5 rounded-lg border border-[#e2e8f0] bg-white cursor-pointer flex items-center justify-center gap-2 text-center select-none";
    const activeExtra = " border-2 border-[#0284c7] bg-[#f0f9ff]";
    cvCard.className = base + (APP_STATE.selectedDocs.cv ? activeExtra : "");
    portfolioCard.className = base + (APP_STATE.selectedDocs.portfolio ? activeExtra : "");
  }

  // ==================================================
  // EVENT DELEGATION
  // ==================================================
  function handleClick(e) {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const action = el.dataset.action;

    switch (action) {
      case "select-project-tab": {
        APP_STATE.activeProjectTab = el.dataset.value;
        renderProjectsCarousel();
        updateProjectTabStyles();
        break;
      }
      case "project-subtab": {
        const id = el.dataset.id;
        const tab = el.dataset.tab;
        APP_STATE.projectSubTabs[id] = tab;
        const project = PORTFOLIO_DATA.projects.find((p) => p.id === id);
        if (project) {
          const contentEl = document.getElementById(`content-${id}`);
          contentEl.className = tab === "equipment"
            ? "text-[14px] text-[#0f172a] flex flex-wrap gap-1.5 break-words"
            : "text-[14px] text-[#0f172a] flex flex-col gap-1.5 break-words";
          contentEl.innerHTML = renderProjectSubTabContent(project, tab);
          const subtabsEl = document.getElementById(`subtabs-${id}`);
          subtabsEl.querySelectorAll("button[data-action='project-subtab']").forEach((btn) => {
            btn.className = subTabStyle(btn.dataset.tab === tab);
          });
        }
        break;
      }
      case "play-video": {
        const id = el.dataset.id;
        const project = PORTFOLIO_DATA.projects.find((p) => p.id === id);
        if (project) {
          document.getElementById(`media-${id}`).innerHTML = `<iframe src="${project.videoUrl}?autoplay=1" class="w-full h-full border-0" allow="autoplay" draggable="false"></iframe>`;
        }
        break;
      }
      case "select-skill-category": {
        APP_STATE.activeSkillCategory = el.dataset.value;
        renderSkillsList();
        updateSkillCategoryTabStyles();
        break;
      }
      case "select-event-tab": {
        APP_STATE.activeEventTab = el.dataset.value;
        renderEventsCarousel();
        updateEventTabStyles();
        break;
      }
      case "event-subtab": {
        const id = el.dataset.id;
        const tab = el.dataset.tab;
        APP_STATE.eventSubTabs[id] = tab;
        const event = PORTFOLIO_DATA.events.find((ev) => ev.id === id);
        if (event) {
          document.getElementById(`event-content-${id}`).innerHTML = renderEventSubTabContent(event, tab);
          const subtabsEl = document.getElementById(`event-subtabs-${id}`);
          subtabsEl.querySelectorAll("button[data-action='event-subtab']").forEach((btn) => {
            btn.className = subTabStyle(btn.dataset.tab === tab);
          });
        }
        break;
      }
      case "toggle-doc": {
        const doc = el.dataset.doc;
        APP_STATE.selectedDocs[doc] = !APP_STATE.selectedDocs[doc];
        updateDocCardStyles();
        break;
      }
      case "send-docs": {
        const emailInput = document.getElementById("user-email-input");
        const email = emailInput.value.trim();
        const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        const anyDocSelected = APP_STATE.selectedDocs.cv || APP_STATE.selectedDocs.portfolio;

        if (!emailValid) {
          showToast("Please enter a valid email address.");
          return;
        }
        if (!anyDocSelected) {
          showToast("Select at least one document first.");
          return;
        }
        showToast("Sent! Check your inbox shortly.");
        emailInput.value = "";
        APP_STATE.selectedDocs.cv = false;
        APP_STATE.selectedDocs.portfolio = false;
        updateDocCardStyles();
        break;
      }
      default:
        break;
    }
  }

  // ==================================================
  // STICKY HEADER SCROLL BEHAVIOR
  // ==================================================
  function handleScroll() {
    const header = document.getElementById("sticky-header");
    if (window.scrollY > 100) {
      header.classList.remove("opacity-0", "-translate-y-2", "pointer-events-none");
      header.classList.add("opacity-100", "translate-y-0");
    } else {
      header.classList.add("opacity-0", "-translate-y-2", "pointer-events-none");
      header.classList.remove("opacity-100", "translate-y-0");
    }
  }

  // ==================================================
  // INIT
  // ==================================================
  function initApp() {
    PORTFOLIO_DATA.projects.forEach((p) => {
      APP_STATE.projectSubTabs[p.id] = "overview";
    });
    PORTFOLIO_DATA.events.forEach((e) => {
      APP_STATE.eventSubTabs[e.id] = "overview";
    });

    renderHero();
    renderProjectTabs();
    renderProjectsCarousel();
    renderSkillCategoryTabs();
    renderSkillsList();
    renderEventTabs();
    renderEventsCarousel();
    renderValueProps();
    updateDocCardStyles();

    document.body.addEventListener("click", handleClick);
    window.addEventListener("scroll", handleScroll, { passive: true });
  }

  document.addEventListener("DOMContentLoaded", initApp);
})();
</script>
</body>
</html>
