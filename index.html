function renderProjectSubTabContent(project, tab) {
  if (tab === 'overview') {
    return `
      <div class="w-full flex flex-col gap-2">
        <div>
          <span class="font-mono font-bold text-[12px] text-[#0d9488] uppercase tracking-wide">Objective</span>
          <p class="text-[14px] text-[#0f172a] leading-relaxed mt-0.5">${project.details.overview.objective}</p>
        </div>
        <div>
          <span class="font-mono font-bold text-[12px] text-[#0284c7] uppercase tracking-wide">Results</span>
          <p class="text-[14px] text-[#0f172a] leading-relaxed mt-0.5">${project.details.overview.results}</p>
        </div>
      </div>`;
  } else if (tab === 'equipment') {
    return project.details.equipment.map(item =>
      `<span class="font-mono text-[12px] bg-slate-100 text-[#0f172a] px-2 py-1 rounded border border-[#e2e8f0]">${item}</span>`
    ).join('');
  } else if (tab === 'urls') {
    return `<div class="w-full flex flex-col gap-2">` + project.details.urls.map(u =>
      `<a href="${u.url}" target="_blank" rel="noopener noreferrer" class="text-[14px] font-mono font-bold text-[#0284c7] hover:text-[#0369a1] underline underline-offset-2">${u.label} →</a>`
    ).join('') + `</div>`;
  }
  return '';
}

          <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">${project.title}</h3>
      <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${project.summary}</p>
      <div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
        <button data-action="project-subtab" data-id="${project.id}" data-tab="overview" class="${subTabStyle(currentSubTab === 'overview')}">OVERVIEW</button>
        <button data-action="project-subtab" data-id="${project.id}" data-tab="equipment" class="${subTabStyle(currentSubTab === 'equipment')}">EQUIPMENT</button>
        <button data-action="project-subtab" data-id="${project.id}" data-tab="urls" class="${subTabStyle(currentSubTab === 'urls')}">URL</button>
      </div>
      <div id="content-${project.id}" class="text-[14px] text-[#0f172a] flex flex-wrap gap-1.5 break-words">
        ${renderProjectSubTabContent(project, currentSubTab)}
      </div>
    </div>
  </div>`;
}

function renderProjectTabs() {
  const container = document.getElementById('project-tabs');
  const categories = ['All', ...new Set(PORTFOLIO_DATA.projects.map(p => p.category))];
  container.innerHTML = categories.map(cat =>
    `<button data-action="select-project-tab" data-value="${cat}" class="${subTabStyle(APP_STATE.activeProjectTab === cat)}">${cat.toUpperCase()}</button>`
  ).join('');
}

function renderProjectsCarousel() {
  const container = document.getElementById('projects-carousel-container');
  const filtered = APP_STATE.activeProjectTab === 'All'
    ? PORTFOLIO_DATA.projects
    : PORTFOLIO_DATA.projects.filter(p => p.category === APP_STATE.activeProjectTab);
  container.innerHTML = filtered.map(renderProjectCard).join('');
}

function renderSingleProjectSubtab(projectId) {
  const project = PORTFOLIO_DATA.projects.find(p => p.id === projectId);
  const currentSubTab = APP_STATE.projectSubTabs[projectId];
  const contentEl = document.getElementById(`content-${projectId}`);
  if (!contentEl) return;
  contentEl.innerHTML = renderProjectSubTabContent(project, currentSubTab);
  const tabsContainer = contentEl.previousElementSibling;
  tabsContainer.querySelectorAll('button[data-action="project-subtab"]').forEach(btn => {
    btn.className = subTabStyle(btn.dataset.tab === currentSubTab);
  });
}

function playProjectVideo(projectId) {
  const project = PORTFOLIO_DATA.projects.find(p => p.id === projectId);
  const media = document.getElementById(`media-${projectId}`);
  if (!media || !project) return;
  media.innerHTML = `<iframe src="${project.videoUrl}?autoplay=1" class="w-full h-full border-0" allow="autoplay" title="${project.title}"></iframe>`;
}

/* ==================================================
   EVENTS RENDERING
================================================== */
function renderEventSubTabContent(event, tab) {
  if (tab === 'overview') {
    return `
      <div class="w-full flex flex-col gap-2">
        <div>
          <span class="font-mono font-bold text-[12px] text-[#0d9488] uppercase tracking-wide">Participation</span>
          <p class="text-[14px] text-[#0f172a] leading-relaxed mt-0.5">${event.details.overview.participation}</p>
        </div>
        <div>
          <span class="font-mono font-bold text-[12px] text-[#0284c7] uppercase tracking-wide">Outcomes</span>
          <p class="text-[14px] text-[#0f172a] leading-relaxed mt-0.5">${event.details.overview.outcomes}</p>
        </div>
      </div>`;
  } else if (tab === 'media') {
    return `<div class="w-full grid grid-cols-2 gap-1.5">` + event.details.media.map(src =>
      `<img src="${src}" class="w-full h-20 object-cover rounded border border-[#e2e8f0]" alt="${event.title}" />`
    ).join('') + `</div>`;
  } else if (tab === 'urls') {
    return `<div class="w-full flex flex-col gap-2">` + event.details.urls.map(u =>
      `<a href="${u.url}" target="_blank" rel="noopener noreferrer" class="text-[14px] font-mono font-bold text-[#0284c7] hover:text-[#0369a1] underline underline-offset-2">${u.label} →</a>`
    ).join('') + `</div>`;
  }
  return '';
}

function renderEventCard(event) {
  const currentSubTab = APP_STATE.eventSubTabs[event.id] || 'overview';
  return `
  <div class="w-[calc(100vw-36px)] max-w-[325px] md:w-[325px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs h-auto overflow-visible">
    <div>
      <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden mb-2">
        <img src="${event.imageUrl}" class="w-full h-full object-cover" alt="${event.title}" />
      </div>
      <h3 class="text-[18px] font-bold text-[#0f172a] mb-1 leading-snug">${event.title}</h3>
      <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${event.summary}</p>
      <div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
        <button data-action="event-subtab" data-id="${event.id}" data-tab="overview" class="${subTabStyle(currentSubTab === 'overview')}">OVERVIEW</button>
        <button data-action="event-subtab" data-id="${event.id}" data-tab="media" class="${subTabStyle(currentSubTab === 'media')}">MEDIA</button>
        <button data-action="event-subtab" data-id="${event.id}" data-tab="urls" class="${subTabStyle(currentSubTab === 'urls')}">URL</button>
      </div>
      <div id="event-content-${event.id}" class="text-[14px] text-[#0f172a] flex flex-col gap-1.5 break-words">
        ${renderEventSubTabContent(event, currentSubTab)}
      </div>
    </div>
  </div>`;
}

function renderEventTabs() {
  const container = document.getElementById('event-tabs');
  const categories = ['All', ...new Set(PORTFOLIO_DATA.events.map(e => e.category))];
  container.innerHTML = categories.map(cat =>
    `<button data-action="select-event-tab" data-value="${cat}" class="${subTabStyle(APP_STATE.activeEventTab === cat)}">${cat.toUpperCase()}</button>`
  ).join('');
}

function renderEventsCarousel() {
  const container = document.getElementById('events-carousel-container');
  const filtered = APP_STATE.activeEventTab === 'All'
    ? PORTFOLIO_DATA.events
    : PORTFOLIO_DATA.events.filter(e => e.category === APP_STATE.activeEventTab);
  container.innerHTML = filtered.map(renderEventCard).join('');
}

function renderSingleEventSubtab(eventId) {
  const event = PORTFOLIO_DATA.events.find(e => e.id === eventId);
  const currentSubTab = APP_STATE.eventSubTabs[eventId];
  const contentEl = document.getElementById(`event-content-${eventId}`);
  if (!contentEl) return;
  contentEl.innerHTML = renderEventSubTabContent(event, currentSubTab);
  const tabsContainer = contentEl.previousElementSibling;
  tabsContainer.querySelectorAll('button[data-action="event-subtab"]').forEach(btn => {
    btn.className = subTabStyle(btn.dataset.tab === currentSubTab);
  });
}

/* ==================================================
   SKILLS RENDERING
================================================== */
function renderSkillCategories() {
  const container = document.getElementById('skill-categories');
  const categories = Object.keys(PORTFOLIO_DATA.skills);
  container.innerHTML = categories.map(cat => {
    const isActive = APP_STATE.activeSkillCategory === cat;
    const cls = isActive
      ? 'px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap bg-[#0284c7] text-white border-[#0284c7] font-bold'
      : 'px-2 py-1 rounded-md border text-[12px] font-mono whitespace-nowrap bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7]';
    return `<button data-action="select-skill-category" data-value="${cat}" class="${cls}">${cat}</button>`;
  }).join('');
}

function renderSkillsList() {
  const container = document.getElementById('skills-list');
  const skills = PORTFOLIO_DATA.skills[APP_STATE.activeSkillCategory];
  container.innerHTML = skills.map(skill => `
    <div class="mb-3 last:mb-0">
      <div class="flex justify-between items-center mb-1 gap-2">
        <span class="text-[14px] font-sans text-[#0f172a] font-medium">${skill.name}</span>
        <span class="text-[13px] font-mono text-[#0284c7] font-bold shrink-0">${skill.level}%</span>
      </div>
      <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
        <div class="h-full bg-[#0284c7] rounded-full" style="width: ${skill.level}%"></div>
      </div>
    </div>
  `).join('');
}

/* ==================================================
   VALUE PROPS RENDERING
================================================== */
function renderValueProps() {
  const container = document.getElementById('value-props-carousel');
  container.innerHTML = PORTFOLIO_DATA.valueProps.map(vp => `
    <div class="w-[240px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-3.5 flex flex-col justify-between h-[190px]">
      <span class="text-[14px] font-mono font-bold text-[#0284c7] line-clamp-2 mb-2">${vp.title}</span>
      <span class="text-[15px] font-bold text-[#0f172a] whitespace-nowrap overflow-hidden text-ellipsis">${vp.text}</span>
    </div>
  `).join('');
}

/* ==================================================
   HELP YOURSELF RENDERING
================================================== */
const HELP_DOCS = [
  { key: 'cv', label: 'CV.pdf', sub: 'Full curriculum vitae' },
  { key: 'portfolio', label: 'Portfolio.pdf', sub: 'Project case studies' }
];

function renderDocCards() {
  const container = document.getElementById('doc-cards');
  container.innerHTML = HELP_DOCS.map(doc => {
    const isSelected = APP_STATE.selectedDocs[doc.key];
    const base = 'flex items-center justify-between px-3 py-2 rounded-md cursor-pointer transition-colors';
    const cls = isSelected ? `${base} border-2 border-[#0284c7] bg-[#f0f9ff]` : `${base} border border-[#e2e8f0] bg-white hover:border-[#0284c7]`;
    return `
      <div data-action="select-doc" data-value="${doc.key}" class="${cls}">
        <div class="flex items-center gap-2">
          <svg class="w-4 h-4 text-[#0284c7] shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6M9 8h1M5 4h14a1 1 0 011 1v14a1 1 0 01-1 1H5a1 1 0 01-1-1V5a1 1 0 011-1z"/></svg>
          <div class="flex flex-col">
            <span class="text-[14px] font-mono font-bold text-[#0f172a]">${doc.label}</span>
            <span class="text-[12px] font-sans text-[#475569]">${doc.sub}</span>
          </div>
        </div>
        <div class="w-4 h-4 rounded-full border-2 ${isSelected ? 'bg-[#0284c7] border-[#0284c7]' : 'border-[#cbd5e1]'} flex items-center justify-center shrink-0">
          ${isSelected ? '<svg class="w-2.5 h-2.5 text-white" fill="currentColor" viewBox="0 0 24 24"><path d="M9 16.2l-3.5-3.5-1.4 1.4L9 19 20 8l-1.4-1.4z"/></svg>' : ''}
        </div>
      </div>`;
  }).join('');
}

function showToast(message, isError) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.className = `fixed bottom-20 left-1/2 -translate-x-1/2 z-[60] px-4 py-2 rounded-md text-[13px] font-mono text-white shadow-lg ${isError ? 'bg-red-600' : 'bg-[#0d9488]'}`;
  toast.style.opacity = '1';
  clearTimeout(window.__toastTimeout);
  window.__toastTimeout = setTimeout(() => { toast.style.opacity = '0'; }, 2500);
}

function handleSendDocs() {
  const emailInput = document.getElementById('email-input');
  const email = emailInput.value.trim();
  const anySelected = APP_STATE.selectedDocs.cv || APP_STATE.selectedDocs.portfolio;
  const emailValid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  if (!anySelected) {
    showToast('Select at least one document first.', true);
    return;
  }
  if (!emailValid) {
    showToast('Enter a valid email address.', true);
    return;
  }
  showToast('Documents sent to your email!', false);
}

/* ==================================================
   STICKY HEADER SCROLL BEHAVIOR
================================================== */
function handleScroll() {
  const header = document.getElementById('sticky-header');
  if (window.scrollY > 100) {
    header.classList.remove('opacity-0', '-translate-y-full', 'pointer-events-none');
    header.classList.add('opacity-100');
  } else {
    header.classList.add('opacity-0', '-translate-y-full', 'pointer-events-none');
    header.classList.remove('opacity-100');
  }
}

/* ==================================================
   EVENT DELEGATION
================================================== */
document.body ? bindEvents() : document.addEventListener('DOMContentLoaded', bindEvents);
function bindEvents() {
  document.body.addEventListener('click', function(e) {
    const target = e.target.closest('[data-action]');
    if (!target) return;
    const action = target.dataset.action;

    switch (action) {
      case 'select-project-tab':
        APP_STATE.activeProjectTab = target.dataset.value;
        renderProjectTabs();
        renderProjectsCarousel();
        break;
      case 'project-subtab':
        APP_STATE.projectSubTabs[target.dataset.id] = target.dataset.tab;
        renderSingleProjectSubtab(target.dataset.id);
        break;
      case 'play-video':
        playProjectVideo(target.dataset.id);
        break;
      case 'select-event-tab':
        APP_STATE.activeEventTab = target.dataset.value;
        renderEventTabs();
        renderEventsCarousel();
        break;
      case 'event-subtab':
        APP_STATE.eventSubTabs[target.dataset.id] = target.dataset.tab;
        renderSingleEventSubtab(target.dataset.id);
        break;
      case 'select-skill-category':
        APP_STATE.activeSkillCategory = target.dataset.value;
        renderSkillCategories();
        renderSkillsList();
        break;
      case 'select-doc':
        APP_STATE.selectedDocs[target.dataset.value] = !APP_STATE.selectedDocs[target.dataset.value];
        renderDocCards();
        break;
      case 'send-docs':
        handleSendDocs();
        break;
    }
  });
}

/* ==================================================
   INIT
================================================== */
function initApp() {
  PORTFOLIO_DATA.projects.forEach(p => { APP_STATE.projectSubTabs[p.id] = 'overview'; });
  PORTFOLIO_DATA.events.forEach(e => { APP_STATE.eventSubTabs[e.id] = 'overview'; });

  renderHeader();
  renderHero();
  renderProjectTabs();
  renderProjectsCarousel();
  renderSkillCategories();
  renderSkillsList();
  renderEventTabs();
  renderEventsCarousel();
  renderValueProps();
  renderDocCards();

  window.addEventListener('scroll', handleScroll, { passive: true });
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
