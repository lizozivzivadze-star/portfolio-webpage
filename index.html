<style>
  :root{
    --bg:#f8fafc;
    --panel-border:#1e293b;
    --card-border:#e2e8f0;
    --card-border-alt:#cbd5e1;
    --text-primary:#0f172a;
    --text-muted:#475569;
    --accent-blue:#0284c7;
    --accent-blue-hover:#0369a1;
    --accent-teal:#0d9488;
  }
  html{scroll-behavior:smooth;}
  body{
    background-color:var(--bg);
    color:var(--text-primary);
    font-family:'Inter',ui-sans-serif,system-ui,sans-serif;
    background-image:
      linear-gradient(rgba(15,23,42,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size:22px 22px;
    overflow-x:hidden;
  }
  .font-mono{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,monospace;}

  .panel{
    background:#ffffff;
    border:2px solid var(--panel-border);
    border-radius:0.75rem;
  }

  .tab-btn{
    border:1px solid var(--card-border-alt);
    border-radius:0.5rem;
    transition:all 200ms ease;
    font-family:'JetBrains Mono',monospace;
    white-space:nowrap;
  }
  .tab-btn.active{
    background-color:var(--accent-blue);
    border-color:var(--accent-blue-hover);
    color:#ffffff;
    font-weight:700;
  }
  .tab-btn:not(.active):hover{
    border-color:var(--accent-blue);
    color:var(--accent-blue-hover);
  }

  .tab-btn-sm{
    border:1px solid var(--card-border-alt);
    border-radius:0.375rem;
    transition:all 200ms ease;
    font-family:'JetBrains Mono',monospace;
    white-space:nowrap;
  }
  .tab-btn-sm.active{
    background-color:var(--accent-teal);
    border-color:#0f766e;
    color:#ffffff;
    font-weight:700;
  }
  .tab-btn-sm:not(.active):hover{
    border-color:var(--accent-teal);
  }

  .custom-scrollbar::-webkit-scrollbar{height:6px; width:6px;}
  .custom-scrollbar::-webkit-scrollbar-track{background:transparent;}
  .custom-scrollbar::-webkit-scrollbar-thumb{background:var(--card-border-alt); border-radius:999px;}
  .custom-scrollbar{scrollbar-width:thin; scrollbar-color:var(--card-border-alt) transparent;}

  .snap-card{scroll-snap-align:start;}

  .doc-toggle{
    border:1.5px solid var(--card-border-alt);
    border-radius:0.625rem;
    transition:all 200ms ease;
  }
  .doc-toggle.selected{
    background-color:rgba(2,132,199,0.07);
    border-color:var(--accent-blue);
  }
  .doc-toggle.selected .doc-title{
    font-weight:700;
    color:var(--accent-blue-hover);
  }
  .doc-toggle.selected .doc-check{
    opacity:1;
    transform:scale(1);
  }
  .doc-check{
    opacity:0;
    transform:scale(0.5);
    transition:all 200ms ease;
  }

  .badge{
    border:1px solid var(--card-border-alt);
    border-radius:999px;
    transition:all 150ms ease;
  }
  .badge:hover{border-color:var(--accent-blue); color:var(--accent-blue-hover);}

  .modal-overlay{
    background:rgba(15,23,42,0.55);
    backdrop-filter:blur(2px);
  }

  .thumb-play-btn{
    transition:transform 150ms ease, background-color 150ms ease;
  }
  .thumb-wrap:hover .thumb-play-btn{
    transform:scale(1.08);
    background-color:var(--accent-blue);
  }

  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{position:absolute; top:0; left:0; width:100%;}
  }

  ::-webkit-scrollbar{width:8px; height:8px;}

  .fade-in{animation:fadeIn 220ms ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}
</style>

function el(tag, className, html){
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (html !== undefined) e.innerHTML = html;
  return e;
}
function refreshIcons(){ if (window.lucide) lucide.createIcons(); }
function emphasizeCategoryLabel(label){
  // Bold the H+W in HardWare, S+W in SoftWare, and the whole HW+SW label
  if (label === "HardWare") return '<span class="font-extrabold">H</span>ard<span class="font-extrabold">W</span>are';
  if (label === "SoftWare") return '<span class="font-extrabold">S</span>oft<span class="font-extrabold">W</span>are';
  if (label === "HW + SW") return '<span class="font-extrabold">HW + SW</span>';
  return label;
}

      const a = el('a', 'badge px-2.5 py-1 text-[11px] font-mono flex items-center gap-1 text-[#0f172a]', inner);

      a.target = b.href.startsWith('http') ? '_blank' : '_self';
      a.rel = 'noopener noreferrer';
      wrap.appendChild(a);
    } else {
      wrap.appendChild(el('span', 'badge px-2.5 py-1 text-[11px] font-mono flex items-center gap-1 text-[#0f172a] bg-[#f8fafc]', inner));
    }
  });
  document.getElementById('footerYear').textContent = p.yearText;
  refreshIcons();

const FILTERS = ["All", "HardWare", "SoftWare", "HW + SW"];

function renderProjectFilters(){
  const wrap = document.getElementById('projectFilters');
  wrap.innerHTML = '';
  FILTERS.forEach(f => {
    const btn = el('button', 'tab-btn px-3.5 py-1.5 text-[12px] sm:text-sm' + (state.projectFilter === f ? ' active' : ''),
      emphasizeCategoryLabel(f === 'All' ? 'All' : f));
    btn.dataset.filter = f;
    btn.addEventListener('click', () => {
      state.projectFilter = f;
      renderProjectFilters();
      renderProjects();
    });
    wrap.appendChild(btn);
  });
}

  const tabs = ['overview','media','equipment'];
  const tabLabels = { overview: 'Overview', media: 'Media', equipment: 'Equipment' };

  const card = el('div', 'snap-card flex-shrink-0 w-[300px] sm:w-[340px] bg-[#f8fafc] border border-[#1e293b] rounded-lg overflow-hidden flex flex-col');

  // thumbnail
  const thumbWrap = el('div', 'thumb-wrap relative w-full aspect-video bg-[#0f172a] cursor-pointer group overflow-hidden');
  const thumbImg = el('div', 'absolute inset-0 bg-gradient-to-br from-[#1e293b] to-[#0284c7]/40');
  thumbWrap.appendChild(thumbImg);
  const playBtn = el('div', 'thumb-play-btn absolute inset-0 m-auto w-11 h-11 rounded-full bg-white/90 flex items-center justify-center', '<i data-lucide="play" class="w-5 h-5 text-[#0284c7] ml-0.5"></i>');
  playBtn.style.position='absolute'; playBtn.style.top='50%'; playBtn.style.left='50%'; playBtn.style.transform='translate(-50%,-50%)';
  thumbWrap.appendChild(playBtn);
  thumbWrap.addEventListener('click', () => openVideoModal(p));
  card.appendChild(thumbWrap);

  // body
  const body = el('div', 'p-3.5 flex flex-col flex-1');
  const catPill = el('span', 'inline-block font-mono text-[10px] font-bold uppercase tracking-wide px-2 py-0.5 rounded-md bg-[#0d9488] text-white w-fit', p.category);
  body.appendChild(catPill);
  const title = el('h3', 'font-bold text-[15px] sm:text-base mt-2 leading-snug text-[#0f172a]', p.title);
  body.appendChild(title);
  const score = el('p', 'font-mono text-[11px] text-[#475569] mt-1', 'Impact Score: <span class="text-[#0284c7] font-bold">' + p.impactScore + '</span>');
  body.appendChild(score);

  // internal tabs
  const tabRow = el('div', 'flex gap-1.5 overflow-x-auto custom-scrollbar mt-3 pb-1');
  tabs.forEach(t => {
    const b = el('button', 'tab-btn-sm px-2.5 py-1 text-[11px]' + (activeTab === t ? ' active' : ''), tabLabels[t]);
    b.dataset.projectId = p.id;
    b.dataset.tab = t;
    b.addEventListener('click', () => {
      state.cardTabs[p.id] = t;
      renderProjects();
    });
    tabRow.appendChild(b);
  });
  body.appendChild(tabRow);

  // tab content
  const content = el('div', 'mt-3 text-[12.5px] leading-relaxed flex-1');
  if (activeTab === 'overview'){
    content.innerHTML =
      '<p class="text-[#475569]">' + p.summary + '</p>' +
      '<ul class="mt-2 space-y-1.5 list-disc list-inside text-[#0f172a]">' +
        p.resumeBullets.map(b => '<li>' + b + '</li>').join('') +
      '</ul>' +
      '<a href="' + p.links.github + '" target="_blank" rel="noopener noreferrer" class="mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-md border border-[#cbd5e1] hover:border-[#0284c7] hover:text-[#0369a1] transition-colors text-[11px] font-mono">' +
        '<i data-lucide="github" class="w-3.5 h-3.5"></i> View Repository</a>';
  } else if (activeTab === 'media'){
    content.innerHTML =
      '<div class="rounded-md overflow-hidden border border-[#cbd5e1] aspect-video bg-[#0f172a] flex items-center justify-center cursor-pointer" id="mediaOpen-'+p.id+'">' +
        '<i data-lucide="play-circle" class="w-8 h-8 text-white/80"></i>' +
      '</div>' +
      '<p class="text-[#475569] mt-2">' + p.details + '</p>' +
      '<div class="flex flex-wrap gap-1.5 mt-2.5">' +
        Object.entries(p.links).map(([k,v]) => '<a href="'+v+'" target="_blank" rel="noopener noreferrer" class="px-2 py-1 rounded-md border border-[#cbd5e1] text-[10px] font-mono uppercase hover:border-[#0d9488]">'+k+'</a>').join('') +
      '</div>';
  } else {
    content.innerHTML =
      '<div class="grid grid-cols-2 gap-1.5 max-h-40 overflow-y-auto custom-scrollbar pr-1">' +
        p.equipment.map(eq => '<span class="px-2 py-1.5 rounded-md border border-[#cbd5e1] bg-white text-[11px] font-mono text-center truncate" title="'+eq+'">'+eq+'</span>').join('') +
      '</div>';
  }
  body.appendChild(content);
  card.appendChild(body);

  // wire the media-open click after insertion
  setTimeout(() => {
    const mediaBtn = document.getElementById('mediaOpen-' + p.id);
    if (mediaBtn) mediaBtn.addEventListener('click', () => openVideoModal(p));
  }, 0);

  return card;
}

function renderProjects(){
  const row = document.getElementById('projectsRow');
  row.innerHTML = '';
  const list = PORTFOLIO_DATA.projects
    .filter(p => state.projectFilter === 'All' || p.category === state.projectFilter)
    .sort((a,b) => b.impactScore - a.impactScore);
  if (list.length === 0){
    row.appendChild(el('p', 'text-sm text-[#475569] font-mono py-6 px-2', 'No projects match this filter.'));
  } else {
    list.forEach(p => row.appendChild(projectCardTemplate(p)));
  }
  refreshIcons();
}

/* ==================================================
   SKILLS
================================================== */
function renderSkillTabs(){
  const wrap = document.getElementById('skillCategoryTabs');
  wrap.innerHTML = '';
  Object.keys(PORTFOLIO_DATA.skills).forEach(cat => {
    const btn = el('button', 'tab-btn px-3 py-1.5 text-[11px] sm:text-[13px]' + (state.skillCategory === cat ? ' active' : ''), cat);
    btn.addEventListener('click', () => {
      state.skillCategory = cat;
      renderSkillTabs();
      renderSkillChips();
    });
    wrap.appendChild(btn);
  });
}
function renderSkillChips(){
  const wrap = document.getElementById('skillChipsContainer');
  wrap.innerHTML = '';
  PORTFOLIO_DATA.skills[state.skillCategory].forEach(skill => {
    wrap.appendChild(el('span', 'flex-shrink-0 px-3 py-1.5 rounded-md border border-[#cbd5e1] bg-white text-[11.5px] font-mono text-[#0f172a] whitespace-nowrap', skill));
  });
}

/* ==================================================
   VALUE PROPS
================================================== */
function renderValueProps(){
  const row = document.getElementById('valuePropsRow');
  row.innerHTML = '';
  PORTFOLIO_DATA.valueProps.forEach((v, i) => {
    const card = el('div', 'snap-card flex-shrink-0 min-w-[280px] max-w-[280px] bg-[#f8fafc] border border-[#cbd5e1] rounded-lg p-4');
    card.innerHTML =
      '<h3 class="font-bold text-[15px] sm:text-base text-[#0f172a] leading-snug">Reason #' + (i+1) + ': ' + v.title + '</h3>' +
      '<p class="font-mono text-[12px] text-[#475569] mt-2 leading-relaxed">' + v.text + '</p>';
    row.appendChild(card);
  });
}

/* ==================================================
   DOCUMENT GENERATION
================================================== */
function renderDocToggles(){
  const wrap = document.getElementById('docToggles');
  wrap.innerHTML = '';
  DOC_OPTIONS.forEach(doc => {
    const isSel = state.selectedDocs.has(doc.id);
    const card = el('button', 'doc-toggle text-left p-4' + (isSel ? ' selected' : ''));
    card.innerHTML =
      '<div class="flex items-start justify-between gap-2">' +
        '<span class="doc-title font-semibold text-[13.5px] sm:text-sm text-[#0f172a]">' + doc.title + '</span>' +
        '<span class="doc-check w-5 h-5 rounded-full bg-[#0284c7] flex items-center justify-center flex-shrink-0"><i data-lucide="check" class="w-3 h-3 text-white"></i></span>' +
      '</div>' +
      '<p class="text-[11.5px] text-[#475569] mt-1.5 font-mono leading-relaxed">' + doc.desc + '</p>';
    card.addEventListener('click', () => {
      if (state.selectedDocs.has(doc.id)) state.selectedDocs.delete(doc.id);
      else state.selectedDocs.add(doc.id);
      renderDocToggles();
    });
    wrap.appendChild(card);
  });
  refreshIcons();
}

document.addEventListener('DOMContentLoaded', () => {
  const form = document.getElementById('emailForm');
  const feedback = document.getElementById('emailFeedback');
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const emailVal = document.getElementById('emailInput').value.trim();
    if (!emailVal){
      feedback.textContent = 'Enter an email address to continue.';
      feedback.style.color = '#dc2626';
      return;
    }
    if (state.selectedDocs.size === 0){
      feedback.textContent = 'Select at least one document to send.';
      feedback.style.color = '#dc2626';
      return;
    }
    feedback.style.color = '#0d9488';
    feedback.textContent = 'Dispatching...';
    setTimeout(() => {
      feedback.textContent = 'Dispatched portfolio package to ' + emailVal + '!';
    }, 650);
  });
});

/* ==================================================
   STICKY HEADER SCROLL BEHAVIOR
================================================== */
window.addEventListener('scroll', () => {
  const header = document.getElementById('stickyHeader');
  if (window.scrollY > 100){
    header.classList.remove('-translate-y-full', 'opacity-0');
  } else {
    header.classList.add('-translate-y-full', 'opacity-0');
    document.getElementById('menuDropdown').classList.add('hidden');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  const menuBtn = document.getElementById('menuBtn');
  const menuDropdown = document.getElementById('menuDropdown');
  menuBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    menuDropdown.classList.toggle('hidden');
  });
  document.addEventListener('click', (e) => {
    if (!menuDropdown.contains(e.target) && e.target !== menuBtn){
      menuDropdown.classList.add('hidden');
    }
  });
  menuDropdown.querySelectorAll('.menu-item').forEach(btn => {
    btn.addEventListener('click', () => {
      menuDropdown.classList.add('hidden');
      const action = btn.dataset.action;
      if (action === 'cv') openCvModal();
      if (action === 'portfolio') openPortfolioModal();
      if (action === 'email') openEmailRequestModal();
    });
  });
});

/* ==================================================
   MODALS
================================================== */
const overlay = document.getElementById('modalOverlay');
const modalContent = document.getElementById('modalContent');

function showModal(html){
  modalContent.innerHTML = html;
  overlay.classList.remove('hidden');
  overlay.classList.add('flex');
  refreshIcons();
}
function closeModal(){
  overlay.classList.add('hidden');
  overlay.classList.remove('flex');
  modalContent.innerHTML = '';
}
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

function openVideoModal(p){
  showModal(
    '<h3 class="font-bold text-base sm:text-lg pr-8 text-[#0f172a]">' + p.title + '</h3>' +
    '<div class="mt-3 aspect-video rounded-lg overflow-hidden border border-[#cbd5e1]">' +
      '<iframe class="w-full h-full" src="' + p.videoUrl + '" title="' + p.title + '" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>' +
    '</div>' +
    '<p class="text-[13px] text-[#475569] mt-3 leading-relaxed">' + p.details + '</p>'
  );
}

function openCvModal(){
  const p = PORTFOLIO_DATA.personal;
  const bullets = PORTFOLIO_DATA.projects
    .sort((a,b) => b.impactScore - a.impactScore)
    .slice(0,3)
    .map(pr => '<div class="mb-2.5"><p class="font-semibold text-[13px] text-[#0f172a]">' + pr.title + '</p><ul class="list-disc list-inside text-[12px] text-[#475569] mt-0.5">' + pr.resumeBullets.map(b=>'<li>'+b+'</li>').join('') + '</ul></div>')
    .join('');
  showModal(
    '<div id="printArea">' +
    '<div class="flex items-center gap-2 mb-1"><i data-lucide="file-text" class="w-4 h-4 text-[#0284c7]"></i><h3 class="font-bold text-base sm:text-lg text-[#0f172a]">CV Summary Preview</h3></div>' +
    '<p class="font-mono text-[11px] text-[#475569] mb-3">' + p.name + ' — ' + p.title + '</p>' +
    '<div class="border-t border-[#e2e8f0] pt-3">' + bullets + '</div>' +
    '<div class="border-t border-[#e2e8f0] pt-3 mt-2 font-mono text-[11px] text-[#475569]">' + p.email + ' · ' + p.phone + ' · ' + p.location + '</div>' +
    '</div>' +
    '<button onclick="window.print()" class="mt-4 w-full px-4 py-2.5 rounded-md bg-[#0284c7] hover:bg-[#0369a1] text-white text-sm font-semibold flex items-center justify-center gap-2 transition-colors"><i data-lucide="download" class="w-4 h-4"></i> Print / Save as PDF</button>'
  );
}

function openPortfolioModal(){
  const p = PORTFOLIO_DATA.personal;
  const projectsHtml = PORTFOLIO_DATA.projects
    .sort((a,b) => b.impactScore - a.impactScore)
    .map(pr => '<div class="mb-3 pb-3 border-b border-[#e2e8f0] last:border-0"><p class="font-semibold text-[13px] text-[#0f172a]">' + pr.title + ' <span class="font-mono text-[10px] text-[#0d9488]">' + pr.category + '</span></p><p class="text-[12px] text-[#475569] mt-1">' + pr.summary + '</p></div>')
    .join('');
  showModal(
    '<div id="printArea">' +
    '<div class="flex items-center gap-2 mb-1"><i data-lucide="download" class="w-4 h-4 text-[#0284c7]"></i><h3 class="font-bold text-base sm:text-lg text-[#0f172a]">Full Portfolio Preview</h3></div>' +
    '<p class="font-mono text-[11px] text-[#475569] mb-3">' + p.name + ' — ' + p.title + '</p>' +
    projectsHtml +
    '</div>' +
    '<button onclick="window.print()" class="mt-2 w-full px-4 py-2.5 rounded-md bg-[#0284c7] hover:bg-[#0369a1] text-white text-sm font-semibold flex items-center justify-center gap-2 transition-colors"><i data-lucide="download" class="w-4 h-4"></i> Print / Save as PDF</button>'
  );
}

function openEmailRequestModal(){
  const p = PORTFOLIO_DATA.personal;
  showModal(
    '<div class="flex items-center gap-2 mb-1"><i data-lucide="mail" class="w-4 h-4 text-[#0284c7]"></i><h3 class="font-bold text-base sm:text-lg text-[#0f172a]">Email Yourself a Copy</h3></div>' +
    '<p class="text-[12.5px] text-[#475569] mb-3">Send the Portfolio and CV PDFs to your own inbox.</p>' +
    '<form id="selfEmailForm" class="flex flex-col gap-2.5">' +
      '<input required type="email" id="selfEmailInput" value="' + p.email + '" class="px-3.5 py-2.5 rounded-md border border-[#cbd5e1] text-sm font-mono focus:outline-none focus:ring-2 focus:ring-[#0284c7]">' +
      '<button type="submit" class="px-4 py-2.5 rounded-md bg-[#0284c7] hover:bg-[#0369a1] text-white text-sm font-semibold flex items-center justify-center gap-2 transition-colors"><i data-lucide="send" class="w-4 h-4"></i> Send to Myself</button>' +
      '<p id="selfEmailFeedback" class="text-[12px] font-mono text-[#0d9488] min-h-[1rem]"></p>' +
    '</form>'
  );
  setTimeout(() => {
    const f = document.getElementById('selfEmailForm');
    if (!f) return;
    f.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = document.getElementById('selfEmailInput').value.trim();
      const fb = document.getElementById('selfEmailFeedback');
      fb.textContent = 'Dispatching...';
      setTimeout(() => { fb.textContent = 'Dispatched portfolio package to ' + val + '!'; }, 650);
    });
  }, 0);
}

/* ==================================================
   INIT
================================================== */
renderHero();
renderProjectFilters();
renderProjects();
renderSkillTabs();
renderSkillChips();
renderValueProps();
renderDocToggles();
refreshIcons();
</script>
</body>
