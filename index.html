<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Lizi Zivzivadze — Electromechanical Engineer</title>
<meta name="description" content="Portfolio of Lizi Zivzivadze, Electromechanical Engineer — mechatronics, embedded control, and precision hardware projects." />
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --ink:#0f172a;
    --border-soft:#cbd5e1;
    --border-strong:#1e293b;
    --sky:#0284c7;
    --teal:#0d9488;
    --bg:#f8fafc;
  }
  html,body{
    background-color: var(--bg);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    overflow-x: hidden;
  }
  .blueprint-grid{
    background-image:
      linear-gradient(rgba(15,23,42,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(15,23,42,0.035) 1px, transparent 1px);
    background-size: 28px 28px;
    background-position: -1px -1px;
  }
  .panel{
    background:#ffffff;
    border:1px solid var(--border-soft);
    box-shadow: 0 1px 2px rgba(15,23,42,0.04);
  }
  .panel-strong-edge{ border-color: var(--border-strong); }
  .no-scrollbar::-webkit-scrollbar{ display:none; }
  .no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none; }
  .thin-scroll::-webkit-scrollbar{ width:6px; height:6px; }
  .thin-scroll::-webkit-scrollbar-thumb{ background:#cbd5e1; border-radius:4px; }
  .thin-scroll::-webkit-scrollbar-track{ background:transparent; }
  .skill-pill{
    flex:0 0 auto;
    border:1px solid var(--border-soft);
    background:#f8fafc;
  }
  .tab-btn{
    position:relative;
    color:#64748b;
  }
  .tab-btn.active-cat{
    color:var(--ink);
    font-weight:700;
  }
  .tab-btn.active-cat::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-9px;
    height:2px;
    background:var(--sky);
  }
  .card-tab{
    color:#64748b;
    border-bottom:2px solid transparent;
  }
  .card-tab.active-card-tab{
    color:var(--ink);
    font-weight:600;
    border-bottom-color: var(--teal);
  }
  .doc-card{
    border:1px solid var(--border-soft);
    background:#ffffff;
    transition: border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
  }
  .doc-card.doc-selected{
    border:2px solid var(--sky);
    background:#f0f9ff;
    font-weight:700;
    box-shadow: 0 1px 3px rgba(2,132,199,0.15);
  }
  .status-dot{
    width:8px; height:8px; border-radius:9999px;
    background:#16a34a;
    box-shadow: 0 0 0 3px rgba(22,163,74,0.15);
  }
  input:focus, button:focus, select:focus{
    outline: 2px solid var(--sky);
    outline-offset: 1px;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition: none !important; animation: none !important; }
  }
</style>
</head>
<body class="blueprint-grid min-h-screen">

<!-- ================= HEADER ================= -->
<header class="sticky top-0 z-50 h-[52px] bg-white/95 backdrop-blur border-b border-slate-200">
  <div class="max-w-5xl mx-auto h-full px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <img id="headerAvatar" src="" alt="Lizi Zivzivadze" class="w-7 h-7 rounded-full object-cover border border-slate-300" />
      <span class="text-sm font-semibold tracking-tight" style="color:var(--ink)">Lizi Zivzivadze</span>
    </div>
    <div class="relative">
      <button id="langBtn" class="flex items-center gap-1 text-xs font-semibold px-2.5 py-1.5 rounded-md border border-slate-300 bg-white text-slate-700 hover:border-slate-400">
        <span id="langLabel">EN</span>
        <svg width="10" height="10" viewBox="0 0 10 10" class="mt-px"><path d="M1 3l4 4 4-4" stroke="#475569" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="langMenu" class="hidden absolute right-0 mt-1.5 w-28 bg-white border border-slate-200 rounded-md shadow-md overflow-hidden">
        <button data-lang="EN" class="lang-opt w-full text-left px-3 py-2 text-xs hover:bg-slate-50">English (EN)</button>
        <button data-lang="FR" class="lang-opt w-full text-left px-3 py-2 text-xs hover:bg-slate-50">Français (FR)</button>
        <button data-lang="NL" class="lang-opt w-full text-left px-3 py-2 text-xs hover:bg-slate-50">Nederlands (NL)</button>
      </div>
    </div>
  </div>
</header>

<!-- ================= MAIN ================= -->
<main class="max-w-5xl mx-auto px-4 py-6 flex flex-col gap-6">

  <!-- ========== 1. PROFILE PANEL ========== -->

      <div class="min-w-0">
        <h1 class="text-lg font-bold leading-tight truncate" style="color:var(--ink)">Lizi Zivzivadze</h1>
        <p class="text-sm font-medium" style="color:var(--sky)">Electromechanical Engineer</p>
        <p id="yearTag" class="text-xs text-slate-500 mt-1"></p>
        <p id="availTag" class="text-[11px] text-slate-400 -mt-0.5"></p>
      </div>
    </div>

    <p id="statementText" class="text-sm leading-relaxed text-slate-700 mt-4" style="display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;"></p>

    <div class="mt-4 pt-4 border-t border-slate-200 flex flex-wrap items-center gap-2">

        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        Call
      </a>

        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.868-2.03-.967-.273-.099-.472-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/><path d="M12.05 22h-.005a9.87 9.87 0 0 1-5.031-1.378L2 22l1.398-4.895A9.9 9.9 0 0 1 2.049 12C2.047 6.477 6.526 2 12.05 2a9.93 9.93 0 0 1 7.049 2.929A9.9 9.9 0 0 1 22 12.021c-.002 5.523-4.48 9.979-9.95 9.979zm0-18.155a8.16 8.16 0 0 0-8.176 8.175 8.1 8.1 0 0 0 1.271 4.362l.198.315-.831 3.033 3.11-.815.303.18a8.11 8.11 0 0 0 4.121 1.127h.004a8.17 8.17 0 0 0 8.176-8.178 8.09 8.09 0 0 0-2.395-5.782 8.09 8.09 0 0 0-5.781-2.417z"/></svg>
        WhatsApp
      </a>
      <a id="emailLink" href="#" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-md border border-slate-300 hover:border-sky-500 hover:text-sky-600 transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z" opacity="0"/><path d="M22 6l-10 7L2 6"/><rect x="2" y="4" width="20" height="16" rx="2"/></svg>
        Email
      </a>
      <a id="linkedinLink" href="#" target="_blank" rel="noopener" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-md border border-slate-300 hover:border-sky-500 hover:text-sky-600 transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 1 1 0-4.124 2.062 2.062 0 0 1 0 4.124zM7.119 20.452H3.554V9h3.565v11.452z"/></svg>
        LinkedIn
      </a>
      <a id="githubLink" href="#" target="_blank" rel="noopener" class="flex items-center gap-1.5 text-xs font-semibold px-3 py-2 rounded-md border border-slate-300 hover:border-slate-500 transition-colors">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.66.5 12.03c0 5.1 3.29 9.42 7.86 10.95.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.1-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.08.78 2.17 0 1.57-.01 2.83-.01 3.22 0 .3.2.66.79.55A10.53 10.53 0 0 0 23.5 12.03C23.5 5.66 18.35.5 12 .5z"/></svg>
        GitHub
      </a>
    </div>
  </section>

  <!-- ========== 2. PROJECTS PANEL ========== -->
  <section class="panel rounded-xl p-5 md:p-6 min-h-[46vh] md:min-h-[520px] flex flex-col">
    <div class="flex items-center justify-between mb-3">
      <h2 class="text-base font-bold" style="color:var(--ink)">Projects</h2>
    </div>

    <div id="catTabs" class="flex items-center gap-5 border-b border-slate-200 pb-2.5 mb-4 overflow-x-auto no-scrollbar">
      <button data-cat="All" class="tab-btn active-cat text-sm whitespace-nowrap pb-0.5">All</button>
      <button data-cat="HardWare" class="tab-btn text-sm whitespace-nowrap pb-0.5"><b>H</b>ard<b>W</b>are</button>
      <button data-cat="SoftWare" class="tab-btn text-sm whitespace-nowrap pb-0.5"><b>S</b>oft<b>W</b>are</button>
      <button data-cat="HW + SW" class="tab-btn text-sm whitespace-nowrap pb-0.5">HW + SW</button>
    </div>

    <div id="projectList" class="flex flex-col gap-4 overflow-y-auto thin-scroll max-h-[420px] pr-1"></div>
  </section>

  <!-- ========== 3. SKILLSET PANEL ========== -->
  <section class="panel rounded-xl p-5 md:p-6 min-h-[30vh] md:min-h-[300px] flex flex-col">
    <div class="inline-block self-start px-3 py-1 rounded-md mb-4" style="background:#f0f9ff; border:1px solid var(--border-soft);">
      <h2 class="text-base font-bold" style="color:var(--ink)">Skillset</h2>
    </div>
    <div id="skillCategories" class="flex flex-col gap-4 overflow-y-auto thin-scroll"></div>
  </section>

  <!-- ========== 4. DOCUMENT GENERATION PANEL ========== -->
  <section class="panel rounded-xl p-5 md:p-6 min-h-[42vh] md:min-h-[340px] flex flex-col">
    <h2 class="text-base font-bold mb-1" style="color:var(--ink)">Get My Documents</h2>
    <p class="text-xs text-slate-500 mb-4">Select one or more, then send them to your inbox.</p>

    <div id="docCards" class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5"></div>

    <form id="docForm" class="mt-auto">
      <label for="docEmail" class="block text-xs font-semibold text-slate-600 mb-1.5">Email address</label>
      <div class="flex flex-col sm:flex-row gap-2">
        <input id="docEmail" type="email" required placeholder="you@company.com"
          class="flex-1 text-sm px-3 py-2.5 rounded-md border border-slate-300 bg-white focus:border-sky-500" />
        <button type="submit"
          class="text-sm font-semibold px-5 py-2.5 rounded-md text-white flex-shrink-0"
          style="background:var(--sky);">Send</button>
      </div>
      <p id="docStatus" class="text-xs mt-2 min-h-[16px]"></p>
    </form>
  </section>

</main>

<!-- ================= FOOTER ================= -->
<footer class="border-t border-slate-200 bg-white/60">
  <div class="max-w-5xl mx-auto px-4 py-5 flex flex-col sm:flex-row items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <a id="footerCall" href="#" class="text-xs font-semibold text-slate-600 hover:text-sky-600">Call</a>
      <span class="text-slate-300">|</span>
      <a id="footerWhatsapp" href="#" target="_blank" rel="noopener" class="text-xs font-semibold text-slate-600 hover:text-teal-600">WhatsApp</a>
      <span class="text-slate-300">|</span>
      <a id="footerEmail" href="#" class="text-xs font-semibold text-slate-600 hover:text-sky-600">Email</a>
    </div>
    <div class="flex items-center gap-4">
      <p id="copyText" class="text-xs text-slate-400"></p>
      <div class="flex items-center gap-1.5">
        <span class="status-dot"></span>
        <span class="text-xs text-slate-500">All systems operational</span>
      </div>
    </div>
  </div>
</footer>

<script>
(function(){
  "use strict";

  // ================= SINGLE SOURCE OF TRUTH =================
  const PORTFOLIO_DATA = {
    personal: {

      availabilityTag: "Available for opportunities",

      title: "Electromechanical Engineer",

      avatarUrl: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400",
      email: "lizozivzivadze@gmail.com",
      phone: "+32 499 22 16 80",

    },
    projects: [
      {

        ],

        equipment: ["STM32", "SolidWorks", "Oscilloscope", "LTspice", "Altium", "Multimeter", "C++", "FreeRTOS", "3D Printer"]
      },
      {
        id: "proj-2",
        title: "4-Channel Brushless Motor Driver",
        category: "HardWare",
        overviewText: "Industrial 48V/20A motor driver board featuring integrated CAN-FD telemetry and dynamic thermal monitoring.",
        resumeBullets: [
          "Architected 4-layer power PCB in Altium Designer with copper pours optimized for low thermal resistance.",
          "Validated power conversion efficiency > 96% and verified stability under 85°C ambient thermal stress."
        ],
        githubUrl: "https://github.com/lizozivzivadze-star",
        mediaUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",
        equipment: ["Altium", "CAN Bus", "Oscilloscope", "Power Supply", "Thermal Camera", "LTspice", "Soldering Station"]
      },
      {
        id: "proj-3",
        title: "ROS2 Autonomous Telemetry Rig",
        category: "SoftWare",
        overviewText: "Autonomous inspection platform displaying dynamic sensor fusion and LiDAR point clouds at sub-20ms latency.",
        resumeBullets: [
          "Implemented real-time sensor fusion telemetry streaming with C++/Python backend over WebSockets.",
          "Programmed dynamic obstacle avoidance routines and automated fail-safe recovery sequences."
        ],
        githubUrl: "https://github.com/lizozivzivadze-star",
        mediaUrl: "https://www.youtube.com/embed/dQw4w9WgXcQ",

    ],
    skillCategories: [
      {
        name: "Core Tech Stack",
        items: [
          "Python", "C", "C++", "Java", "JavaScript", "TypeScript", "HTML", "CSS", "React", "Next.js",
          "Node.js", "Express", "PostgreSQL", "MySQL", "MongoDB", "Docker", "Git", "GitHub", "Linux",
          "ROS", "OpenCV", "TensorFlow", "PyTorch", "MATLAB", "Simulink", "SolidWorks", "Fusion 360",

    valueProps: [

    documents: [

      { id: "cv-summary", name: "CV Summary PDF", desc: "One-page resume-style summary for recruiters." }
    ]
  };

  const $ = (sel, root) => (root || document).querySelector(sel);
  const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

  // ================= HEADER / PROFILE BASICS =================
  function renderPersonal(){
    const p = PORTFOLIO_DATA.personal;
    $("#headerAvatar").src = p.avatarUrl;
    $("#profileAvatar").src = p.avatarUrl;
    $("#yearTag").textContent = "© " + p.yearText;
    $("#availTag").textContent = p.availabilityTag;
    $("#statementText").textContent = p.statement;

    const callHref = "tel:" + p.phone.replace(/\s+/g, "");
    const waHref = "https://wa.me/" + p.whatsapp;
    const mailHref = "mailto:" + p.email;

    $("#callLink").href = callHref;
    $("#whatsappLink").href = waHref;
    $("#emailLink").href = mailHref;
    $("#linkedinLink").href = p.linkedin;
    $("#githubLink").href = p.github;

    $("#footerCall").href = callHref;
    $("#footerWhatsapp").href = waHref;
    $("#footerEmail").href = mailHref;

    $("#copyText").textContent = "© " + p.yearText;
  }

  // ================= LANGUAGE SELECTOR =================
  function initLangSelector(){
    const btn = $("#langBtn");
    const menu = $("#langMenu");
    const label = $("#langLabel");
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      menu.classList.toggle("hidden");
    });
    $$(".lang-opt").forEach(opt => {
      opt.addEventListener("click", () => {
        label.textContent = opt.dataset.lang;
        menu.classList.add("hidden");
      });
    });
    document.addEventListener("click", () => menu.classList.add("hidden"));
  }

  // ================= PROJECTS =================
  let activeCategory = "All";

  function projectCardHTML(project, idx){
    const bulletsHTML = project.resumeBullets.map(b =>
      `<li class="flex gap-2"><span style="color:var(--teal)">•</span><span>${escapeHTML(b)}</span></li>`
    ).join("");

    const equipHTML = project.equipment.map(eq =>
      `<span class="skill-pill text-xs px-2.5 py-1 rounded-md text-slate-700">${escapeHTML(eq)}</span>`
    ).join("");

    return `
    <article class="border border-slate-200 rounded-lg flex flex-col h-[380px] overflow-hidden" data-project-id="${project.id}">
      <div class="px-4 pt-4 pb-2 flex items-start justify-between gap-2 flex-shrink-0">
        <h3 class="text-sm font-bold leading-snug" style="color:var(--ink)">${escapeHTML(project.title)}</h3>
        <span class="text-[10px] font-semibold px-2 py-1 rounded-md flex-shrink-0" style="background:#f0fdfa; color:var(--teal); border:1px solid #99f6e4;">${escapeHTML(project.category)}</span>
      </div>

      <div class="flex items-center gap-4 px-4 border-b border-slate-200 flex-shrink-0">
        <button class="card-tab active-card-tab text-xs py-2" data-tab="overview">Overview</button>
        <button class="card-tab text-xs py-2" data-tab="media">Media</button>
        <button class="card-tab text-xs py-2" data-tab="equipment">Equipment</button>
      </div>

      <div class="flex-1 min-h-0 relative">
        <div class="card-pane px-4 py-3 h-full overflow-y-auto thin-scroll" data-pane="overview">
          <p class="text-xs text-slate-700 leading-relaxed mb-2.5">${escapeHTML(project.overviewText)}</p>
          <ul class="text-xs text-slate-700 leading-relaxed space-y-1.5 mb-3">${bulletsHTML}</ul>
          <a href="${project.githubUrl}" target="_blank" rel="noopener"
             class="inline-flex items-center gap-1.5 text-xs font-semibold px-3 py-1.5 rounded-md border border-slate-300 hover:border-slate-500">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.65.5.5 5.66.5 12.03c0 5.1 3.29 9.42 7.86 10.95.57.1.78-.25.78-.55 0-.27-.01-1.16-.02-2.1-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.29-1.7-1.29-1.7-1.05-.72.08-.7.08-.7 1.17.08 1.78 1.2 1.78 1.2 1.03 1.77 2.71 1.26 3.37.96.1-.75.4-1.26.73-1.55-2.55-.29-5.24-1.28-5.24-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.05 11.05 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.64 1.59.24 2.76.12 3.05.74.8 1.18 1.83 1.18 3.09 0 4.43-2.7 5.4-5.27 5.69.42.36.78 1.08.78 2.17 0 1.57-.01 2.83-.01 3.22 0 .3.2.66.79.55A10.53 10.53 0 0 0 23.5 12.03C23.5 5.66 18.35.5 12 .5z"/></svg>
            View on GitHub
          </a>
        </div>
        <div class="card-pane px-4 py-3 h-full overflow-y-auto thin-scroll hidden" data-pane="media">
          <div class="aspect-video w-full rounded-md overflow-hidden border border-slate-200 bg-slate-50">
            <iframe class="w-full h-full" src="${project.mediaUrl}" title="${escapeHTML(project.title)} demo video" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe>
          </div>
        </div>
        <div class="card-pane px-4 py-3 h-full overflow-y-auto thin-scroll hidden" data-pane="equipment">
          <div class="flex flex-wrap gap-2">${equipHTML}</div>
        </div>
      </div>
    </article>`;
  }

  function renderProjects(){
    const list = $("#projectList");
    const filtered = activeCategory === "All"
      ? PORTFOLIO_DATA.projects
      : PORTFOLIO_DATA.projects.filter(p => p.category === activeCategory);

    list.innerHTML = filtered.map(projectCardHTML).join("");

    $$(".card-tab", list).forEach(tabBtn => {
      tabBtn.addEventListener("click", () => {
        const card = tabBtn.closest("[data-project-id]");
        $$(".card-tab", card).forEach(b => b.classList.remove("active-card-tab"));
        tabBtn.classList.add("active-card-tab");
        const target = tabBtn.dataset.tab;
        $$(".card-pane", card).forEach(pane => {
          pane.classList.toggle("hidden", pane.dataset.pane !== target);
        });
      });
    });
  }

  function initCategoryTabs(){
    const tabs = $("#catTabs");
    $$(".tab-btn", tabs).forEach(btn => {
      btn.addEventListener("click", () => {
        activeCategory = btn.dataset.cat;
        $$(".tab-btn", tabs).forEach(b => b.classList.remove("active-cat"));
        btn.classList.add("active-cat");
        renderProjects();
      });
    });
  }

  // ================= SKILLSET =================
  function renderSkills(){
    const container = $("#skillCategories");
    container.innerHTML = PORTFOLIO_DATA.skillCategories.map(cat => {
      const pills = cat.items.map(item =>
        `<span class="skill-pill text-xs px-3 py-1.5 rounded-md text-slate-700">${escapeHTML(item)}</span>`
      ).join("");
      return `
      <div>
        <p class="text-xs font-semibold text-slate-500 mb-2">${escapeHTML(cat.name)}</p>
        <div class="flex gap-2 overflow-x-auto no-scrollbar flex-nowrap whitespace-nowrap pb-1">${pills}</div>
      </div>`;
    }).join("");
  }

  // ================= DOCUMENT GENERATION =================
  const selectedDocs = new Set();

  function renderDocCards(){
    const container = $("#docCards");
    container.innerHTML = PORTFOLIO_DATA.documents.map(doc => `
      <button type="button" class="doc-card text-left rounded-lg px-4 py-3" data-doc-id="${doc.id}">
        <p class="text-sm" style="color:var(--ink)">${escapeHTML(doc.name)}</p>
        <p class="text-xs text-slate-500 mt-0.5">${escapeHTML(doc.desc)}</p>
      </button>
    `).join("");

    $$(".doc-card", container).forEach(card => {
      card.addEventListener("click", () => {
        const id = card.dataset.docId;
        if (selectedDocs.has(id)) {
          selectedDocs.delete(id);
          card.classList.remove("doc-selected");
        } else {
          selectedDocs.add(id);
          card.classList.add("doc-selected");
        }
      });
    });
  }

  function initDocForm(){
    const form = $("#docForm");
    const status = $("#docStatus");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = $("#docEmail").value.trim();
      if (selectedDocs.size === 0) {
        status.textContent = "Select at least one document above before sending.";
        status.style.color = "#dc2626";
        return;
      }
      const docNames = PORTFOLIO_DATA.documents
        .filter(d => selectedDocs.has(d.id))
        .map(d => d.name);

      // Analytics-style log of the requested document combination
      console.log("[document-request]", { email, documents: docNames, timestamp: new Date().toISOString() });

      status.textContent = `Sent "${docNames.join('", "')}" to ${email}.`;
      status.style.color = "#0d9488";
    });
  }

  // ================= UTIL =================
  function escapeHTML(str){
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // ================= INIT =================
  function init(){
    renderPersonal();
    initLangSelector();
    initCategoryTabs();
    renderProjects();
    renderSkills();
    renderDocCards();
    initDocForm();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
