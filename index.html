function extractVideoId(url) {
  const match = url.match(/embed\/([a-zA-Z0-9_-]+)/);
  return match ? match[1] : '';
}

function subTabStyle(isActive) {

    : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7] rounded-md px-3 py-1.5 text-[13px] font-mono';
}

function renderTabLabel(label) {
  return label.split('').map(function (ch) {
    if (ch !== ch.toLowerCase() && ch === ch.toUpperCase()) {
      return '<span class="font-bold">' + ch + '</span>';
    }
    return ch;
  }).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

      <div><span class="font-mono text-[11px] font-bold text-[#0d9488] uppercase tracking-wide">Objective</span><p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">${o.objective}</p></div>
      <div><span class="font-mono text-[11px] font-bold text-[#0d9488] uppercase tracking-wide">Contribution</span><p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">${o.contribution}</p></div>
      <div><span class="font-mono text-[11px] font-bold text-[#0d9488] uppercase tracking-wide">Results</span><p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">${o.results}</p></div>
    </div>
  `;
}

function renderProjectCard(project) {
  const currentSubTab = APP_STATE.projectSubTabs[project.id] || 'overview';
  return `
  <div class="w-[88vw] max-w-[340px] md:w-[350px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">
    <div>
      <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden" id="media-${project.id}">
        <img src="https://img.youtube.com/vi/${extractVideoId(project.videoUrl)}/hqdefault.jpg" class="w-full h-full object-cover" alt="${project.title}">
        <button data-action="play-video" data-id="${project.id}" class="absolute inset-0 flex items-center justify-center bg-black/40 hover:bg-black/20 text-white transition-colors">
          <svg class="w-12 h-12" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
        </button>
      </div>
      <h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">${project.title}</h3>
      <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${project.summary}</p>

      <div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
        <button data-action="project-subtab" data-id="${project.id}" data-tab="overview" class="${subTabStyle(currentSubTab === 'overview')}">OVERVIEW</button>
        <button data-action="project-subtab" data-id="${project.id}" data-tab="equipment" class="${subTabStyle(currentSubTab === 'equipment')}">EQUIPMENT</button>
        <button data-action="project-subtab" data-id="${project.id}" data-tab="urls" class="${subTabStyle(currentSubTab === 'urls')}">URL</button>
      </div>

      <div id="content-${project.id}" class="text-[14px] text-[#0f172a]">
        ${renderProjectSubTabContent(project, currentSubTab)}
      </div>
    </div>
  </div>
  `;
}

function renderProjectTabs() {
  const tabs = ["All", "SoftWare", "HardWare", "HW+SW"];
  document.getElementById('project-tabs').innerHTML = tabs.map(function (tab) {
    const isActive = APP_STATE.activeProjectTab === tab;
    return '<button data-action="select-project-tab" data-value="' + tab + '" class="' + subTabStyle(isActive) + '">' + renderTabLabel(tab) + '</button>';
  }).join('');
}

function renderProjectsCarousel() {
  const filtered = APP_STATE.activeProjectTab === 'All'
    ? PORTFOLIO_DATA.projects
    : PORTFOLIO_DATA.projects.filter(function (p) { return p.category === APP_STATE.activeProjectTab; });
  document.getElementById('projects-carousel-container').innerHTML = filtered.map(renderProjectCard).join('');
}

function renderProjectCardContent(id) {
  const project = PORTFOLIO_DATA.projects.find(function (p) { return p.id === id; });
  if (!project) return;
  const tab = APP_STATE.projectSubTabs[id] || 'overview';
  const contentEl = document.getElementById('content-' + id);
  if (contentEl) contentEl.innerHTML = renderProjectSubTabContent(project, tab);
  document.querySelectorAll('[data-action="project-subtab"][data-id="' + id + '"]').forEach(function (btn) {
    btn.className = subTabStyle(btn.dataset.tab === tab);
  });
}

/* ==================================================
   SKILLS
   ================================================== */
function renderSkillCategories() {
  const cats = Object.keys(PORTFOLIO_DATA.skills);
  document.getElementById('skill-categories').innerHTML = cats.map(function (cat) {
    const isActive = APP_STATE.activeSkillCategory === cat;
    const activeClass = 'bg-[#0284c7] text-white border-[#0284c7] font-bold';
    const inactiveClass = 'bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7]';
    return '<button data-action="select-skill-category" data-value="' + cat + '" class="px-3 py-1.5 rounded-md border text-[13px] font-mono whitespace-nowrap transition-colors ' + (isActive ? activeClass : inactiveClass) + '">' + cat + '</button>';
  }).join('');
}

function renderSkillsList() {
  const skills = PORTFOLIO_DATA.skills[APP_STATE.activeSkillCategory] || [];
  document.getElementById('skills-list').innerHTML = skills.map(function (skill) {
    return `
      <div class="mb-3 last:mb-0">
        <div class="flex justify-between items-center mb-1">
          <span class="text-[14px] font-sans text-[#0f172a] font-medium">${skill.name}</span>
          <span class="text-[12px] font-mono text-[#475569] shrink-0 ml-2">${skill.level}%</span>
        </div>
        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
          <div class="h-full bg-[#0284c7] rounded-full" style="width:${skill.level}%"></div>
        </div>
      </div>
    `;
  }).join('');
}

/* ==================================================
   EVENTS
   ================================================== */
function renderEventSubTabContent(event, tab) {
  if (tab === 'media') {
    return '<div class="grid grid-cols-2 gap-1.5">' +
      event.details.media.map(function (m) {
        return '<div class="aspect-video rounded-md overflow-hidden bg-slate-100"><img src="' + m + '" class="w-full h-full object-cover" alt="' + event.title + '"></div>';
      }).join('') +
      '</div>';
  }
  if (tab === 'urls') {
    return '<div class="flex flex-col gap-2">' +
      event.details.urls.map(function (u) {
        return '<a href="' + u.url + '" target="_blank" rel="noopener noreferrer" class="text-[#0284c7] hover:text-[#0369a1] hover:underline text-[14px] font-medium flex items-center gap-1.5">&rarr; ' + u.label + '</a>';
      }).join('') +
      '</div>';
  }
  const o = event.details.overview;
  return `
    <div class="space-y-1.5">
      <div><span class="font-mono text-[11px] font-bold text-[#0d9488] uppercase tracking-wide">Why It Mattered</span><p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">${o.whyMattered}</p></div>
      <div><span class="font-mono text-[11px] font-bold text-[#0d9488] uppercase tracking-wide">Participation</span><p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">${o.participation}</p></div>
      <div><span class="font-mono text-[11px] font-bold text-[#0d9488] uppercase tracking-wide">Outcomes</span><p class="text-[13px] text-[#0f172a] leading-snug mt-0.5">${o.outcomes}</p></div>
    </div>
  `;
}

function renderEventCard(event) {
  const currentSubTab = APP_STATE.eventSubTabs[event.id] || 'overview';
  return `
  <div class="w-[88vw] max-w-[340px] md:w-[350px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between shadow-xs">
    <div>
      <div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden" id="media-${event.id}">
        <img src="${event.imageUrl}" class="w-full h-full object-cover" alt="${event.title}">
      </div>
      <h3 class="text-[18px] font-bold text-[#0f172a] mt-2 mb-1 leading-snug">${event.title}</h3>
      <p class="text-[14px] text-[#475569] mb-3 leading-relaxed">${event.summary}</p>

      <div class="flex gap-1.5 mb-3 border-b border-[#e2e8f0] pb-2">
        <button data-action="event-subtab" data-id="${event.id}" data-tab="overview" class="${subTabStyle(currentSubTab === 'overview')}">OVERVIEW</button>
        <button data-action="event-subtab" data-id="${event.id}" data-tab="media" class="${subTabStyle(currentSubTab === 'media')}">MEDIA</button>
        <button data-action="event-subtab" data-id="${event.id}" data-tab="urls" class="${subTabStyle(currentSubTab === 'urls')}">URL</button>
      </div>

      <div id="content-${event.id}" class="text-[14px] text-[#0f172a]">
        ${renderEventSubTabContent(event, currentSubTab)}
      </div>
    </div>
  </div>
  `;
}

function renderEventTabs() {
  const tabs = ["All", "Conference", "Hackathon"];
  document.getElementById('event-tabs').innerHTML = tabs.map(function (tab) {
    const isActive = APP_STATE.activeEventTab === tab;
    return '<button data-action="select-event-tab" data-value="' + tab + '" class="' + subTabStyle(isActive) + '">' + tab.toUpperCase() + '</button>';
  }).join('');
}

function renderEventsCarousel() {
  const filtered = APP_STATE.activeEventTab === 'All'
    ? PORTFOLIO_DATA.events
    : PORTFOLIO_DATA.events.filter(function (e) { return e.category === APP_STATE.activeEventTab; });
  document.getElementById('events-carousel-container').innerHTML = filtered.map(renderEventCard).join('');
}

function renderEventCardContent(id) {
  const event = PORTFOLIO_DATA.events.find(function (e) { return e.id === id; });
  if (!event) return;
  const tab = APP_STATE.eventSubTabs[id] || 'overview';
  const contentEl = document.getElementById('content-' + id);
  if (contentEl) contentEl.innerHTML = renderEventSubTabContent(event, tab);
  document.querySelectorAll('[data-action="event-subtab"][data-id="' + id + '"]').forEach(function (btn) {
    btn.className = subTabStyle(btn.dataset.tab === tab);
  });
}

/* ==================================================
   VALUE PROPS
   ================================================== */
function renderValueProps() {
  document.getElementById('value-props-carousel').innerHTML = PORTFOLIO_DATA.valueProps.map(function (vp, i) {
    return `
      <div class="w-[280px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between">
        <div class="aspect-video rounded-md overflow-hidden mb-2.5 flex items-center justify-center bg-gradient-to-br from-[#0284c7]/10 to-[#0d9488]/10">
          <span class="font-mono text-[28px] font-bold text-[#0284c7]/40">0${i + 1}</span>
        </div>
        <p class="whitespace-nowrap overflow-hidden text-ellipsis text-[15px] sm:text-[16px] font-bold text-[#0f172a]">${vp.title}</p>
        <p class="whitespace-nowrap overflow-hidden text-ellipsis text-[13px] text-[#475569] font-mono mt-0.5">${vp.text}</p>
      </div>
    `;
  }).join('');
}

/* ==================================================
   HELP YOURSELF / DOC CARDS
   ================================================== */
function renderDocCards() {
  const docs = [
    { id: 'cv', label: 'CV — PDF Document' },
    { id: 'portfolio', label: 'Portfolio — PDF Document' }
  ];
  document.getElementById('doc-cards').innerHTML = docs.map(function (doc) {
    const isSelected = APP_STATE.selectedDocs[doc.id];
    const cardClass = isSelected
      ? 'border-2 border-[#0284c7] bg-[#f0f9ff]'
      : 'border border-[#e2e8f0] bg-white';
    const checkClass = isSelected
      ? 'bg-[#0284c7] border-[#0284c7]'
      : 'bg-white border-[#e2e8f0]';
    const checkMark = isSelected
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" class="w-3 h-3"><polyline points="20 6 9 17 4 12"></polyline></svg>'
      : '';
    return `
      <div data-action="toggle-doc" data-id="${doc.id}" class="doc-check cursor-pointer rounded-lg p-3 flex items-center justify-between ${cardClass}">
        <span class="text-[14px] font-mono font-bold text-[#0f172a]">${doc.label}</span>
        <span class="doc-check w-5 h-5 rounded border flex items-center justify-center ${checkClass}">${checkMark}</span>
      </div>
    `;
  }).join('');
}

function showToast(message, isError) {
  const existing = document.getElementById('toast-notification');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'toast-notification';
  toast.className = 'toast-anim fixed bottom-20 left-1/2 -translate-x-1/2 z-[60] px-4 py-2.5 rounded-lg shadow-lg text-[13px] font-mono font-medium text-white max-w-[90vw] text-center ' + (isError ? 'bg-red-500' : 'bg-[#0d9488]');
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(function () {
    toast.style.transition = 'opacity 0.3s ease';
    toast.style.opacity = '0';
    setTimeout(function () { toast.remove(); }, 300);
  }, 3000);
}

function handleSendDocs() {
  const emailInput = document.getElementById('user-email-input');
  const email = emailInput.value.trim();
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const selected = [];
  if (APP_STATE.selectedDocs.cv) selected.push('CV');
  if (APP_STATE.selectedDocs.portfolio) selected.push('Portfolio');

  if (selected.length === 0) {
    showToast('Select at least one document to send', true);
    return;
  }
  if (!email || !emailPattern.test(email)) {
    showToast('Enter a valid email address', true);
    return;
  }
  showToast('Dispatched ' + selected.join(' & ') + ' to ' + email, false);
}

/* ==================================================
   EVENT DELEGATION
   ================================================== */
document.body.addEventListener('click', function (e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;

  if (action === 'select-project-tab') {
    APP_STATE.activeProjectTab = btn.dataset.value;
    renderProjectTabs();
    renderProjectsCarousel();
  } else if (action === 'project-subtab') {
    APP_STATE.projectSubTabs[btn.dataset.id] = btn.dataset.tab;
    renderProjectCardContent(btn.dataset.id);
  } else if (action === 'play-video') {
    const project = PORTFOLIO_DATA.projects.find(function (p) { return p.id === btn.dataset.id; });
    if (project) {
      document.getElementById('media-' + btn.dataset.id).innerHTML =
        '<iframe src="' + project.videoUrl + '?autoplay=1" class="w-full h-full border-0" allow="autoplay"></iframe>';
    }
  } else if (action === 'select-skill-category') {
    APP_STATE.activeSkillCategory = btn.dataset.value;
    renderSkillCategories();
    renderSkillsList();
  } else if (action === 'select-event-tab') {
    APP_STATE.activeEventTab = btn.dataset.value;
    renderEventTabs();
    renderEventsCarousel();
  } else if (action === 'event-subtab') {
    APP_STATE.eventSubTabs[btn.dataset.id] = btn.dataset.tab;
    renderEventCardContent(btn.dataset.id);
  } else if (action === 'toggle-doc') {
    APP_STATE.selectedDocs[btn.dataset.id] = !APP_STATE.selectedDocs[btn.dataset.id];
    renderDocCards();
  } else if (action === 'send-docs') {
    handleSendDocs();
  }
});

/* ==================================================
   STICKY HEADER SCROLL BEHAVIOR
   ================================================== */
window.addEventListener('scroll', function () {
  const header = document.getElementById('sticky-header');
  if (window.scrollY > 100) {
    header.classList.remove('-translate-y-full', 'opacity-0');
    header.classList.add('translate-y-0', 'opacity-100');
  } else {
    header.classList.add('-translate-y-full', 'opacity-0');
    header.classList.remove('translate-y-0', 'opacity-100');
  }
});

/* ==================================================
   INIT
   ================================================== */
function initApp() {
  PORTFOLIO_DATA.projects.forEach(function (p) { APP_STATE.projectSubTabs[p.id] = 'overview'; });
  PORTFOLIO_DATA.events.forEach(function (e) { APP_STATE.eventSubTabs[e.id] = 'overview'; });

  renderHero();
  renderProjectTabs();
  renderProjectsCarousel();
  renderSkillCategories();
  renderSkillsList();
  renderEventTabs();
  renderEventsCarousel();
  renderValueProps();
  renderDocCards();
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
