    display: -webkit-box;

    overflow: hidden;

    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .line-clamp-3 {
    display: -webkit-box;

    overflow: hidden;
  }

  .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #cbd5e1 #f1f5f9; }

  #sticky-header {
    transform: translateY(-100%);
  }
  #sticky-header.visible {
    transform: translateY(0);
  }

  .tab-btn {
    transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .toast-item {
    animation: toast-in 0.25s ease forwards;
  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .toast-out {
    animation: toast-out 0.2s ease forwards;
  }
  @keyframes toast-out {
    from { opacity: 1; transform: translateY(0); }
    to { opacity: 0; transform: translateY(8px); }
  }

    html { scroll-behavior: auto; }

  /* ==================================================
     UTIL
  ================================================== */
  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function toTitleCase(name) {
    return name
      .split(" ")
      .map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase())
      .join(" ");
  }

  /* ==================================================
     RENDER: HERO / STICKY HEADER
  ================================================== */
  function renderHero() {
    const p = PORTFOLIO_DATA.personal;

    document.getElementById("hero-avatar").src = p.avatarUrl;
    document.getElementById("hero-avatar").alt = p.name;
    document.getElementById("sticky-avatar").src = p.avatarUrl;

    document.getElementById("hero-name").textContent = toTitleCase(p.name);
    document.getElementById("hero-title").textContent = p.title;
    document.getElementById("hero-statement").textContent = p.statement;

    const telHref = "tel:" + p.phone.replace(/\s+/g, "");

    const contactsHtml = `
      <a href="${telHref}"
         class="inline-flex items-center gap-1.5 text-xs font-mono font-semibold text-white bg-[#0284c7] hover:bg-[#0369a1] rounded-full px-3 py-1.5 transition-colors">
        ${ICONS.phone}<span>Call</span>
      </a>
      <a href="${p.whatsapp}" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-1.5 text-xs font-mono font-semibold text-white bg-[#0d9488] hover:bg-[#0f766e] rounded-full px-3 py-1.5 transition-colors">
        ${ICONS.whatsapp}<span>WhatsApp</span>
      </a>
      <span class="inline-flex items-center gap-1 text-[10px] md:text-xs font-mono text-[#475569] bg-[#f1f5f9] border border-[#e2e8f0] rounded-full px-2.5 py-1.5">
        ${ICONS.mappin}<span>${escapeHtml(p.location)}</span>
      </span>
      <a href="mailto:${p.email}"
         class="inline-flex items-center gap-1 text-[10px] md:text-xs font-mono text-[#475569] bg-[#f1f5f9] border border-[#e2e8f0] rounded-full px-2.5 py-1.5 hover:border-[#0284c7] hover:text-[#0284c7] transition-colors">
        ${ICONS.mail}<span>${escapeHtml(p.email)}</span>
      </a>
      <a href="${p.linkedin}" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-1 text-[10px] md:text-xs font-mono text-[#475569] bg-[#f1f5f9] border border-[#e2e8f0] rounded-full px-2.5 py-1.5 hover:border-[#0284c7] hover:text-[#0284c7] transition-colors">
        ${ICONS.linkedin}<span>LinkedIn</span>
      </a>
      <a href="${p.github}" target="_blank" rel="noopener noreferrer"
         class="inline-flex items-center gap-1 text-[10px] md:text-xs font-mono text-[#475569] bg-[#f1f5f9] border border-[#e2e8f0] rounded-full px-2.5 py-1.5 hover:border-[#0284c7] hover:text-[#0284c7] transition-colors">
        ${ICONS.github}<span>GitHub</span>
      </a>
    `;
    document.getElementById("hero-contacts").innerHTML = contactsHtml;
  }

  /* ==================================================
     RENDER: PROJECTS
  ================================================== */
  const PROJECT_TABS = ["HardWare", "SoftWare", "HW+SW"];

  function projectMatchesFilter(project, filter) {
    if (filter === "HW+SW") return true;
    if (filter === "HardWare") return project.category === "HardWare" || project.category === "HW+SW";
    if (filter === "SoftWare") return project.category === "SoftWare" || project.category === "HW+SW";
    return true;
  }

  function renderProjectTabs() {
    const track = document.getElementById("project-tabs");
    track.innerHTML = PROJECT_TABS.map(tab => {
      const active = state.projectFilter === tab;
      const cls = active
        ? "bg-[#0284c7] text-white border-[#0284c7]"
        : "bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7] hover:text-[#0284c7]";
      return `<button type="button" data-filter="${tab}"
                class="tab-btn font-mono text-xs md:text-sm font-semibold border rounded-full px-4 py-1.5 ${cls}">
                ${tab}
              </button>`;
    }).join("");

    track.querySelectorAll("button[data-filter]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.projectFilter = btn.getAttribute("data-filter");
        renderProjectTabs();
        renderProjects();
      });
    });
  }

  function renderProjects() {
    const wrap = document.getElementById("projects-track");
    const filtered = PORTFOLIO_DATA.projects.filter(p => projectMatchesFilter(p, state.projectFilter));

    wrap.innerHTML = filtered.map(project => `
      <div class="w-[280px] md:w-[320px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between">
        <div>
          <div class="aspect-video relative rounded bg-slate-900 overflow-hidden flex items-center justify-center cursor-pointer group"
               data-video="${escapeHtml(project.videoUrl)}">
            <span class="text-white/90 group-hover:text-white group-hover:scale-110 transition-transform">${ICONS.play}</span>
            <span class="absolute top-2 left-2 font-mono text-[10px] tracking-wider text-white/90 bg-black/40 border border-white/20 rounded px-1.5 py-0.5">${escapeHtml(project.category)}</span>
          </div>
          <h3 class="font-bold text-[#0f172a] text-base mt-3 mb-1 line-clamp-1">${escapeHtml(project.title)}</h3>
          <p class="line-clamp-2 text-xs md:text-sm text-[#475569] mb-4">${escapeHtml(project.summary)}</p>
        </div>
        <a href="${project.links.url}" target="_blank" rel="noopener noreferrer"
           class="inline-flex items-center justify-center gap-1.5 w-full font-mono text-xs font-semibold text-white bg-[#0284c7] hover:bg-[#0369a1] rounded-lg px-3 py-2 transition-colors">
          ${ICONS.external}<span>Visit / View Project</span>
        </a>
      </div>
    `).join("");

    wrap.querySelectorAll("[data-video]").forEach(el => {
      el.addEventListener("click", () => openVideoModal(el.getAttribute("data-video")));
    });
  }

  /* ==================================================
     RENDER: SKILLS
  ================================================== */
  function renderSkillTabs() {
    const categories = Object.keys(PORTFOLIO_DATA.skills);
    const track = document.getElementById("skill-tabs");
    track.innerHTML = categories.map(cat => {
      const active = state.skillCategory === cat;
      const cls = active
        ? "bg-[#0284c7] text-white border-[#0284c7]"
        : "bg-white text-[#475569] border-[#e2e8f0] hover:border-[#0284c7] hover:text-[#0284c7]";
      return `<button type="button" data-cat="${escapeHtml(cat)}"
                class="tab-btn font-mono text-xs md:text-sm font-semibold border rounded-full px-4 py-1.5 shrink-0 ${cls}">
                ${escapeHtml(cat)}
              </button>`;
    }).join("");

    track.querySelectorAll("button[data-cat]").forEach(btn => {
      btn.addEventListener("click", () => {
        state.skillCategory = btn.getAttribute("data-cat");
        renderSkillTabs();
        renderSkills();
        document.getElementById("skills-container").scrollTop = 0;
      });
    });
  }

  function renderSkills() {
    const list = document.getElementById("skills-list");
    const skills = PORTFOLIO_DATA.skills[state.skillCategory] || [];

    list.innerHTML = skills.map(skill => `
      <div>
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-sm text-[#0f172a] font-medium">${escapeHtml(skill.name)}</span>
          <span class="font-mono text-xs text-[#0284c7] font-semibold">${skill.level}%</span>
        </div>
        <div class="h-2 rounded-full bg-[#f1f5f9] overflow-hidden">
          <div class="h-2 rounded-full bg-[#0284c7]" style="width:${skill.level}%"></div>
        </div>
      </div>
    `).join("");
  }

  /* ==================================================
     RENDER: VALUE PROPS
  ================================================== */
  function renderValueProps() {
    const track = document.getElementById("value-props-track");
    track.innerHTML = PORTFOLIO_DATA.valueProps.map((vp, i) => `
      <div class="shrink-0 w-[280px] snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-5 flex flex-col justify-between">
        <div>
          <h3 class="font-bold text-[#0f172a] text-base">Reason #${i + 1}: ${escapeHtml(vp.title)}</h3>
          <p class="font-mono text-xs text-[#475569] mt-2">${escapeHtml(vp.text)}</p>
        </div>
      </div>
    `).join("");
  }

  /* ==================================================
     VIDEO MODAL
  ================================================== */
  function openVideoModal(url) {
    const modal = document.getElementById("video-modal");
    const frame = document.getElementById("video-modal-frame");
    frame.src = url + (url.includes("?") ? "&" : "?") + "autoplay=1";
    modal.classList.remove("hidden");
    modal.classList.add("flex");
    document.body.style.overflow = "hidden";
  }

  function closeVideoModal() {
    const modal = document.getElementById("video-modal");
    const frame = document.getElementById("video-modal-frame");
    modal.classList.add("hidden");
    modal.classList.remove("flex");
    frame.src = "";
    document.body.style.overflow = "";
  }

  /* ==================================================
     DOCUMENT SELECTION + EMAIL SEND
  ================================================== */
  function updateDocCardUI() {
    const cvCard = document.getElementById("cv-card");
    const portfolioCard = document.getElementById("portfolio-card");

    [
      [cvCard, state.cvSelected],
      [portfolioCard, state.portfolioSelected]
    ].forEach(([card, selected]) => {
      const check = card.querySelector(".doc-check");
      if (selected) {
        card.classList.add("border-2", "border-[#0284c7]", "bg-[#f0f9ff]");
        card.classList.remove("border", "border-[#e2e8f0]", "bg-white");
        check.classList.remove("hidden");
      } else {
        card.classList.remove("border-2", "border-[#0284c7]", "bg-[#f0f9ff]");
        card.classList.add("border", "border-[#e2e8f0]", "bg-white");
        check.classList.add("hidden");
      }
    });
  }

  function isValidEmail(value) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value);
  }

  function handleSendDocs() {
    const emailInput = document.getElementById("email-input");
    const email = emailInput.value.trim();

    if (!state.cvSelected && !state.portfolioSelected) {
      showToast("Please select at least one document to send.", "warn");
      return;
    }
    if (!email || !isValidEmail(email)) {
      showToast("Please enter a valid email address.", "warn");
      return;
    }

    const selectedItems = [];
    if (state.cvSelected) selectedItems.push("CV Document");
    if (state.portfolioSelected) selectedItems.push("Portfolio Document");

    showToast(`Notification: Dispatched ${selectedItems.join(" & ")} to ${email}`, "success");

    state.cvSelected = false;
    state.portfolioSelected = false;
    updateDocCardUI();
    emailInput.value = "";
  }

  /* ==================================================
     TOASTS
  ================================================== */
  function showToast(message, type) {
    const container = document.getElementById("toast-container");
    const toast = document.createElement("div");

    const colorMap = {
      success: "border-[#0d9488] text-[#0f766e]",
      warn: "border-[#0284c7] text-[#0369a1]",
      info: "border-[#e2e8f0] text-[#475569]"
    };
    const colorCls = colorMap[type] || colorMap.info;

    toast.className = `toast-item bg-white border ${colorCls} rounded-lg shadow-lg px-4 py-3 text-xs md:text-sm font-mono max-w-xs`;
    toast.textContent = message;
    container.appendChild(toast);

    setTimeout(() => {
      toast.classList.remove("toast-item");
      toast.classList.add("toast-out");
      setTimeout(() => toast.remove(), 220);
    }, 3200);
  }

  /* ==================================================
     STICKY HEADER SCROLL BEHAVIOR
  ================================================== */
  function bindScrollBehavior() {
    const header = document.getElementById("sticky-header");
    let ticking = false;

    window.addEventListener("scroll", () => {
      if (!ticking) {
        window.requestAnimationFrame(() => {
          if (window.scrollY > 100) {
            header.classList.add("visible");
          } else {
            header.classList.remove("visible");
          }
          ticking = false;
        });
        ticking = true;
      }
    });
  }

  /* ==================================================
     EVENT BINDING
  ================================================== */
  function bindStaticEvents() {
    document.getElementById("video-modal-close").addEventListener("click", closeVideoModal);
    document.getElementById("video-modal").addEventListener("click", (e) => {
      if (e.target.id === "video-modal") closeVideoModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeVideoModal();
    });

    document.getElementById("cv-card").addEventListener("click", () => {
      state.cvSelected = !state.cvSelected;
      updateDocCardUI();
    });
    document.getElementById("portfolio-card").addEventListener("click", () => {
      state.portfolioSelected = !state.portfolioSelected;
      updateDocCardUI();
    });
    document.getElementById("send-docs-btn").addEventListener("click", handleSendDocs);

    document.getElementById("language-select").addEventListener("change", (e) => {
      state.language = e.target.value;
      const labels = { en: "English", fr: "French", nl: "Dutch", de: "German" };
      showToast(`Language set to ${labels[state.language] || state.language}`, "info");
    });

    document.querySelectorAll(".doc-icon").forEach(el => {
      el.innerHTML = ICONS.document;
    });
  }

  /* ==================================================
     INIT
  ================================================== */
  function init() {
    renderHero();
    renderProjectTabs();
    renderProjects();
    renderSkillTabs();
    renderSkills();
    renderValueProps();
    updateDocCardUI();
    bindStaticEvents();
    bindScrollBehavior();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
