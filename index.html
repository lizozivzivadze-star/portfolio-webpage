/* ==================================================
   HELPERS
   ================================================== */
function boldCaps(label) {
  // Wrap uppercase letters in a bold span; everything else stays normal weight.
  return label.split('').map(ch => {
    if (ch >= 'A' && ch <= 'Z') return `<span class="font-bold">${ch}</span>`;
    return ch;
  }).join('');
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

  } else {
    header.classList.add('opacity-0', '-translate-y-full', 'pointer-events-none');
    header.classList.remove('opacity-100', 'translate-y-0');
  }
}, { passive: true });

        <img src="https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?auto=format&fit=crop&q=80&w=600" class="w-full h-full object-cover opacity-70" alt="${project.title} preview">
        <div class="absolute inset-0 flex items-center justify-center">
          <div class="w-14 h-14 rounded-full bg-white/90 text-[#0284c7] flex items-center justify-center group-hover:scale-105 transition-transform">${ICONS.play}</div>
        </div>
      </div>
      <div class="mt-2.5">
        <div class="text-[16px] font-bold text-[#0f172a] leading-snug">${project.title}</div>
        <div class="text-[14px] text-[#475569] font-sans mt-1 leading-snug">${project.summary}</div>
      </div>
      <div class="mt-2.5 min-h-[92px]" data-project-content></div>
    </div>
    <div class="flex items-center gap-1.5 mt-auto pt-2.5 border-t border-slate-100" data-project-subtabs>
      ${['OVERVIEW', 'EQUIPMENT', 'URL'].map((t, i) => `
        <button data-subtab="${t}" class="${i === 0 ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors">${t}</button>
      `).join('')}
    </div>
  </article>`;
}

function projectSubtabContent(project, tab) {
  if (tab === 'OVERVIEW') {
    const o = project.details.overview;
    return `
      <div class="text-[14px] font-sans text-[#0f172a] space-y-1.5">
        <p><span class="font-mono text-[13px] font-bold text-[#0d9488]">OBJECTIVE — </span>${o.objective}</p>
        <p><span class="font-mono text-[13px] font-bold text-[#0d9488]">CONTRIBUTION — </span>${o.contribution}</p>
        <p><span class="font-mono text-[13px] font-bold text-[#0d9488]">RESULTS — </span>${o.results}</p>
      </div>`;
  }
  if (tab === 'EQUIPMENT') {
    return `
      <div class="flex flex-wrap gap-1.5">
        ${project.details.equipment.map(eq => `<span class="text-[13px] font-mono bg-[#f8fafc] border border-[#e2e8f0] text-[#0f172a] rounded-md px-2 py-1">${eq}</span>`).join('')}
      </div>`;
  }
  if (tab === 'URL') {
    return `
      <div class="flex flex-col gap-1.5">
        ${project.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener" class="text-[14px] font-sans text-[#0284c7] hover:text-[#0369a1] hover:underline">${u.label}</a>`).join('')}
      </div>`;
  }
  return '';
}

function renderProjectsSection() {
  return `
  <section class="w-full max-w-4xl mx-auto my-4 p-5 rounded-xl bg-white border border-[#e2e8f0] shadow-sm flex flex-col justify-between min-h-[435px] max-h-[435px]">
    <div>
      <h2 class="font-mono text-[22px] font-bold text-[#0f172a] text-center">PROJECTS</h2>
      <div class="flex flex-wrap justify-center gap-1.5 my-2.5" id="project-tabs">
        ${PROJECT_TABS.map(tab => `
          <button data-project-tab="${tab}" class="${tab === activeProjectTab ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors">${projectTabLabel(tab)}</button>
        `).join('')}
      </div>
    </div>
    <div id="project-carousel" class="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-3 custom-scrollbar flex-1"></div>
  </section>`;
}

function projectsMatchingTab(tab) {
  if (tab === "All") return PORTFOLIO_DATA.projects;
  return PORTFOLIO_DATA.projects.filter(p => p.category === tab);
}

function mountProjects() {
  const carousel = document.getElementById('project-carousel');
  carousel.innerHTML = '';
  const projects = projectsMatchingTab(activeProjectTab);
  projects.forEach(project => {
    const card = el(renderProjectCard(project));
    carousel.appendChild(card);
    const contentSlot = card.querySelector('[data-project-content]');
    contentSlot.innerHTML = projectSubtabContent(project, 'OVERVIEW');

    card.querySelectorAll('[data-subtab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-subtab');
        card.querySelectorAll('[data-subtab]').forEach(b => {
          const isActive = b === btn;
          b.className = `${isActive ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors`;
        });
        contentSlot.innerHTML = projectSubtabContent(project, tab);
      });
    });

    const videoTrigger = card.querySelector('[data-video-trigger]');
    videoTrigger.addEventListener('click', () => {
      const videoUrl = videoTrigger.getAttribute('data-video-url');
      videoTrigger.outerHTML = `<div class="aspect-video rounded-md relative bg-slate-900 overflow-hidden"><iframe src="${videoUrl}?autoplay=1" class="w-full h-full border-0" allow="autoplay"></iframe></div>`;
    });
  });

  document.querySelectorAll('[data-project-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeProjectTab = btn.getAttribute('data-project-tab');
      document.querySelectorAll('[data-project-tab]').forEach(b => {
        const isActive = b.getAttribute('data-project-tab') === activeProjectTab;
        b.className = `${isActive ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors`;
      });
      mountProjects();
    });
  });
}

/* ==================================================
   SECTION: SKILLSETS
   ================================================== */
const SKILL_CATEGORIES = ["Electronics", "Embedded", "Mechanical Design", "Robotics", "Programming"];
let activeSkillCategory = "Electronics";

function renderSkillRow(skill) {
  return `

    <div class="flex items-center justify-between mb-1">
      <span class="text-[14px] font-sans text-[#0f172a]">${skill.name}</span>
      <span class="text-[13px] font-mono text-[#475569]">${skill.level}%</span>
    </div>
    <div class="w-full h-1.5 rounded-full bg-[#e2e8f0] overflow-hidden">
      <div class="h-full rounded-full bg-[#0284c7]" style="width:${skill.level}%"></div>
    </div>
  </div>`;
}

function renderSkillsSection() {
  return `
  <section class="w-full max-w-4xl mx-auto my-4 p-5 rounded-xl bg-white border border-[#e2e8f0] shadow-sm flex flex-col justify-between min-h-[435px] max-h-[435px]">
    <div>
      <h2 class="font-mono text-[22px] font-bold text-[#0f172a]">SKILLSETS</h2>
      <div class="flex flex-wrap gap-2 my-2.5" id="skill-category-tabs">
        ${SKILL_CATEGORIES.map(cat => `
          <button data-skill-cat="${cat}" class="${cat === activeSkillCategory ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors">${cat}</button>
        `).join('')}
      </div>
      <div class="font-sans text-[16px] font-bold text-[#0f172a]">Skills</div>
    </div>
    <div class="h-[210px] overflow-y-auto border border-[#e2e8f0] rounded-lg p-3 bg-white custom-scrollbar mt-2" id="skill-list"></div>
  </section>`;
}

function mountSkills() {
  const list = document.getElementById('skill-list');
  list.innerHTML = PORTFOLIO_DATA.skills[activeSkillCategory].map(renderSkillRow).join('');

  document.querySelectorAll('[data-skill-cat]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeSkillCategory = btn.getAttribute('data-skill-cat');
      document.querySelectorAll('[data-skill-cat]').forEach(b => {
        const isActive = b.getAttribute('data-skill-cat') === activeSkillCategory;
        b.className = `${isActive ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors`;
      });
      mountSkills();
    });
  });
}

/* ==================================================
   SECTION: EVENTS
   ================================================== */
const EVENT_TABS = ["All", "Conference", "Hackathon"];
let activeEventTab = "All";

function renderEventCard(event) {
  return `
  <article class="w-[310px] shrink-0 snap-start bg-white border border-[#e2e8f0] rounded-lg p-3.5 flex flex-col justify-between shadow-xs" data-event-id="${event.id}">
    <div>
      <div class="aspect-video rounded-md overflow-hidden bg-slate-900">
        <img src="${event.imageUrl}" alt="${event.title}" class="w-full h-full object-cover">
      </div>
      <div class="mt-2.5">
        <div class="text-[16px] font-bold text-[#0f172a] leading-snug">${event.title}</div>
        <div class="text-[14px] text-[#475569] font-sans mt-1 leading-snug">${event.summary}</div>
      </div>
      <div class="mt-2.5 min-h-[92px]" data-event-content></div>
    </div>
    <div class="flex items-center gap-1.5 mt-auto pt-2.5 border-t border-slate-100" data-event-subtabs>
      ${['OVERVIEW', 'MEDIA', 'URL'].map((t, i) => `
        <button data-esubtab="${t}" class="${i === 0 ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors">${t}</button>
      `).join('')}
    </div>
  </article>`;
}

function eventSubtabContent(event, tab) {
  if (tab === 'OVERVIEW') {
    const o = event.details.overview;
    return `
      <div class="text-[14px] font-sans text-[#0f172a] space-y-1.5">
        <p><span class="font-mono text-[13px] font-bold text-[#0d9488]">WHY IT MATTERED — </span>${o.whyMattered}</p>
        <p><span class="font-mono text-[13px] font-bold text-[#0d9488]">PARTICIPATION — </span>${o.participation}</p>
        <p><span class="font-mono text-[13px] font-bold text-[#0d9488]">OUTCOMES — </span>${o.outcomes}</p>
      </div>`;
  }
  if (tab === 'MEDIA') {
    return `
      <div class="grid grid-cols-2 gap-1.5">
        ${event.details.media.map(m => `<img src="${m}" class="w-full h-16 object-cover rounded-md border border-[#e2e8f0]" alt="${event.title} media">`).join('')}
      </div>`;
  }
  if (tab === 'URL') {
    return `
      <div class="flex flex-col gap-1.5">
        ${event.details.urls.map(u => `<a href="${u.url}" target="_blank" rel="noopener" class="text-[14px] font-sans text-[#0284c7] hover:text-[#0369a1] hover:underline">${u.label}</a>`).join('')}
      </div>`;
  }
  return '';
}

function renderEventsSection() {
  return `
  <section class="w-full max-w-4xl mx-auto my-4 p-5 rounded-xl bg-white border border-[#e2e8f0] shadow-sm flex flex-col justify-between min-h-[435px] max-h-[435px]">
    <div>
      <h2 class="font-mono text-[22px] font-bold text-[#0f172a] text-center">EVENTS</h2>
      <div class="flex flex-wrap justify-center gap-1.5 mb-2.5" id="event-tabs">
        ${EVENT_TABS.map(tab => `
          <button data-event-tab="${tab}" class="${tab === activeEventTab ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors">${tab}</button>
        `).join('')}
      </div>
    </div>
    <div id="event-carousel" class="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-3 custom-scrollbar flex-1"></div>
  </section>`;
}

function eventsMatchingTab(tab) {
  if (tab === "All") return PORTFOLIO_DATA.events;
  return PORTFOLIO_DATA.events.filter(e => e.category === tab);
}

function mountEvents() {
  const carousel = document.getElementById('event-carousel');
  carousel.innerHTML = '';
  const events = eventsMatchingTab(activeEventTab);
  events.forEach(event => {
    const card = el(renderEventCard(event));
    carousel.appendChild(card);
    const contentSlot = card.querySelector('[data-event-content]');
    contentSlot.innerHTML = eventSubtabContent(event, 'OVERVIEW');

    card.querySelectorAll('[data-esubtab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-esubtab');
        card.querySelectorAll('[data-esubtab]').forEach(b => {
          const isActive = b === btn;
          b.className = `${isActive ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors`;
        });
        contentSlot.innerHTML = eventSubtabContent(event, tab);
      });
    });
  });

  document.querySelectorAll('[data-event-tab]').forEach(btn => {
    btn.addEventListener('click', () => {
      activeEventTab = btn.getAttribute('data-event-tab');
      document.querySelectorAll('[data-event-tab]').forEach(b => {
        const isActive = b.getAttribute('data-event-tab') === activeEventTab;
        b.className = `${isActive ? 'bg-[#0284c7] text-white border border-[#0284c7] font-bold' : 'bg-white text-[#475569] border border-[#e2e8f0] hover:border-[#0284c7]'} rounded-md px-3 py-1.5 text-[13px] font-mono transition-colors`;
      });
      mountEvents();
    });
  });
}

/* ==================================================
   SECTION: WHAT DO I BRING TO THE TABLE
   ================================================== */
function renderValuePropsSection() {
  return `
  <section class="w-full max-w-4xl mx-auto my-4 p-5 rounded-xl bg-white border border-[#e2e8f0] shadow-sm">
    <h2 class="font-mono text-[22px] font-bold text-[#0f172a] text-center mb-2.5">WHAT DO I BRING TO THE TABLE?</h2>
    <div class="flex overflow-x-auto snap-x snap-mandatory gap-4 pb-3 custom-scrollbar">
      ${PORTFOLIO_DATA.valueProps.map(vp => `
        <div class="w-[280px] shrink-0 snap-start bg-[#f8fafc] border border-[#e2e8f0] rounded-lg p-4 flex flex-col justify-between">
          <div class="aspect-video rounded-md overflow-hidden bg-slate-100 mb-2.5">
            <img src="${vp.image}" alt="${vp.title}" class="w-full h-full object-cover">
          </div>
          <div class="whitespace-nowrap overflow-hidden text-ellipsis text-[16px] font-bold text-[#0f172a]">${vp.title}</div>
          <div class="text-[14px] font-sans text-[#475569] mt-1">${vp.text}</div>
        </div>
      `).join('')}
    </div>
  </section>`;
}

/* ==================================================
   SECTION: HELP YOURSELF
   ================================================== */
const selectedDocs = new Set();

function renderHelpYourselfSection() {
  return `
  <section class="w-full max-w-4xl mx-auto my-4 p-5 rounded-xl bg-white border border-[#e2e8f0] shadow-sm">
    <h2 class="font-mono text-[22px] font-bold text-[#0f172a] text-center mb-2.5">HELP YOURSELF</h2>
    <div class="grid grid-cols-2 gap-3 mb-3">
      <button id="doc-cv" data-doc="CV Document" class="border border-[#e2e8f0] rounded-lg p-4 flex flex-col items-center gap-2 text-[#0f172a] transition-colors">
        <span class="text-[#0284c7]">${ICONS.file}</span>
        <span class="text-[14px] font-mono font-bold">CV Document</span>
      </button>
      <button id="doc-portfolio" data-doc="Portfolio Document" class="border border-[#e2e8f0] rounded-lg p-4 flex flex-col items-center gap-2 text-[#0f172a] transition-colors">
        <span class="text-[#0284c7]">${ICONS.file}</span>
        <span class="text-[14px] font-mono font-bold">Portfolio Document</span>
      </button>
    </div>
    <input id="email-input" type="email" placeholder="your.email@example.com" class="text-[14px] font-sans rounded-md border border-[#e2e8f0] px-3 py-2 w-full">
    <button id="send-docs-btn" class="text-[14px] font-mono font-bold text-white bg-[#0284c7] hover:bg-[#0369a1] rounded-md px-4 py-2 w-full mt-2 transition-colors">Send Copies Now</button>
  </section>`;
}

function mountHelpYourself() {
  const cvBtn = document.getElementById('doc-cv');
  const portfolioBtn = document.getElementById('doc-portfolio');
  const emailInput = document.getElementById('email-input');
  const sendBtn = document.getElementById('send-docs-btn');

  function refreshDocBtn(btn, key) {
    const active = selectedDocs.has(key);
    btn.className = `border rounded-lg p-4 flex flex-col items-center gap-2 text-[#0f172a] transition-colors ${active ? 'border-2 border-[#0284c7] bg-[#f0f9ff]' : 'border border-[#e2e8f0]'}`;
  }

  [ [cvBtn, 'CV Document'], [portfolioBtn, 'Portfolio Document'] ].forEach(([btn, key]) => {
    refreshDocBtn(btn, key);
    btn.addEventListener('click', () => {
      if (selectedDocs.has(key)) selectedDocs.delete(key);
      else selectedDocs.add(key);
      refreshDocBtn(cvBtn, 'CV Document');
      refreshDocBtn(portfolioBtn, 'Portfolio Document');
    });
  });

  sendBtn.addEventListener('click', () => {
    const email = emailInput.value.trim();
    if (selectedDocs.size === 0 || !email) {
      showToast(`Select at least one item and enter a valid email to send copies`, true);
      return;
    }
    const items = Array.from(selectedDocs).join(', ');
    showToast(`Dispatched ${items} to ${email}`, false);
  });
}

function showToast(message, isError) {
  const root = document.getElementById('toast-root');
  root.innerHTML = '';
  const toast = el(`
    <div class="toast-enter -translate-x-1/2 rounded-md px-4 py-2.5 text-[14px] font-sans shadow-lg border ${isError ? 'bg-red-50 border-red-200 text-red-700' : 'bg-[#0f172a] border-[#0f172a] text-white'}">
      ${message}
    </div>`);
  root.appendChild(toast);
  setTimeout(() => { toast.remove(); }, 3200);
}

/* ==================================================
   APP MOUNT
   ================================================== */
function renderApp() {
  const app = document.getElementById('app');
  app.innerHTML =
    renderHero() +
    renderProjectsSection() +
    renderSkillsSection() +
    renderEventsSection() +
    renderValuePropsSection() +
    renderHelpYourselfSection();

  mountProjects();
  mountSkills();
  mountEvents();
  mountHelpYourself();
}

renderApp();
</script>
