<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Lizi Zivzivadze — Electromechanical Engineer</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>

<style>
/* =====================================================================
   SECTION 1: GLOBAL ARCHITECTURE & DESIGN TOKENS
   ===================================================================== */
:root{
  --bg-main:#FAFAFA;
  --bg-surface:#FFFFFF;
  --text-primary:#0F172A;
  --text-secondary:#475569;
  --text-muted:#64748B;
  --border-color:#E2E8F0;
  --accent-primary:#2563EB;
  --accent-hover:#1D4ED8;
  --accent-subtle:#EFF6FF;
  --font-primary:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --font-mono:'JetBrains Mono','Fira Code','Courier New',monospace;
}

*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
html{ scroll-behavior:smooth; font-size:16px; }
body{
  font-family:var(--font-primary);
  background:var(--bg-main);
  color:var(--text-primary);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
img{ display:block; max-width:100%; }
button{ font:inherit; background:none; border:none; }
a{ color:inherit; text-decoration:none; }

.portfolio-container{
  width:100%;
  padding:15px;
  padding-bottom:96px; /* clearance above sticky footer */
}
@media (min-width:768px){
  .portfolio-container{
    max-width:520px;
    margin-left:auto;
    margin-right:auto;
  }
  .projects-carousel .project-card,
  .events-carousel .event-card,
  .value-carousel .value-card{
    width:calc(480px - 30px - 12px - 7px);
    min-width:calc(480px - 30px - 12px - 7px);
    max-width:calc(480px - 30px - 12px - 7px);
  }
  .sticky-header,.sticky-footer{
    left:50%;
    transform:translateX(-50%);
    max-width:480px;
    width:100%;
  }
  .sticky-header.visible{ transform:translate(-50%,0); }
}

/* Shared section card shell */
.profile-card,
.projects-card-container,
.skills-card,
.events-card-container,
.value-card-container,
.help-yourself-card-container{
  background:var(--bg-surface);
  border:1px solid var(--border-color);
  border-radius:8px;
  margin-bottom:24px;
  box-shadow:0 1px 3px 0 rgba(0,0,0,0.05);
}

.section-title{
  font-family:var(--font-primary);
  font-size:22px;
  font-weight:700;
  color:var(--text-primary);
  text-align:center;
  margin-top:0;
  margin-bottom:16px;
  letter-spacing:0.05em;
}
.single-line-title{
  font-size:clamp(15px,4.2vw,20px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  width:100%;
  letter-spacing:0.04em;
}

/* =====================================================================
   SECTION 2: PROFILE COMPONENT
   ===================================================================== */
.profile-card{ padding:15px; }
.profile-top-row{
  display:flex;
  flex-direction:row;
  align-items:center;
  flex-wrap:nowrap;
  gap:16px;
}
.profile-photo-wrap{ width:88px; height:88px; flex-shrink:0; }
.profile-photo{
  width:88px; height:88px;
  object-fit:cover;
  border-radius:50%;
  border:1px solid var(--border-color);
}
.profile-content-col{
  flex-grow:1;
  width:100%;
  min-width:0;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  height:88px;
}
.profile-name{
  font-family:var(--font-primary);
  font-size:22px;
  font-weight:700;
  color:var(--text-primary);
  text-transform:capitalize;
  line-height:26px;
  margin:0; padding:0;
  width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.profile-title{
  font-family:var(--font-mono);
  font-size:15px;
  font-weight:500;
  color:var(--text-secondary);
  line-height:20px;
  margin:0; padding:0;
  width:100%;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.profile-actions{
  display:flex;
  flex-direction:row;
  justify-content:space-between;
  align-items:center;
  width:100%;
  height:24px;
}
.action-btn svg{
  width:20px; height:20px;
  stroke:var(--text-secondary);
  transition:stroke 0.2s ease;
}
.action-btn:hover svg{ stroke:var(--accent-primary); }

.personal-statement{
  margin-top:12px;
  padding-top:0;
  font-family:var(--font-primary);
  font-size:16px;
  font-weight:400;
  color:var(--text-secondary);
  line-height:22px;
  max-height:66px;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* =====================================================================
   SHARED: FILTER BARS, CAROUSELS, CARDS  (Sections 3 & 5)
   ===================================================================== */
.projects-card-container,.events-card-container{ padding:15px; }

.projects-filter-bar{
  display:flex; flex-direction:row; justify-content:center; align-items:center;
  gap:8px; margin-bottom:20px; flex-wrap:wrap;
}
.events-filter-bar{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px;
  width:100%; margin-bottom:20px; box-sizing:border-box;
}

.filter-btn{
  font-family:var(--font-mono); font-size:13px; font-weight:600;
  padding:6px 14px; border-radius:6px; cursor:pointer; transition:all 0.2s ease;
  border:1px solid var(--border-color);
  background:var(--bg-main); color:var(--text-secondary);
}
.filter-btn.active{ background:var(--accent-primary); color:#FFFFFF; border-color:var(--accent-primary); }

.event-filter-btn{
  height:36px; padding:0 4px;
  font-family:var(--font-mono); font-size:13px; font-weight:600;
  border-radius:6px; cursor:pointer; transition:all 0.2s ease;
  border:1px solid var(--border-color);
  background:var(--bg-main); color:var(--text-secondary);
  text-align:center; text-transform:uppercase;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  display:flex; align-items:center; justify-content:center;
}
.event-filter-btn.active{ background:var(--accent-primary); color:#FFFFFF; border-color:var(--accent-primary); }

.projects-carousel,.events-carousel,.value-carousel{
  display:flex; flex-direction:row; gap:12px;
  overflow-x:auto; scroll-snap-type:x mandatory;
  padding:4px; margin:0 -4px;
  scrollbar-width:none; -ms-overflow-style:none;
}
.projects-carousel::-webkit-scrollbar,
.events-carousel::-webkit-scrollbar,
.value-carousel::-webkit-scrollbar{ display:none; }

.project-card,.event-card{
  width:calc(100vw - 60px - 12px - 7px);
  min-width:calc(100vw - 60px - 12px - 7px);
  max-width:calc(100vw - 60px - 12px - 7px);
  scroll-snap-align:start; flex-shrink:0;
  height:460px;
  background:var(--bg-surface);
  border:1px solid var(--border-color);
  border-radius:8px;
  padding:12px;
  display:flex; flex-direction:column; overflow:hidden; box-sizing:border-box;
}

.card-video-container,.card-photo-container{
  width:100%; aspect-ratio:16/9; border-radius:6px; overflow:hidden;
  margin-bottom:10px; position:relative; background:#000000;
}
.card-photo-container{ background:#F1F5F9; }
.card-video-container .project-video{ width:100%; height:100%; }
.event-cover-photo{ width:100%; height:100%; object-fit:cover; display:block; }

.video-placeholder{
  width:100%; height:100%; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:6px;
  background:linear-gradient(135deg,#0F172A,#1E293B); color:#94A3B8;
}
.video-placeholder svg{ width:26px; height:26px; stroke:#64748B; }
.video-placeholder span{
  font-family:var(--font-mono); font-size:11px; letter-spacing:0.05em; text-transform:uppercase;
}

.card-header{ height:48px; }
.card-title{
  font-family:var(--font-primary); font-size:17px; font-weight:700; color:var(--text-primary);
  margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:22px;
}
.card-description{
  font-family:var(--font-primary); font-size:14px; font-weight:400; color:var(--text-secondary);
  margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:18px;
}

.card-subnav{
  display:flex; flex-direction:row; gap:6px; width:100%;
  margin-top:8px; margin-bottom:8px; padding-bottom:0; border-bottom:none;
}
.subtab-btn,.event-subtab-btn{
  font-family:var(--font-mono); font-size:12px; font-weight:600;
  padding:6px 10px; border-radius:4px; cursor:pointer; flex-grow:1; text-align:center;
  border:1px solid var(--border-color);
  background:var(--bg-main); color:var(--text-secondary);
}
.subtab-btn.active,.event-subtab-btn.active{
  background:var(--accent-primary); color:#FFFFFF; border-color:var(--accent-primary);
}
.subtab-url-btn{
  background:var(--bg-main); color:var(--accent-primary); text-decoration:none; border-color:var(--border-color);
}

.card-tab-content{ flex-grow:1; width:100%; height:170px; overflow-y:hidden; box-sizing:border-box; }
.pane-overview,.event-pane-overview{ font-family:var(--font-primary); font-size:14px; color:var(--text-secondary); line-height:20px; display:none; }
.pane-overview.active,.event-pane-overview.active{ display:block; }
.pane-line strong{ color:var(--text-primary); }

.pane-techstack{ display:none; flex-wrap:wrap; gap:6px; align-content:flex-start; }
.pane-techstack.active{ display:flex; }
.tech-badge{
  font-family:var(--font-mono); font-size:12px; font-weight:500;
  background:var(--accent-subtle); color:var(--accent-primary);
  border:1px solid #BFDBFE; padding:4px 8px; border-radius:4px;
  white-space:nowrap; flex:0 1 calc(33.333% - 6px); text-align:center; box-sizing:border-box;
}

.event-pane-media{ display:none; grid-template-columns:repeat(2,1fr); gap:6px; width:100%; }
.event-pane-media.active{ display:grid; }
.lightbox-thumb{
  width:100%; height:75px; object-fit:cover; border-radius:4px; cursor:pointer;
  border:1px solid var(--border-color); transition:transform 0.2s ease;
}
.lightbox-thumb:hover{ transform:scale(1.03); }
.lightbox-overlay{
  position:fixed; top:0; left:0; width:100vw; height:100vh;
  background:rgba(15,23,42,0.85); display:none; align-items:center; justify-content:center; z-index:9999;
}
.lightbox-overlay.open{ display:flex; }
.lightbox-overlay img{
  max-width:90vw; max-height:80vh; border-radius:8px; box-shadow:0 10px 25px rgba(0,0,0,0.5);
}

/* =====================================================================
   SECTION 4: SKILLSETS
   ===================================================================== */
.skills-card{ padding:16px; }
.skillset-tabs-grid{
  display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:20px;
}
.skill-tab{
  height:36px; padding:0 8px;
  font-family:var(--font-mono); font-size:13px; font-weight:600;
  text-align:center; text-transform:uppercase; border-radius:6px; cursor:pointer;
  transition:all 0.2s ease; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  background:var(--bg-main); color:var(--text-secondary); border:1px solid var(--border-color);
}
.skill-tab.active{ background:var(--accent-primary); color:#FFFFFF; border-color:var(--accent-primary); }

.skills-display-box{
  background:var(--bg-main); border:1px solid var(--border-color); border-radius:6px;
  padding:16px; display:flex; flex-direction:column; gap:14px;
}
.skills-inner-title{
  font-family:var(--font-primary); font-size:18px; font-weight:600; color:var(--text-primary);
  text-align:center; margin-top:0; margin-bottom:16px;
}
.skill-row{ display:none; flex-direction:column; gap:6px; width:100%; }
.skill-row.active{ display:flex; }
.skill-meta-line{ display:flex; justify-content:space-between; align-items:center; width:100%; }
.skill-name{ font-family:var(--font-primary); font-size:15px; font-weight:600; color:var(--text-primary); }
.skill-percentage{ font-family:var(--font-mono); font-size:14px; font-weight:500; color:var(--accent-primary); }
.progress-track{ width:100%; height:8px; background:#E2E8F0; border-radius:4px; overflow:hidden; position:relative; }
.progress-fill{
  height:100%; width:0%; background:var(--accent-primary); border-radius:4px;
  transition:width 0.8s cubic-bezier(0.4,0,0.2,1);
}

/* =====================================================================
   SECTION 6: WHAT DO I BRING TO THE TABLE
   ===================================================================== */
.value-card-container{ padding:15px; }
.value-card{
  width:calc(100vw - 60px - 12px - 7px);
  min-width:calc(100vw - 60px - 12px - 7px);
  max-width:calc(100vw - 60px - 12px - 7px);
  scroll-snap-align:start; flex-shrink:0;
  height:230px;
  background:var(--bg-surface); border:1px solid var(--border-color); border-radius:8px;
  padding:16px 20px; display:flex; flex-direction:column; justify-content:center;
  align-items:flex-start; overflow:hidden; box-sizing:border-box;
}
.value-card-header{ display:flex; align-items:center; gap:10px; margin-bottom:10px; width:100%; }
.value-card-icon{
  width:26px; height:26px; display:flex; align-items:center; justify-content:center;
  color:var(--accent-primary); flex-shrink:0;
}
.value-card-icon svg{ width:22px; height:22px; stroke:var(--accent-primary); stroke-width:2; }
.value-card-title{
  font-family:var(--font-primary); font-size:18px; font-weight:700; color:var(--text-primary);
  line-height:22px; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.value-card-text{
  font-family:var(--font-primary); font-size:15.5px; font-weight:400; color:var(--text-secondary);
  line-height:22px; max-height:66px;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; text-overflow:ellipsis;
}

/* =====================================================================
   SECTION 7: HELP YOURSELF
   ===================================================================== */
.help-yourself-card-container{ padding:15px; }
.help-yourself-form-stack{ display:flex; flex-direction:column; gap:12px; width:100%; box-sizing:border-box; }

.file-select-box{
  height:50px; min-height:50px; width:100%; display:flex; align-items:center;
  padding:0 16px; border-radius:8px; box-sizing:border-box; cursor:pointer;
  user-select:none; transition:all 0.2s ease;
  background:var(--bg-surface); border:1px solid var(--border-color); color:var(--text-secondary);
}
.file-checkbox{ position:absolute; opacity:0; pointer-events:none; }
.file-select-box:has(.file-checkbox:checked){
  background:#EFF6FF; border:1.5px solid var(--accent-primary); color:var(--accent-primary);
}
.file-box-content{ display:flex; align-items:center; width:100%; }
.file-icon{ width:22px; height:22px; flex-shrink:0; stroke:currentColor; }
.file-label{
  font-family:var(--font-primary); font-size:16px; font-weight:600; margin-left:12px;
  text-transform:uppercase; flex-grow:1;
}
.checkbox-indicator{
  width:20px; height:20px; border:2px solid var(--border-color); border-radius:4px; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:all 0.2s ease;
}
.checkbox-indicator svg{ width:14px; height:14px; stroke:#FFFFFF; opacity:0; transition:opacity 0.15s ease; }
.file-select-box:has(.file-checkbox:checked) .checkbox-indicator{ background:#2563EB; border-color:#2563EB; }
.file-select-box:has(.file-checkbox:checked) .checkbox-indicator svg{ opacity:1; }

#recipient-email{
  height:50px; min-height:50px; width:100%;
  background:var(--bg-surface); border:1px solid var(--border-color); border-radius:8px;
  padding:0 16px; box-sizing:border-box; font-family:var(--font-primary); font-size:16px;
  color:var(--text-primary); outline:none;
}
#recipient-email:focus{ outline:1.5px solid var(--accent-primary); }
#recipient-email::placeholder{ color:#94A3B8; font-family:var(--font-primary); font-size:16px; }

.send-action-btn{
  height:50px; min-height:50px; width:100%; background:var(--accent-primary); color:#FFFFFF;
  border:none; border-radius:8px; font-family:var(--font-primary); font-size:17px; font-weight:700;
  letter-spacing:0.05em; text-transform:uppercase; cursor:pointer; transition:background 0.2s ease;
  box-sizing:border-box; display:flex; align-items:center; justify-content:center; gap:8px;
}
.send-action-btn:hover:not(:disabled){ background:var(--accent-hover); }
.send-action-btn:disabled{ opacity:0.5; cursor:not-allowed; }
.send-action-btn.success{ background:#16A34A; }
.spinner{
  width:16px; height:16px; border:2px solid rgba(255,255,255,0.4); border-top-color:#FFFFFF;
  border-radius:50%; animation:spin 0.7s linear infinite;
}
@keyframes spin{ to{ transform:rotate(360deg); } }

/* =====================================================================
   SECTION 8: STICKY HEADER
   ===================================================================== */
.sticky-header{
  position:fixed; top:0; left:0; width:100%; height:44px; min-height:44px; z-index:100;
  display:flex; align-items:center; justify-content:space-between;
  padding:0 15px; box-sizing:border-box;
  border-bottom:1px solid rgba(226,232,240,0.8);
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  opacity:0; transform:translateY(-100%); pointer-events:none;
  transition:opacity 0.2s ease, transform 0.2s ease;
}
.sticky-header.visible{ opacity:1; transform:translateY(0); pointer-events:auto; }
.sticky-header-left{ display:flex; align-items:center; gap:8px; }
.header-mini-avatar{
  width:30px; height:30px; border-radius:50%; object-fit:cover; flex-shrink:0;
  border:1px solid var(--border-color);
}
.header-full-name{
  font-family:var(--font-primary); font-size:16px; font-weight:700; color:var(--text-primary);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.sticky-header-right{ margin-left:auto; display:flex; align-items:center; height:100%; width:auto; }

/* =====================================================================
   SECTION 9: STICKY FOOTER
   ===================================================================== */
.sticky-footer{
  position:fixed; bottom:0; left:0; width:100%; height:auto; z-index:90;
  background:rgba(255,255,255,0.90); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  border-top:1px solid var(--border-color); padding:8px 15px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  box-sizing:border-box;
}
.footer-line-1,.footer-line-2{ display:flex; align-items:center; justify-content:center; width:100%; gap:6px; }
.footer-copyright-text{
  font-family:var(--font-mono); font-size:14.5px; font-weight:700; color:var(--text-primary); text-align:center;
}
.status-pulse-dot{
  width:8px; height:8px; border-radius:50%; background:#22C55E; position:relative; flex-shrink:0;
  animation:status-pulse 2s infinite;
}
@keyframes status-pulse{
  0%{ box-shadow:0 0 0 0 rgba(34,197,94,0.7); }
  70%{ box-shadow:0 0 0 6px rgba(34,197,94,0); }
  100%{ box-shadow:0 0 0 0 rgba(34,197,94,0); }
}
.footer-status-text{
  font-family:var(--font-mono); font-size:13.5px; font-weight:500; color:var(--text-secondary);
  text-transform:uppercase; letter-spacing:0.04em; text-align:center;
}

/* Accessibility */
a:focus-visible,button:focus-visible,input:focus-visible{
  outline:2px solid var(--accent-primary); outline-offset:2px;
}
@media (prefers-reduced-motion:reduce){
  *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
}
</style>
</head>
<body>

<!-- Lightbox (global, shared by all event media galleries) -->
<div id="lightbox-modal" class="lightbox-overlay" onclick="closeLightbox()">
  <img id="lightbox-img" src="" alt="Enlarged Media">
</div>

<!-- SECTION 8: Sticky Header -->
<header id="sticky-header" class="sticky-header">
  <div class="sticky-header-left">
    <img id="header-mini-avatar" src="" alt="Profile Mini" class="header-mini-avatar">
    <span id="header-full-name" class="header-full-name"></span>
  </div>
  <div class="sticky-header-right"></div>
</header>

<main class="portfolio-container">

  <!-- SECTION 2: Profile -->
  <section id="profile-section" class="profile-card">
    <div class="profile-top-row">
      <div class="profile-photo-wrap">
        <img id="profile-photo" src="" alt="Lizi Zivzivadze Profile Photo" class="profile-photo">
      </div>
      <div class="profile-content-col">
        <h1 id="profile-name" class="profile-name"></h1>
        <p id="profile-title" class="profile-title"></p>
        <nav class="profile-actions" id="profile-actions"></nav>
      </div>
    </div>
    <p id="personal-statement" class="personal-statement"></p>
  </section>

  <!-- SECTION 3: Projects -->
  <section id="projects-section" class="projects-card-container">
    <h2 class="section-title">PROJECTS</h2>
    <nav class="projects-filter-bar">
      <button class="filter-btn active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="hw-sw">HW+SW</button>
      <button class="filter-btn" data-filter="hw"><b>H</b>ard<b>W</b>are</button>
      <button class="filter-btn" data-filter="sw"><b>S</b>oft<b>W</b>are</button>
    </nav>
    <div class="projects-carousel" id="projects-carousel"></div>
  </section>

  <!-- SECTION 4: Skillsets -->
  <section id="skills-section" class="skills-card">
    <h2 class="section-title">SKILLSETS</h2>
    <nav class="skillset-tabs-grid" id="skillset-tabs-grid"></nav>
    <div class="skills-display-box">

    return `

        <div class="progress-fill" style="width:0%;" data-target-width="${s.pct}%"></div>
      </div>
    </div>`;
  }).join('');

  // apply the 14px gap manually since rows are injected as flat HTML
  const container = rowsWrap;
  container.style.display = 'flex';
  container.style.flexDirection = 'column';
  container.style.gap = '14px';

  animateVisibleFills();
}
function animateVisibleFills(){
  document.querySelectorAll('.skill-row.active .progress-fill').forEach(function(f){ f.style.width = '0%'; });
  setTimeout(function(){
    document.querySelectorAll('.skill-row.active .progress-fill').forEach(function(f){
      f.style.width = f.getAttribute('data-target-width');
    });
  }, 50);
}

  btn.classList.add('active');
  const tab = btn.dataset.tab;
  card.querySelector('.event-pane-overview').classList.toggle('active', tab === 'overview');
  card.querySelector('.event-pane-media').classList.toggle('active', tab === 'media');
});

/* =====================================================================
   INTERACTION: SKILLSET TABS + FILL ANIMATION
   ===================================================================== */
document.getElementById('skillset-tabs-grid').addEventListener('click', function(e){
  const btn = e.target.closest('.skill-tab');
  if(!btn) return;
  document.querySelectorAll('.skill-tab').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  const skillset = btn.dataset.skillset;
  document.querySelectorAll('.skill-row').forEach(function(row){
    row.classList.toggle('active', row.dataset.category === skillset);
  });
  animateVisibleFills();
});

/* =====================================================================
   INTERACTION: LIGHTBOX
   ===================================================================== */
function openLightbox(src){
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox-modal').classList.add('open');
}
function closeLightbox(){
  document.getElementById('lightbox-modal').classList.remove('open');
  document.getElementById('lightbox-img').src = '';
}
document.getElementById('lightbox-img').addEventListener('click', function(e){ e.stopPropagation(); });

/* =====================================================================
   INTERACTION: STICKY HEADER VISIBILITY (IntersectionObserver)
   ===================================================================== */
const stickyHeader = document.getElementById('sticky-header');
const profileSection = document.getElementById('profile-section');
new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    stickyHeader.classList.toggle('visible', !entry.isIntersecting);
  });
}, { threshold: 0 }).observe(profileSection);

/* =====================================================================
   INTERACTION: HELP YOURSELF FORM
   ===================================================================== */
const form = document.getElementById('help-yourself-form');
const emailInput = document.getElementById('recipient-email');
const sendBtn = document.getElementById('send-pdf-btn');
const fileChecks = document.querySelectorAll('.file-checkbox');

// TODO: point this at a real Formspree / EmailJS / serverless endpoint before going live.
const FORM_ENDPOINT = null;
const OWNER_EMAIL = PORTFOLIO_DATA.profile.email;

function validateForm(){
  const anySelected = Array.from(fileChecks).some(function(c){ return c.checked; });
  const emailValid = emailInput.checkValidity() && emailInput.value.trim().length > 0;
  sendBtn.disabled = !(anySelected && emailValid);
}
fileChecks.forEach(function(c){ c.addEventListener('change', validateForm); });
emailInput.addEventListener('input', validateForm);

form.addEventListener('submit', function(e){
  e.preventDefault();
  if(sendBtn.disabled) return;

  const selectedFiles = Array.from(fileChecks).filter(function(c){ return c.checked; }).map(function(c){ return c.value; });
  const userEmail = emailInput.value.trim();
  const originalLabel = 'SEND';

  sendBtn.disabled = true;
  sendBtn.innerHTML = '<span class="spinner"></span> SENDING...';

  const payload = {
    recipient: userEmail,
    files: selectedFiles,
    owner: OWNER_EMAIL,
    subject: "Portfolio Alert: Asset Requested",
    body: "User " + userEmail + " requested " + selectedFiles.join(', ') + " at " + new Date().toISOString()
  };

  const dispatch = FORM_ENDPOINT
    ? fetch(FORM_ENDPOINT, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) })
    : Promise.resolve(); // no endpoint configured yet — simulate locally

  dispatch.then(function(){
    sendBtn.classList.add('success');
    sendBtn.innerHTML = 'SENT ✓';
    setTimeout(function(){
      sendBtn.classList.remove('success');
      sendBtn.innerHTML = originalLabel;
      form.reset();
      validateForm();
    }, 4000);
  }).catch(function(err){
    console.error('Send failed:', err);
    sendBtn.innerHTML = 'ERROR — TRY AGAIN';
    setTimeout(function(){
      sendBtn.innerHTML = originalLabel;
      validateForm();
    }, 2500);
  });
});

/* =====================================================================
   INIT
   ===================================================================== */
renderProfile();
renderProjects();
renderSkills();
renderEvents();
renderValueCards();
validateForm();
</script>
